<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WEB BEAT : SECURE</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        :root { 
            --bg: #050505; 
            --accent: #00e5ff; 
            --secondary: #ff0055; 
            --text: #fff; 
            --fever-gold: #ffd700; 
            --fever-max: #00ff00; 
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; user-select: none; display: flex; justify-content: center; align-items: center; }
        
        canvas.game { touch-action: none; -webkit-user-select: none; user-select: none; }
        body.mobile-mode #game-canvas-container { width: 100% !important; border: none; }

        /* BGA Layer */
        /* BGA Layer → 곡 이미지 전체화면 블러 배경 */
        #bga-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; background: #000; }
        #bga-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
            filter: blur(14px) brightness(0.4) saturate(1.1); transform: scale(1.1); display: none; }
        #bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        #bga-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.75) 100%); }
        
        .effect-glitch { animation: glitch-anim 0.2s infinite; background: rgba(255, 0, 85, 0.1); }
        .effect-flash { animation: flash-anim 0.5s forwards; }
        @keyframes glitch-anim { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
        @keyframes flash-anim { 0% { background-color: rgba(255,255,255,0.5); } 100% { background-color: transparent; } }

        /* Game View */
        #game-view { position: relative; width: 100%; height: 100%; display: flex; flex-direction: row; align-items: stretch; justify-content: center; z-index: 10; gap: 15px; }
        .side-warn-col { width: 100px; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.1s; pointer-events: none; text-shadow: 0 0 10px currentColor; }
        .chevron { width: 50px; height: 50px; border-top: 10px solid currentColor; border-right: 10px solid currentColor; transform: rotate(-45deg); margin: 10px 0; opacity: 0.5; }
        .warn-label { font-family: 'Orbitron'; font-weight:900; font-size: 28px; margin: 20px 0; text-align: center; line-height: 1.1; filter: drop-shadow(0 0 5px currentColor); }
        .warn-up { opacity: 1; color: #ff0055; } .warn-up .chevron { animation: neon-pulse 0.2s infinite alternate; } .warn-up .warn-label { animation: flicker 0.1s infinite; }
        .warn-down { opacity: 1; color: #00e5ff; } .warn-down .chevron { transform: rotate(135deg); animation: neon-pulse-down 0.4s infinite alternate; }
        @keyframes neon-pulse { from { opacity: 0.4; transform: translateY(0) rotate(-45deg); filter: drop-shadow(0 0 2px currentColor); } to { opacity: 1; transform: translateY(-5px) rotate(-45deg); filter: drop-shadow(0 0 15px currentColor); } }
        @keyframes neon-pulse-down { from { opacity: 0.4; transform: translateY(0) rotate(135deg); } to { opacity: 1; transform: translateY(5px) rotate(135deg); } }
        @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        #game-canvas-container { 
            position: absolute; inset: 0; width: 100%; height: 100%;
            background: transparent; flex-shrink: 0;
            transition: box-shadow 0.5s;
        }
        #game-canvas-container.fever-mode,
        #game-canvas-container.fever-max-mode {
            box-shadow: inset 0 0 58px rgba(0, 229, 255, 0.14), inset 0 0 0 1px rgba(0, 229, 255, 0.1);
        }
        #game-canvas-container.fever-level-2 {
            box-shadow: inset 0 0 68px rgba(255, 214, 82, 0.18), inset 0 0 0 1px rgba(255, 214, 82, 0.2);
        }
        #game-canvas-container.fever-level-3 {
            box-shadow: inset 0 0 82px rgba(120, 255, 180, 0.22), inset 0 0 0 1px rgba(120, 255, 180, 0.26);
        }

        .side-warn-col { display: none; }
        #speed-edge-warning {
            position: absolute;
            inset: 0;
            z-index: 65;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
        }
        #speed-edge-warning::before {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 0 0 transparent;
            transition: box-shadow 0.12s ease;
        }
        #speed-edge-warning .speed-edge-label {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(15px, 1.5vw, 18px);
            letter-spacing: 0;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 0 7px currentColor, 0 0 14px currentColor;
        }
        #speed-edge-warning.speed-edge-up,
        #speed-edge-warning.speed-edge-down {
            opacity: 1;
        }
        #speed-edge-warning.speed-edge-up {
            color: #ff2d55;
        }
        #speed-edge-warning.speed-edge-up::before {
            animation: speedEdgeUp 1.5s ease-out forwards;
        }
        #speed-edge-warning.speed-edge-down {
            color: #00d5ff;
        }
        #speed-edge-warning.speed-edge-down::before {
            animation: speedEdgeDown 1.5s ease-out forwards;
        }
        @keyframes speedEdgeUp {
            0% { box-shadow: inset 0 0 0 0 rgba(255, 45, 85, 0); }
            16% { box-shadow: inset 0 0 32px 7px rgba(255, 45, 85, 0.28); }
            100% { box-shadow: inset 0 0 44px 5px rgba(255, 45, 85, 0); }
        }
        @keyframes speedEdgeDown {
            0% { box-shadow: inset 0 0 0 0 rgba(0, 213, 255, 0); }
            16% { box-shadow: inset 0 0 32px 7px rgba(0, 213, 255, 0.26); }
            100% { box-shadow: inset 0 0 44px 5px rgba(0, 213, 255, 0); }
        }

        canvas.game { display: block; width: 100%; height: 100%; }
        
        #game-hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
        .hud-item { position: absolute; }
        .hud-rate { top: 16px; left: 24px; text-align: left; }
        .hud-score { top: 16px; right: 24px; text-align: right; }
        .hud-combo { left: 50%; top: 48%; transform: translate(-50%,-50%); text-align: center; opacity: 0.18; }
        .hud-text { font-family: 'Orbitron', monospace; font-weight: 900; font-size: 30px; color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.4); transition: color 0.2s, text-shadow 0.2s; }
        .hud-sub { font-family: 'Segoe UI', sans-serif; font-size: 10px; color: #666; font-weight: 700; letter-spacing: 1px; }
        .hud-combo .hud-sub { display: none; }
        .hud-combo .hud-text { font-size: 150px; line-height: 1; text-shadow: 0 0 30px rgba(255,255,255,0.25); }
        
        #finish-effect { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 100%; text-align: center; pointer-events: none; z-index: 80; }
        .text-fc { font-family: 'Orbitron', sans-serif; font-size: 60px; color: #00e5ff; text-shadow: 0 0 20px #00e5ff, 0 0 40px #fff; animation: popIn 0.5s forwards; font-style: italic; }
        .text-glitch { position: relative; font-family: 'Orbitron', sans-serif; font-weight:900; font-size: 70px; color: #fff; text-transform: uppercase; letter-spacing: 5px; animation: shake 0.3s infinite; }
        .text-glitch::before, .text-glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; }
        .text-glitch::before { left: 2px; text-shadow: -2px 0 #ff0055; clip-path: polygon(0 0, 100% 0, 100% 30%, 0 30%); animation: glitch-1 2s infinite linear alternate-reverse; }
        .text-glitch::after { left: -2px; text-shadow: -2px 0 #00e5ff; clip-path: polygon(0 40%, 100% 40%, 100% 100%, 0 100%); animation: glitch-2 3s infinite linear alternate-reverse; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1.2); } }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 100% { transform: translate(-1px, -2px) rotate(-1deg); } }

        .res-badge { margin: 10px 0 30px 0; font-size: 40px; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
        .badge-fc { color: #00e5ff; text-shadow: 0 0 15px #00e5ff; animation: pulse 1s infinite; }
        .badge-ap { color: #ff0055; text-shadow: 2px 2px 0 #fff, 0 0 20px #ff0055; animation: shake 0.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

        .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 300; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .res-rank { font-family: 'Orbitron', sans-serif; font-weight:900; font-size: 140px; color: #fff; text-shadow: 0 0 40px currentColor; margin-bottom: 10px; line-height: 1; }
        .res-info { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; width: 80%; max-width: 600px; margin-bottom: 30px; }
        .res-box { text-align: center; }
        .res-label { color: #888; font-size: 12px; margin-bottom: 5px; font-weight:bold; letter-spacing:1px; } 
        .res-val { color: #fff; font-size: 24px; font-family: 'Orbitron', sans-serif; }
        .res-detail { display: flex; justify-content: space-between; width: 90%; max-width: 500px; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .detail-item { text-align: center; }
        .detail-label { font-size: 11px; font-weight: bold; margin-bottom: 5px; opacity:0.7; }
        .detail-val { font-size: 20px; color: #fff; font-family: 'Orbitron', sans-serif; }

        #result-overlay {
            overflow: hidden;
            background:
                linear-gradient(100deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.82) 38%, rgba(0,0,0,0.96) 100%),
                radial-gradient(circle at 78% 22%, rgba(0,229,255,0.18), transparent 34%),
                radial-gradient(circle at 18% 82%, rgba(255,45,120,0.1), transparent 38%);
            align-items: flex-end;
            justify-content: stretch;
            backdrop-filter: blur(8px);
        }
        #result-overlay::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 0%, rgba(0,229,255,0.12) 48%, transparent 56%);
            transform: translateX(110%);
            pointer-events: none;
        }
        #result-overlay.result-show::before { animation: resultSweep 0.72s cubic-bezier(.2,.8,.2,1) forwards; }
        .result-panel {
            position: relative;
            width: min(610px, 88vw);
            min-height: auto;
            max-height: calc(100vh - 24px);
            margin: 12px 20px 12px 0;
            padding: 24px 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(180deg, rgba(8,12,18,0.92), rgba(2,3,7,0.96));
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: -28px 0 70px rgba(0,0,0,0.44), inset 1px 0 0 rgba(0,229,255,0.14);
            transform: translateX(105%);
            overflow: hidden;
        }
        #result-overlay.result-show .result-panel { animation: resultPanelIn 0.72s cubic-bezier(.16,.82,.24,1) 0.08s forwards; }
        .result-topline { color: rgba(255,255,255,0.48); font-family:'Orbitron'; font-size: 10px; letter-spacing: 0; margin-bottom: 6px; }
        .result-head { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; margin-bottom: 12px; }
        .result-title { min-width: 0; }
        .result-rank-wrap { text-align: right; }
        .result-rank-wrap::before {
            content: 'RANK';
            display: block;
            margin-bottom: 4px;
            color: rgba(255,255,255,0.44);
            font-family: 'Orbitron';
            font-size: 10px;
            letter-spacing: 0;
        }
        .res-song-title { text-align:left; font-size: 34px; line-height: 1.05; margin-bottom: 8px; }
        .res-diff-name { text-align:left; margin-bottom: 0; font-size: 14px; letter-spacing: 3px; }
        .res-rank {
            margin: 0;
            min-width: 128px;
            padding: 5px 14px 8px;
            border: 1px solid color-mix(in srgb, currentColor 36%, transparent);
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.015));
            font-size: clamp(52px, 8vw, 84px);
            letter-spacing: 0;
            text-align: center;
            box-shadow: inset 0 0 24px rgba(255,255,255,0.04), 0 0 22px color-mix(in srgb, currentColor 22%, transparent);
            animation: rankReveal 0.65s cubic-bezier(.2,.9,.2,1) 0.62s both;
        }
        .res-rank::after {
            content: '';
            display: block;
            width: 70%;
            height: 2px;
            margin: 3px auto 0;
            background: currentColor;
            opacity: 0.55;
            box-shadow: 0 0 12px currentColor;
        }
        .rank-tb { color:#fff; text-shadow: 0 0 18px #fff, 0 0 34px #00e5ff, 0 0 60px #ff2d78; }
        .rank-sp, .rank-s { color:#00e5ff; text-shadow: 0 0 24px #00e5ff, 0 0 54px rgba(0,229,255,0.7); }
        .rank-ap, .rank-a { color:#00ff88; text-shadow: 0 0 22px #00ff88, 0 0 48px rgba(0,255,136,0.55); }
        .rank-b { color:#6aa7ff; text-shadow: 0 0 22px #3b9eff; }
        .rank-c { color:#ffc832; text-shadow: 0 0 22px #ffc832; }
        .rank-failed { color:#ff4455; text-shadow: 0 0 24px #ff4455; }
        .res-info {
            width: 100%;
            max-width: none;
            gap: 7px;
            margin-bottom: 9px;
        }
        .res-box {
            padding: 8px 10px;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.09);
            text-align: left;
        }
        .res-val { font-size: 20px; }
        .res-val.primary-score { font-size: 27px; color:#fff; text-shadow: 0 0 18px rgba(0,229,255,0.42); }
        .result-detail-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 100%;
            margin-bottom: 8px;
        }
        .result-detail-grid .detail-item {
            padding: 6px 5px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
        }
        .result-ranking { width: 100%; }
        .result-ranking > div {
            width: 100% !important;
            max-width: none !important;
            margin-top: 6px !important;
            padding: 6px 8px !important;
            font-size: 13px !important;
        }
        .result-ranking > div > div {
            margin-bottom: 3px !important;
            font-size: 13px !important;
            line-height: 1.15;
        }
        #google-login-btn-result {
            margin-top: 6px !important;
            min-height: 0 !important;
        }
        .result-panel .btn-common {
            margin-top: 0;
            padding: 9px 28px;
            font-size: 13px;
        }
        .result-actions { display:flex; justify-content:flex-end; margin-top: 7px; }
        .result-prep {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.68);
            font-family: 'Orbitron';
            font-size: 14px;
            letter-spacing: 0;
            background: radial-gradient(circle at center, rgba(0,229,255,0.08), rgba(0,0,0,0.82) 55%);
        }
        .result-prep::after {
            content: '';
            width: 120px;
            height: 1px;
            margin-left: 14px;
            background: linear-gradient(90deg, var(--accent), transparent);
            animation: prepLine 0.8s ease-in-out infinite;
        }
        @keyframes resultSweep {
            0% { transform: translateX(110%); opacity: 0; }
            35% { opacity: 1; }
            100% { transform: translateX(-115%); opacity: 0; }
        }
        @keyframes resultPanelIn {
            0% { transform: translateX(105%); }
            100% { transform: translateX(0); }
        }
        @keyframes rankReveal {
            0% { opacity: 0; transform: translateY(18px) scale(0.86); filter: blur(8px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }
        @keyframes prepLine { 0%,100% { opacity: 0.25; transform: scaleX(0.5); } 50% { opacity: 1; transform: scaleX(1); } }
        @media (max-height: 820px) {
            .result-panel {
                transform: translateX(105%) scale(0.93);
                transform-origin: right center;
            }
            #result-overlay.result-show .result-panel { animation: resultPanelInCompact 0.72s cubic-bezier(.16,.82,.24,1) 0.08s forwards; }
        }
        @keyframes resultPanelInCompact {
            0% { transform: translateX(105%) scale(0.93); }
            100% { transform: translateX(0) scale(0.93); }
        }

        .btn-common { margin-top: 20px; padding: 15px 50px; font-size: 18px; background: transparent; color: #fff; border: 2px solid var(--accent); border-radius: 50px; cursor: pointer; font-weight: 900; font-family: 'Orbitron'; letter-spacing: 2px; transition: 0.2s; box-shadow: 0 0 15px rgba(0,229,255,0.2); text-shadow: 0 0 5px var(--accent); }
        .btn-common:hover { background: var(--accent); color: #000; box-shadow: 0 0 40px var(--accent); transform: scale(1.05); }
        .btn-secondary { border-color: #666; color: #aaa; box-shadow: none; text-shadow: none; }
        .btn-secondary:hover { background: #333; color: #fff; box-shadow: none; }
        .res-song-title { font-family: 'Orbitron'; font-size: 40px; font-weight: 900; color: #fff; text-shadow: 0 0 20px var(--accent); margin-bottom: 5px; text-align:center; }
        .res-diff-name { font-family: 'Segoe UI'; font-size: 18px; color: #aaa; letter-spacing: 5px; margin-bottom: 30px; text-transform: uppercase; font-weight: 600; }
        .result-panel .res-song-title {
            text-align: left;
            font-size: 25px;
            line-height: 1.05;
            margin-bottom: 5px;
            overflow-wrap: anywhere;
        }
        .result-panel .res-diff-name {
            text-align: left;
            margin-bottom: 0;
            font-size: 11px;
            letter-spacing: 1.8px;
        }
        .result-panel .detail-label { font-size: 10px; margin-bottom: 3px; }
        .result-panel .detail-val { font-size: 18px; }
        .result-panel .res-label { font-size: 10px; margin-bottom: 3px; letter-spacing: 1px; }

        /* Loading */
        .loading-text { font-family: 'Orbitron'; font-size: 30px; margin-bottom: 30px; animation: blink 1s infinite; letter-spacing: 3px; color: var(--accent); }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* Pause Menu - keyboard nav */
        #pause-menu { z-index: 400; }
        .pause-title { font-family: 'Orbitron'; font-size: 60px; font-weight: 900; color: #fff; letter-spacing: 10px; margin-bottom: 50px; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        .pause-options { display: flex; flex-direction: column; gap: 20px; width: 320px; }
        .pause-btn {
            padding: 18px 50px; font-size: 18px; background: transparent; color: #aaa;
            border: 2px solid #444; border-radius: 50px; cursor: pointer; font-weight: 900;
            font-family: 'Orbitron'; letter-spacing: 2px; transition: 0.15s; text-align: center;
            position: relative;
        }
        .pause-btn.selected {
            color: #fff; border-color: var(--accent);
            box-shadow: 0 0 30px rgba(0,229,255,0.5), inset 0 0 15px rgba(0,229,255,0.1);
            text-shadow: 0 0 10px var(--accent);
            transform: scale(1.04);
        }
        .pause-btn.selected::before {
            content: '▶';
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            color: var(--accent); font-size: 14px;
            animation: cursor-blink 0.6s infinite;
        }
        @keyframes cursor-blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

        #resume-countdown {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 450; display: none; justify-content: center; align-items: center;
            font-family: 'Orbitron'; font-size: 150px; font-weight: 900; color: var(--accent);
            text-shadow: 0 0 50px var(--accent); pointer-events: none;
        }

        /* Guide Message */
        #guide-message {
            position: absolute; top: 35%; left: 50%; transform: translateX(-50%);
            width: 100%; text-align: center; pointer-events: none; z-index: 70;
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 48px; color: #fff;
            text-shadow: 0 0 20px #d084ff, 0 0 40px #d084ff;
            opacity: 0; transition: opacity 0.2s, transform 0.2s;
            white-space: nowrap; letter-spacing: 2px;
        }
        .msg-active { opacity: 1 !important; transform: translateX(-50%) scale(1.1) !important; }

        /* ★ 판정 팝업 오버레이 (canvas 위에 CSS로 표시) */
        #judge-display {
            position: absolute;
            left: 50%; transform: translateX(-50%);
            bottom: calc(100% - 85%);
            pointer-events: none; z-index: 60;
            text-align: center;
            width: 300px;
        }
        .judge-popup {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 32px;
            letter-spacing: 2px;
            animation: judgeAnim 0.5s forwards;
            display: inline-block;
            white-space: nowrap;
        }
        @keyframes judgeAnim {
            0%   { opacity: 1; transform: scale(1.3) translateY(0); }
            60%  { opacity: 1; transform: scale(1.0) translateY(-15px); }
            100% { opacity: 0; transform: scale(0.9) translateY(-30px); }
        }
        /* Perfect! 레인보우 */
        .judge-perfect-ex {
            background: linear-gradient(90deg, #ff0080, #ff8c00, #ffe000, #00ff88, #00e5ff, #7b2fff, #ff0080);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: judgeAnim 0.5s forwards, rainbow-shift 0.8s linear infinite;
            filter: drop-shadow(0 0 12px #fff) drop-shadow(0 0 6px #ff0080);
            font-size: 38px;
        }
        @keyframes rainbow-shift { 0% { background-position: 0% 0%; } 100% { background-position: 300% 0%; } }
    </style>
</head>
<body>

    function evTimeMs(ev){
      if(ev.measureIdx!==undefined){

      }

    const DEFAULT_CURVE = [{x:0,y:0},{x:1,y:1}];
    function clamp01(v){return v<0?0:v>1?1:v;}
    function catmull(p0,p1,p2,p3,t){
      const t2=t*t,t3=t2*t;
      return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);
    }
    function evalCurve(pts,t){
      if(!pts||pts.length<2) return t;
      const p=[...pts].sort((a,b)=>a.x-b.x);
      t=clamp01(t);
      if(t<=p[0].x) return clamp01(p[0].y);
      if(t>=p[p.length-1].x) return clamp01(p[p.length-1].y);
      let i=0; while(i<p.length-1 && p[i+1].x<t) i++;
      const a=p[i-1]||p[i], b=p[i], c=p[i+1], d=p[i+2]||p[i+1];
      const seg=c.x-b.x; const lt=seg<=0?0:(t-b.x)/seg;
      return clamp01(catmull(a.y,b.y,c.y,d.y,lt));
    }
    // 속도 곡선: 곡선의 면적(=이동량)을 적분해 진행도로 변환 (에디터와 동일)
    function evalSpeedCurve(pts,t){
      if(!pts||pts.length<2) return t;
      t=clamp01(t);
      const STEPS=120; let total=0, partial=0;
      for(let i=0;i<STEPS;i++){
        const ta=i/STEPS, tb=(i+1)/STEPS;
        const vm=Math.max(0,evalCurve(pts,(ta+tb)/2));
        const dw=(tb-ta)*vm; total+=dw;
        if(tb<=t) partial+=dw;
        else if(ta<t) partial+=(t-ta)*vm;
      }
      if(total<=0) return t;
      return clamp01(partial/total);
    }
    function applyEasing(t,type,kf){
      switch(type){
        case 'step': return t>=1?1:0;
        case 'ease-in': return t*t*t;
        case 'ease-out': return 1-Math.pow(1-t,3);
        case 'ease-inout': return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
        case 'circ': return t<0.5
          ? (1-Math.sqrt(1-Math.pow(2*t,2)))/2
          : (Math.sqrt(1-Math.pow(-2*t+2,2))+1)/2;
        case 'custom': return evalSpeedCurve((kf&&kf.curve)?kf.curve:DEFAULT_CURVE, t);
        default: return t;
      }

    function getLineState(lane,chartMs){

      const events=lineEvents[lane];
      let cx=def.x, cy=def.y, ca=def.angle;
      if(!events||events.length===0) return {x:cx,y:cy,angle:ca};
      for(let i=0;i<events.length;i++){
        const ev=events[i];
        const startT=evTimeMs(ev);
        if(chartMs<startT) break;
        let t=(chartMs-startT)/Math.max(1,ev.duration);
        if(t>1)t=1;
        const et=applyEasing(t,ev.easing,ev);
        cx+=ev.x*et; cy+=ev.y*et; ca+=ev.angle*et;
      }
      return {x:cx,y:cy,angle:ca};
    }
    function getPulseMagnitude(lane,chartMs){

        if(evTimeMs(events[i])<=chartMs){p=events[i];break;}

      if(!p||p.type==='stop') return 0;
      const beatLen=60000/bpm;
      const phase=(chartMs-evTimeMs(p))%beatLen;
      const d=p.decay;
      if(phase>d) return 0;

      else{ const k=(u-0.12)/0.88; env=Math.pow(1-k,2); }
      return p.intensity*env;

    class Firefly {
        constructor() {
            this.x = Math.random() * bgCanvas.width;
            this.y = Math.random() * bgCanvas.height;
            this.vx = (Math.random() - 0.5) * 0.28;
            this.vy = (Math.random() - 0.5) * 0.28;
            this.size = Math.random() * 2.2 + 1.0;
            this.baseAlpha = Math.random() * 0.24 + 0.14;
            this.phase = Math.random() * Math.PI * 2;
            this.color = combo >= FEVER_LV3 ? '#78ffb4' : '#ffd652';
            this.scattering = false;
        }
        update() {
            if(this.scattering) {
                this.x += this.vx * 10;
                this.y += this.vy * 10;
                this.baseAlpha -= 0.05;
            } else {
                this.x += this.vx;
                this.y += this.vy;
                this.phase += 0.05;
                if (this.x < 0) this.x = bgCanvas.width;
                if (this.x > bgCanvas.width) this.x = 0;
                if (this.y < 0) this.y = bgCanvas.height;
                if (this.y > bgCanvas.height) this.y = 0;
            }
        }
        draw(ctx) {
            if (this.baseAlpha <= 0) return;
            const alpha = Math.max(0, this.baseAlpha + (this.scattering ? 0 : Math.sin(this.phase) * 0.08));
            ctx.globalAlpha = alpha;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 7;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        }
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));

    function fadeAudioElement(el, targetVolume, duration = 1000, pauseAtZero = false) {
        return new Promise(resolve => {
            const startVolume = el.volume;
            const startTime = performance.now();
            function step(now) {
                const t = Math.min(1, (now - startTime) / duration);
                el.volume = startVolume + (targetVolume - startVolume) * t;
                if (t < 1) {
                    requestAnimationFrame(step);
                } else {
                    el.volume = targetVolume;
                    if (pauseAtZero && targetVolume <= 0) el.pause();
                    resolve();
                }
            }
            requestAnimationFrame(step);
        });
    }

    function scheduleResultBgmFadeOut() {
        if (resultBgmFadeTimer) clearTimeout(resultBgmFadeTimer);
        resultBgmFadeTimer = setTimeout(() => {
            fadeAudioElement(resultBgm, 0, 8000, true);
            resultBgmFadeTimer = null;
        }, 30000);
    }

    async function playResultBgm(isClear) {
        const targetVolume = parseFloat(localStorage.getItem('wb_bgm_volume') || localStorage.getItem('wb_music_volume') || "0.65");
        const primarySrc = isClear ? 'BGM/result.mp3' : 'BGM/result_failed.mp3';
        const fallbackSrc = 'BGM/result.mp3';
        try {
            if (resultBgmFadeTimer) clearTimeout(resultBgmFadeTimer);
            resultBgm.pause();
            resultBgm.src = primarySrc;
            resultBgm.currentTime = 0;
            resultBgm.volume = 0;
            await resultBgm.play();
            await fadeAudioElement(resultBgm, Math.min(1, targetVolume), 1800);
            scheduleResultBgmFadeOut();
        } catch(e) {
            if (!isClear) {
                try {
                    if (resultBgmFadeTimer) clearTimeout(resultBgmFadeTimer);
                    resultBgm.pause();
                    resultBgm.src = fallbackSrc;
                    resultBgm.currentTime = 0;
                    resultBgm.volume = 0;
                    await resultBgm.play();
                    await fadeAudioElement(resultBgm, Math.min(1, targetVolume), 1800);
                    scheduleResultBgmFadeOut();
                    return;
                } catch(fallbackError) {
                    console.warn("Result BGM fallback unavailable:", fallbackError);
                }
            }
            console.warn("Result BGM unavailable:", e);
        }
    }

    async function loadGameData(song, diff) {
        const startBtn  = document.getElementById('btn-start-auto');
        try {
            logStatus("LOADING CHART...");
            const chartRes = await fetch(`Maps/${song}/${diff}.json`);
            if(!chartRes.ok) throw new Error(`Chart Not Found`);
            const chartData = await chartRes.json();
            parseChartData(chartData);

            // ★ 곡 이미지 배경 (songs/{folder}/image.png, 전체화면 블러)
            bgaImage.onload  = () => { bgaImage.style.display = 'block'; };
            bgaImage.onerror = () => { bgaImage.style.display = 'none'; };
            bgaImage.src = `songs/${song}/image.png`;

            logStatus("LOADING AUDIO...");
            const audioPath = `Maps/${song}/audio.mp3`;

            // ★ 로딩 완료 전까지 버튼 숨김, READY 후 표시
            const checkAudioReady = () => {
                if (audio.readyState >= 3) {
                    logStatus("▶ PRESS START");
                    document.getElementById('loading-msg').style.animation = 'none';
                    document.getElementById('loading-msg').style.color = '#00ff88';
                    startBtn.style.display = 'block';
                    return true;
                }
                return false;
            };

            audio.oncanplaythrough = checkAudioReady;
            audio.onloadeddata     = checkAudioReady;
            audio.src = audioPath;
            audio.load();

            const forceCheck = setInterval(() => { if (checkAudioReady()) clearInterval(forceCheck); }, 100);

        } catch (err) {
            alert(`오류 발생: ${err.message}`);
            window.location.href = "index.html";
        }
    }

    function parseChartData(data) {
        if(data.bpm)       bpm      = data.bpm;
        if(data.offset)    offset  += (data.offset || 0);
        if(data.beat)      beatNum  = data.beat;
        if(data.beatDenom) beatDenom = data.beatDenom;

        gameNotes = []; totalMaxHits = 0;
        if(data.speedEvents) {
            speedEvents = data.speedEvents;
            if (!speedEvents.some(e => e.time === 0)) speedEvents.push({ time: 0, mult: 1.0 });
        } else {
            speedEvents = [{ time: 0, mult: 1.0 }];
        }

        msgEvents = [];
        if(data.msgEvents) msgEvents = data.msgEvents;

        // ★ 라인 안무 / 펄스 기믹 로딩 (에디터 export 포맷)
        lineEvents  = data.lineEvents  ? data.lineEvents.map(arr=>arr.map(e=>({...e})))  : [[],[],[],[]];
        pulseEvents = data.pulseEvents ? data.pulseEvents.map(arr=>arr.map(e=>({...e}))) : [[],[],[],[]];
        while(lineEvents.length<4) lineEvents.push([]);
        while(pulseEvents.length<4) pulseEvents.push([]);

        if(data.measures) {
            const msPerMeasure = (60000 / bpm) * (4 / beatDenom) * beatNum;
            data.measures.forEach(m => {
                const ratio = BASE_RES / (m.split || 32);
                m.notes.forEach(n => {
                    const time     = (m.index + (n.pos * ratio / BASE_RES)) * msPerMeasure;
                    const duration = ((n.len || 0) * ratio / BASE_RES) * msPerMeasure;
                    const noteTime    = time + offset;
                    const noteEndTime = noteTime + duration;
                    if (noteEndTime > lastNoteEndTime) lastNoteEndTime = noteEndTime;
                    gameNotes.push({ time: noteTime, endTime: noteEndTime, lane: n.lane, len: (n.len || 0) * ratio, hit: false, holding: false, finished: false });
                    totalMaxHits++;
                    if(n.len > 0) totalMaxHits++;
                });
            });

            if(speedEvents.length > 0) {
                speedEvents = speedEvents.map(ev => {
                    if(ev.measureIdx !== undefined) {
                        const calculatedTime = (ev.measureIdx * msPerMeasure) + (ev.pos / BASE_RES) * msPerMeasure;
                        return { ...ev, time: calculatedTime + offset };
                    }
                    return { ...ev, time: ev.time + offset };
                });
            }
        }
        gameNotes.sort((a,b) => a.time - b.time);
        scorePerHit = totalMaxHits > 0 ? (1000000 / totalMaxHits) : 0;
    }

    function buildSpeedMap() {
        speedMap = [];
        const sortedEvents = [...speedEvents].sort((a,b) => a.time - b.time);
        speedMap.push({ time: -999999, vPos: 0, mult: 1.0 });
        sortedEvents.forEach(ev => {
            const prev = speedMap[speedMap.length - 1];
            const dist = (ev.time - prev.time) * prev.mult;
            speedMap.push({ time: ev.time, vPos: prev.vPos + dist, mult: ev.mult, warned: false });
        });
    }

    function getVisualPos(time) {
        let ev = speedMap[0];
        for(let i = 1; i < speedMap.length; i++) {
            if (speedMap[i].time > time) break;
            ev = speedMap[i];
        }
        return ev.vPos + (time - ev.time) * ev.mult;
    }

    function startGame() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('loading-screen').style.display = 'none';
        buildSpeedMap();

        const msPerMeasure = (60000 / bpm) * (4 / beatDenom) * beatNum;
        activeMsgEvents = msgEvents.map(ev => {
            let startTime = ev.time, duration = 0;
            if(ev.measureIdx !== undefined) {
                startTime = (ev.measureIdx * msPerMeasure) + (ev.pos / BASE_RES) * msPerMeasure;
                duration  = (ev.len / BASE_RES) * msPerMeasure;
            }
            return { ...ev, time: startTime + offset, endTime: startTime + offset + (duration || 1000) };
        });

        if(guideMsgEl) { guideMsgEl.className = ''; guideMsgEl.innerText = ''; }

        combo = 0; maxCombo = 0; totalHits = 0; totalRateSum = 0; score = 0;
        judgeStats = { perfectEx: 0, perfect: 0, great: 0, good: 0, notBad: 0, save: 0, oh: 0, miss: 0 };
        activeNotes = []; particles = []; recentHits = []; judgments = [];
        fireflies = []; gearParticles = []; lineFlash = null;
        lineStates = DEFAULT_LINE.map(l=>({...l}));
        linePulsePhase = [0,0,0,0];
        resetFever();

        finishEffect.innerHTML = "";
        judgeDisplayEl.innerHTML = "";
        updateGameHUD();

        warnLeft.className  = 'side-warn-col';
        warnRight.className = 'side-warn-col';
        speedEdgeWarning.classList.remove('speed-edge-up', 'speed-edge-down');
        speedEdgeLabel.textContent = '';

            clearTimeout(speedWarningTimer);

        if(useVideoBga) bgaVideo.currentTime = 0;

        gameState = 'COUNTDOWN';

    function drawFeverGearEffect() {
        if (!isFever) return;
        const level = Math.max(1, feverLevel || (combo >= FEVER_LV3 ? 3 : combo >= FEVER_LV2 ? 2 : 1));
        const colors = [
            null,
            { main: '#00e5ff', soft: 'rgba(0,229,255,0.22)' },
            { main: '#ffd652', soft: 'rgba(255,214,82,0.25)' },
            { main: '#78ffb4', soft: 'rgba(120,255,180,0.28)' }
        ][level];
        const cx = TRACK_X_OFFSET + LANE_WIDTH * 2;
        const cy = HIT_LINE_Y;
        const width = LANE_WIDTH * 4;
        const time = performance.now() * 0.001;
        const pulse = feverPulse;

        gameCtx.save();
        gameCtx.strokeStyle = colors.main;
        gameCtx.fillStyle = colors.soft;
        gameCtx.lineWidth = 1.4;
        gameCtx.shadowColor = colors.main;
        gameCtx.shadowBlur = 12 + level * 3;

        gameCtx.globalAlpha = 0.14 + level * 0.04 + pulse * 0.2;
        gameCtx.beginPath();
        gameCtx.ellipse(cx, cy, width * (0.48 + pulse * 0.16), 34 + level * 8 + pulse * 28, 0, 0, Math.PI * 2);
        gameCtx.stroke();

        gameCtx.shadowBlur = 0;
        gameCtx.globalAlpha = 0.09 + level * 0.03;
        for (let i = 0; i < 5 + level * 2; i++) {
            const offset = ((time * (24 + level * 7) + i * 74) % (width + 160)) - 80;
            gameCtx.beginPath();
            gameCtx.moveTo(TRACK_X_OFFSET + offset, cy + 58);
            gameCtx.lineTo(TRACK_X_OFFSET + offset + 56, cy - 58);
            gameCtx.stroke();
        }

        if (pulse > 0.01) {
            gameCtx.globalAlpha = pulse * 0.28;
            gameCtx.fillRect(TRACK_X_OFFSET, cy - 2, width, 4);
            feverPulse *= 0.88;
        } else {
            feverPulse = 0;
        }

        gameCtx.restore();
        gameCtx.globalAlpha = 1.0;
    }

    function updateBgParticles() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        const maxFireflies = combo >= FEVER_LV3 ? 42 : 26;
        if (combo >= FEVER_LV2 && fireflies.length < maxFireflies) {
            if(Math.random() < 0.055) fireflies.push(new Firefly());
        }
        for (let i = fireflies.length - 1; i >= 0; i--) {
            let p = fireflies[i];
            p.update(); p.draw(bgCtx);
            if (p.baseAlpha <= 0) fireflies.splice(i, 1);
        }
    }

    // ============================================================
    // 게임 루프
    // ============================================================
    function gameLoop() {
        if(gameFinished) return;
        gameAnimId = requestAnimationFrame(gameLoop);

        if(isPaused || isResuming) {
            drawGameScreen(audio.currentTime * 1000);
            return;
        }

        updateBgParticles();

        const now = Date.now();
        let currentTime = -9999;

        if (gameState === 'COUNTDOWN') {
            const rawTime = now - startTimestamp;
            currentTime = rawTime - START_DELAY;
            if (rawTime >= START_DELAY) {
                gameState = 'WAIT_AUDIO';
                audio.play().then(() => { if(useVideoBga) bgaVideo.play(); }).catch(() => { gameState = 'PLAYING_NO_AUDIO'; });
            }
        } else if (gameState === 'WAIT_AUDIO') {
            currentTime = 0;
            if (audio.currentTime > 0 && !audio.paused) gameState = 'PLAYING';
        } else if (gameState === 'PLAYING') {
            currentTime = audio.currentTime * 1000;
        } else if (gameState === 'PLAYING_NO_AUDIO') {
            currentTime = (Date.now() - startTimestamp) - START_DELAY;
        }

        if (!gameFinished && !isPaused) {
            if (audio.ended || currentTime > lastNoteEndTime + 3000) finishGame();
        }

        const msPerMeasure = (60000 / bpm) * 4;
        let nextEvent = speedMap.find(ev => ev.time > currentTime);
        if (nextEvent && !nextEvent.warned) {
            let currentMult = 1.0;
            for(let i = 0; i < speedMap.length; i++) {
                if(speedMap[i].time <= currentTime) currentMult = speedMap[i].mult;
                else break;
            }
            if (nextEvent.time - currentTime <= msPerMeasure) {
                nextEvent.warned = true;
                if (Math.abs(nextEvent.mult - currentMult) >= 0.001) {
                    showSpeedWarning(nextEvent.mult, currentMult);
                }
            }
        }

        // 메시지 이벤트
        if (activeMsgEvents.length > 0 && !gameFinished) {
            const activeMsg = activeMsgEvents.find(ev => currentTime >= ev.time && currentTime <= ev.endTime);
            if (activeMsg) {
                if (guideMsgEl.innerText !== activeMsg.text) {
                    guideMsgEl.innerText = activeMsg.text;
                    guideMsgEl.classList.add('msg-active');
                }
            } else {
                guideMsgEl.classList.remove('msg-active');
            }
        }

        drawGameScreen(currentTime);
    }

    // ============================================================
    // 게임 화면 렌더링
    // ============================================================
    function drawGameScreen(currentTime) {
        gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
        drawFeverGearEffect();

        // ★ 라인 안무/펄스 상태 갱신 (에디터와 동일 타임라인)
        lineStates    = [0,1,2,3].map(l=>getLineState(l, currentTime));
        linePulsePhase = [0,1,2,3].map(l=>getPulseMagnitude(l, currentTime));

        const currentVisualY = getVisualPos(currentTime);
        const GLOBAL_SCALE   = 0.1 * baseNoteSpeed;

        while(gameNotes.length > 0 && gameNotes[0].time - 10000 < currentTime) {
            activeNotes.push(gameNotes.shift());
        }

        // ============================================================
        // ★ 노트 판정 / 렌더링 (개선된 얼리미스 / 롱노트)
        // ============================================================
        const MAX_HIT_WINDOW = 110; // Oh... 윈도우 (초과시 Miss)

        for(let i = 0; i < activeNotes.length; i++) {
            let n = activeNotes[i];
            const nPos   = getVisualPos(n.time);
            const endPos = (n.len > 0) ? getVisualPos(n.endTime) : nPos;
            const headY  = HIT_LINE_Y - (nPos - currentVisualY) * GLOBAL_SCALE;
            let   tailY  = headY;
            if (n.len > 0) tailY = HIT_LINE_Y - (endPos - currentVisualY) * GLOBAL_SCALE;

            // ★ 화면 아래로 사라진 경우 (Miss 처리) - 롱노트 테일도 포함
            if (tailY > gameCanvas.height + 30) {
                if (!n.finished) {
                    n.finished = true;
                    if (!n.hit) {
                        // 아직 히트 안 된 노트: Miss
                        applyJudge(n, 'miss');
                    }
                }
                continue;
            }

            // ★ 얼리 미스 판정: 히트하지 않은 노트가 판정선 아래 MAX_HIT_WINDOW 이상 지난 경우
            if (!n.hit && !n.finished) {
                const lateDiff = currentTime - n.time;
                if (lateDiff > MAX_HIT_WINDOW + 50) { // 버퍼 50ms
                    n.hit = true; n.finished = true;
                    applyJudge(n, 'miss');
                    checkFinish();
                    continue;
                }
            }

            // ★ 롱노트 홀딩 중 끝 체크
            if (n.hit && n.len > 0 && !n.finished) {
                if (activeKeys[n.lane]) {
                    if (currentTime >= n.endTime) {
                        n.finished = true;
                        totalHits++;
                        score += scorePerHit;
                        totalRateSum += 100;
                        combo++;
                        judgeStats.perfectEx++;
                        if(combo > maxCombo) maxCombo = combo;
                        updateGameHUD();
                        createParticlesForJudge(n.lane, JUDGE_TABLE[0]);
                        showJudgePopup(JUDGE_TABLE[0], n.lane);
                        playSfx('hold_end');
                        checkFinish();
                        checkFeverState(combo);
                    }
                } else {
                    // ★ 롱노트 도중 손을 뗀 경우 - 안전 구간 / 불안전 구간 판별
                    const remaining    = n.endTime - currentTime;
                    const totalDuration = n.endTime - n.time;
                    const safeZone     = Math.max(100, totalDuration * 0.2);

                    if (remaining > safeZone) {
                        // 불안전 구간에서 손 뗌: Miss
                        n.finished = true;
                        combo = 0;
                        totalHits++;
                        judgeStats.miss++;
                        updateGameHUD();
                        showJudgePopup(JUDGE_TABLE[7], n.lane);
                        resetFever();
                    } else {
                        // 안전 구간에서 손 뗌: Perfect 처리 (checkRelease 에서 처리됨)
                        // (여기선 아직 손 안 뗀 상태 = 별도 처리 없음)
                    }
                }
            }

            // (그리기는 아래 무빙 라인 렌더 패스에서 처리 — 여기선 판정 로직만)
        }
        activeNotes = activeNotes.filter(n => !n.finished);

        // ============================================================
        // ★ 무빙 라인 렌더 패스 (에디터와 동일: 라인 + 수직 접근 노트)
        // ============================================================
        const cvy = currentVisualY;
        const gs  = GLOBAL_SCALE;
        const laneHalf = laneHalfW();
        const safeLimit = Math.sqrt(gameCanvas.width*gameCanvas.width + gameCanvas.height*gameCanvas.height) * 3;

        for(let lane=0; lane<4; lane++){
            const st=lineStates[lane];
            const pulse=linePulsePhase[lane]||0;
            const px=lineX(st), py=lineY(st);
            const ang=(st.angle*Math.PI)/180;
            const col=LANE_COLORS[lane];

            gameCtx.save();
            gameCtx.translate(px,py);
            gameCtx.rotate(ang);
            gameCtx.translate(0,pulse);

            // 키 입력 글로우 빔
            if(activeKeys[lane]){
                const bg=gameCtx.createLinearGradient(0,0,0,-180);
                bg.addColorStop(0,hexA(col,0.18)); bg.addColorStop(1,hexA(col,0));
                gameCtx.fillStyle=bg;
                gameCtx.fillRect(-laneHalf,-180,laneHalf*2,180);
            }

            // 판정 라인
            gameCtx.shadowBlur=activeKeys[lane]?10:3;
            gameCtx.shadowColor=col;
            gameCtx.strokeStyle=col;
            gameCtx.lineWidth=activeKeys[lane]?2.2:1.4;
            gameCtx.globalAlpha=activeKeys[lane]?0.95:0.7;
            gameCtx.beginPath();
            gameCtx.moveTo(-laneHalf,0); gameCtx.lineTo(laneHalf,0);
            gameCtx.stroke();
            // 중심 점
            gameCtx.fillStyle=col; gameCtx.globalAlpha=1;
            gameCtx.shadowBlur=activeKeys[lane]?8:2;
            gameCtx.beginPath(); gameCtx.arc(0,0,activeKeys[lane]?3.5:2,0,Math.PI*2); gameCtx.fill();
            gameCtx.shadowBlur=0;

            // 라인에 수직 접근하는 노트
            const visibleNotes=activeNotes.filter(n=>n.lane===lane&&!n.finished
                && n.endTime>currentTime-800 && n.time<currentTime+8000);
            visibleNotes.forEach(n=>{
                const nPos=getVisualPos(n.time);
                const endPos=n.len>0?getVisualPos(n.endTime):nPos;
                const headLocalY=-(nPos-cvy)*gs;
                if(n.len>0){
                    const endLocalY=-(endPos-cvy)*gs;
                    const drawHeadY=(n.hit&&!isPaused)?0:headLocalY;
                    const top=Math.min(drawHeadY,endLocalY), bot=Math.max(drawHeadY,endLocalY);
                    const clTop=Math.max(-safeLimit,top), clBot=Math.min(60,bot);
                    if(clBot>clTop){
                        gameCtx.fillStyle=col; gameCtx.globalAlpha=0.15;
                        gameCtx.fillRect(-laneHalf+12,clTop,(laneHalf-12)*2,clBot-clTop);
                        gameCtx.globalAlpha=0.35;
                        gameCtx.fillRect(-laneHalf+12,clTop,1.5,clBot-clTop);
                        gameCtx.fillRect(laneHalf-13.5,clTop,1.5,clBot-clTop);
                        gameCtx.globalAlpha=1;
                    }
                }
                if((!n.hit||isPaused)&&headLocalY>-safeLimit&&headLocalY<60){
                    gameCtx.globalAlpha=0.88;
                    gameCtx.fillStyle=col;
                    gameCtx.shadowBlur=5; gameCtx.shadowColor=col;
                    roundRect(gameCtx,-laneHalf+6,headLocalY-4,(laneHalf-6)*2,8,2); gameCtx.fill();
                    gameCtx.fillStyle='rgba(255,255,255,0.18)'; gameCtx.shadowBlur=0;
                    roundRect(gameCtx,-laneHalf+6,headLocalY-4,(laneHalf-6)*2,2.5,1); gameCtx.fill();
                    gameCtx.globalAlpha=1;
                }
            });

            gameCtx.globalAlpha=1;
            gameCtx.restore();
            gameCtx.globalAlpha=1; gameCtx.shadowBlur=0; gameCtx.shadowColor='transparent';
        }

        drawParticles();
        drawGameFX();
        drawHitErrorBar();
    }

    // ============================================================
    // ★ 판정 적용 통합 함수
    // ============================================================
    function applyJudge(note, forceKey) {
        const key      = forceKey || 'miss';
        const judgeInfo = JUDGE_TABLE.find(j => j.key === key) || JUDGE_TABLE[7];
        
        totalHits++;
        if(note.len > 0) totalHits++; // 롱노트는 head+tail 2카운트

        judgeStats[judgeInfo.key]++;
        totalRateSum += judgeInfo.rate;
        score += scorePerHit * judgeInfo.scoreRate;

        if(judgeInfo.comboBreak) {
            combo = 0;
            resetFever();
        } else {
            combo++;
            if(combo > maxCombo) maxCombo = combo;
            checkFeverState(combo);
        }

        updateGameHUD();
        showJudgePopup(judgeInfo, note ? note.lane : 0);
        if(!judgeInfo.comboBreak) createParticlesForJudge(note.lane, judgeInfo);
    }

    // ============================================================
    // 키 입력
    // ============================================================
    let KEY_MAP = JSON.parse(localStorage.getItem('wb_key_layout') || '["d","f","j","k"]');
    KEY_MAP = KEY_MAP.map(k => k.toLowerCase());

    window.addEventListener('keydown', e => {
        // ★ 일시정지 메뉴에서 키보드 탐색
        if (isPaused && !isResuming) {
            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                pauseSelectedIdx = (pauseSelectedIdx - 1 + pauseActions.length) % pauseActions.length;
                updatePauseSelection(); return;
            }
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                pauseSelectedIdx = (pauseSelectedIdx + 1) % pauseActions.length;
                updatePauseSelection(); return;
            }
            if (e.key === 'Enter' || e.key === ' ') {
                executePauseAction(pauseActions[pauseSelectedIdx]); return;
            }
            if (e.key === 'Escape') { togglePause(); return; }
            return;
        }

        if(gameFinished) return;
        if (e.code === 'Escape') { togglePause(); return; }
        if(isPaused || isResuming) return;

        const key  = e.key.toLowerCase();
        const lane = KEY_MAP.indexOf(key);
        if(lane !== -1 && !activeKeys[lane]) { activeKeys[lane] = true; checkHit(lane); }
    });

    window.addEventListener('keyup', e => {
        if(gameFinished || isPaused) return;
        const key  = e.key.toLowerCase();
        const lane = KEY_MAP.indexOf(key);
        if(lane !== -1) { activeKeys[lane] = false; checkRelease(lane); }
    });

    if (isMobile) {
        gameCanvas.addEventListener('touchstart',  handleTouch, {passive: false});
        gameCanvas.addEventListener('touchend',    handleTouch, {passive: false});
        gameCanvas.addEventListener('touchcancel', handleTouch, {passive: false});
    }

    function handleTouch(e) {
        if (gameFinished || isPaused || isResuming) return;
        e.preventDefault();
        const touches = e.changedTouches;
        for (let i = 0; i < touches.length; i++) {
            const touch = touches[i];
            const lane  = Math.floor(touch.clientX / (window.innerWidth / 4));
            if (lane >= 0 && lane < 4) {
                if (e.type === 'touchstart') {
                    if (!activeKeys[lane]) { activeKeys[lane] = true; checkHit(lane); }
                } else {
                    activeKeys[lane] = false; checkRelease(lane);
                }
            }
        }
    }

    // ============================================================
    // ★ checkHit (8단계 판정)
    // ============================================================
    function checkHit(lane) {
        let currentTime = getCurrentTime();

        const MAX_WINDOW = 110; // Oh... 까지의 최대 윈도우
        const candidates = activeNotes.filter(n =>
            n.lane === lane && !n.hit && !n.finished &&
            Math.abs(currentTime - n.time) <= MAX_WINDOW
        );
        if (candidates.length === 0) return;

        const n = candidates.reduce((prev, curr) =>
            Math.abs(currentTime - curr.time) < Math.abs(currentTime - prev.time) ? curr : prev
        );
        const diff    = currentTime - n.time;
        const absDiff = Math.abs(diff);

        n.hit = true;
        n.holding = true;
        if (n.len === 0) n.finished = true;

        // ★ SFX
        if (n.len > 0) playSfx('hold_start'); else playSfx('hit');

        // ★ 판정 결정 (8단계)
        let judgeInfo = JUDGE_TABLE[7]; // 기본: No...
        for(const j of JUDGE_TABLE) {
            if(absDiff <= j.window) { judgeInfo = j; break; }
        }

        // 판정 통계 반영
        totalHits++;
        judgeStats[judgeInfo.key]++;
        totalRateSum += judgeInfo.rate;
        score += scorePerHit * judgeInfo.scoreRate;

        if(judgeInfo.comboBreak) {
            combo = 0;
            resetFever();
        } else {
            combo++;
            if(combo > maxCombo) maxCombo = combo;
            checkFeverState(combo);
        }

        updateGameHUD();
        showJudgePopup(judgeInfo, lane);
        createParticlesForJudge(lane, judgeInfo);

        // 히트 에러 바 기록
        recentHits.push({ diff, color: judgeInfo.color, life: 600, maxLife: 600 });

        checkFinish();
        if(totalHits === totalMaxHits && !finishTimer) finishTimer = setTimeout(finishGame, 1500);
    }

    // ============================================================
    // ★ checkRelease (롱노트 해제)
    // ============================================================
    function checkRelease(lane) {
        const n = activeNotes.find(n => n.lane === lane && n.hit && !n.finished && n.len > 0);
        if (!n) return;

        const currentTime   = getCurrentTime();
        const remaining     = n.endTime - currentTime;
        const totalDuration = n.endTime - n.time;
        const safeZone      = Math.max(100, totalDuration * 0.2);

        if (remaining > safeZone) {
            // 너무 일찍 뗌: Miss
            n.finished = true;
            totalHits++;
            judgeStats.miss++;
            totalRateSum += 0;
            combo = 0;
            updateGameHUD();
            showJudgePopup(JUDGE_TABLE[7], lane);
            resetFever();
        } else {
            // 안전 구간에서 뗌: Perfect! 처리
            n.finished = true;
            totalHits++;
            score += scorePerHit * 1.0;
            totalRateSum += 100;
            combo++;
            judgeStats.perfectEx++;
            if(combo > maxCombo) maxCombo = combo;
            updateGameHUD();
            showJudgePopup(JUDGE_TABLE[0], lane);
            createParticlesForJudge(lane, JUDGE_TABLE[0]);
            playSfx('hold_end');
            checkFeverState(combo);
        }

        checkFinish();
        if(totalHits === totalMaxHits && !finishTimer) finishTimer = setTimeout(finishGame, 1500);
    }

    function getCurrentTime() {
        if (gameState === 'PLAYING' && audio.currentTime > 0) return audio.currentTime * 1000;
        return (Date.now() - startTimestamp) - START_DELAY;
    }

    function updateGameHUD() {
        const comboEl = document.getElementById('g-combo');
        comboEl.innerText  = combo;
        document.getElementById('g-score').innerText  = Math.round(score).toString().padStart(6, '0');
        let currentRate = 100.00;
        if (totalHits > 0) currentRate = Math.min(100, (totalRateSum / (totalHits * 100)) * 100);
        document.getElementById('g-rate').innerText   = currentRate.toFixed(2) + "%";

        // ★ 콤보 색상: TB(All Perfect) 가능 → 노랑 / FC 가능 → 파랑 / 그 외 → 흰색
        const tbPossible = (judgeStats.perfect + judgeStats.great + judgeStats.good
                          + judgeStats.notBad + judgeStats.save + judgeStats.oh + judgeStats.miss) === 0;
        const fcPossible = (judgeStats.oh + judgeStats.miss) === 0;
        let cColor = '#ffffff', cGlow = 'rgba(255,255,255,0.4)';
        if (tbPossible)      { cColor = '#ffd700'; cGlow = '#ffd700'; }   // TROLL BEAT 가능
        else if (fcPossible) { cColor = '#00e5ff'; cGlow = '#00e5ff'; }   // FULL COMBO 가능
        comboEl.style.color = cColor;
        comboEl.style.textShadow = `0 0 20px ${cGlow}`;
    }

    // ============================================================
    // 그리기 유틸
    // ============================================================
    function drawJudgmentLine() {
        // ★ 라인 플래시
        if(lineFlash && lineFlash.life > 0) {
            gameCtx.globalAlpha = lineFlash.life * 0.5;
            gameCtx.fillStyle   = lineFlash.color;
            gameCtx.fillRect(0, HIT_LINE_Y - 20, gameCanvas.width, 40);
            gameCtx.globalAlpha = 1.0;
            lineFlash.life -= 0.08;
        }

        const lineColor = (combo >= FEVER_LV3) ? '#00ff00' : (isFever ? '#ffd700' : '#00e5ff');
        gameCtx.shadowBlur   = 12;
        gameCtx.shadowColor  = lineColor;
        gameCtx.strokeStyle  = lineColor;
        gameCtx.lineWidth    = 3;
        gameCtx.beginPath();
        gameCtx.moveTo(0, HIT_LINE_Y);
        gameCtx.lineTo(gameCanvas.width, HIT_LINE_Y);
        gameCtx.stroke();
        gameCtx.shadowBlur = 0;

        // 레인 구분선
        gameCtx.strokeStyle = 'rgba(255,255,255,0.3)';
        gameCtx.lineWidth   = 2;
        for(let i = 0; i <= 4; i++) {
            const x = TRACK_X_OFFSET + i * LANE_WIDTH;
            gameCtx.beginPath();
            gameCtx.moveTo(x, 0);
            gameCtx.lineTo(x, gameCanvas.height);
            gameCtx.stroke();
        }
    }

    function drawLaneBeams() {
        gameCtx.globalCompositeOperation = 'lighter';
        for(let i = 0; i < 4; i++) {
            if(activeKeys[i]) {
                const grd = gameCtx.createLinearGradient(0, HIT_LINE_Y, 0, HIT_LINE_Y - 300);
                grd.addColorStop(0, COLORS[i] + '80');
                grd.addColorStop(1, "transparent");
                gameCtx.fillStyle = grd;
                gameCtx.fillRect(TRACK_X_OFFSET + i * LANE_WIDTH, 0, LANE_WIDTH, HIT_LINE_Y);
            }
        }
        gameCtx.globalCompositeOperation = 'source-over';
    }

    function drawGameFX() {
        for(let i = judgments.length - 1; i >= 0; i--) {
            const j = judgments[i];
            gameCtx.save();
            gameCtx.globalAlpha = j.life / j.maxLife;
            gameCtx.fillStyle   = j.color;
            gameCtx.font        = "900 24px Arial";
            gameCtx.textAlign   = "center";
            gameCtx.fillText(j.text, j.x, j.y - (30 - j.life));
            gameCtx.restore();
            j.life--;
            if(j.life <= 0) judgments.splice(i, 1);
        }
    }

    function drawHitErrorBar() {
        const cx    = gameCanvas.width / 2;
        const cy    = HIT_LINE_Y + 40;
        const width = 300;

        // 판정 구간 배경 (색상 그라디언트로)
        const barGrd = gameCtx.createLinearGradient(cx - width/2, 0, cx + width/2, 0);
        barGrd.addColorStop(0,    'rgba(255,45,120,0.3)');
        barGrd.addColorStop(0.25, 'rgba(255,119,51,0.3)');
        barGrd.addColorStop(0.4,  'rgba(255,179,0,0.3)');
        barGrd.addColorStop(0.5,  'rgba(0,242,255,0.5)');
        barGrd.addColorStop(0.6,  'rgba(255,179,0,0.3)');
        barGrd.addColorStop(0.75, 'rgba(255,119,51,0.3)');
        barGrd.addColorStop(1,    'rgba(255,45,120,0.3)');
        gameCtx.fillStyle = barGrd;
        gameCtx.fillRect(cx - width/2, cy - 3, width, 6);

        // 중심선
        gameCtx.fillStyle = "#fff";
        gameCtx.fillRect(cx - 1, cy - 8, 2, 16);

        // 히트 마크
        for(let i = recentHits.length - 1; i >= 0; i--) {
            const h   = recentHits[i];
            const px  = (h.diff / 110) * (width / 2);
            const drawX = Math.max(cx - width/2, Math.min(cx + width/2, cx + px));
            gameCtx.fillStyle   = h.color;
            gameCtx.globalAlpha = h.life / h.maxLife;
            gameCtx.shadowBlur  = 6;
            gameCtx.shadowColor = h.color;
            gameCtx.fillRect(drawX - 2, cy - 8, 4, 16);
            gameCtx.shadowBlur  = 0;
            gameCtx.globalAlpha = 1.0;
            h.life--;
            if(h.life <= 0) recentHits.splice(i, 1);
        }
    }

    function drawParticles() {
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x   += p.vx;
            p.y   += p.vy;
            p.vy  += 0.5;
            p.vx  *= 0.98;
            p.life -= p.decay;
            if(p.life <= 0) { particles.splice(i, 1); continue; }
            gameCtx.globalAlpha = p.life;
            if(p.glow) {
                gameCtx.shadowBlur  = 12;
                gameCtx.shadowColor = p.color;
            }
            gameCtx.fillStyle = p.color;
            gameCtx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            gameCtx.shadowBlur  = 0;
        }
        gameCtx.globalAlpha = 1.0;
    }

    function checkFinish() {
        if (totalHits === totalMaxHits && totalMaxHits > 0) {
            if (judgeStats.perfectEx === totalMaxHits) {
                finishEffect.innerHTML = "<div class='text-glitch' data-text='TROLL BEAT!!'>TROLL BEAT!!</div>";
                playSfx('ap_main'); playSfx('ap_layer');
            } else if (combo === totalMaxHits) {
                finishEffect.innerHTML = "<div class='text-fc'>FULL COMBO</div>";
                playSfx('fc');
            }
        }
    }

    function animateResultValue(el, target, formatter, duration = 1400) {
        if (!el) return;
        const startTime = performance.now();
        function step(now) {
            const t = Math.min(1, (now - startTime) / duration);
            const eased = 1 - Math.pow(1 - t, 4);
            let value = target * eased;
            if (t < 0.88) {
                value += (Math.random() - 0.5) * target * 0.018 * (1 - t);
            }
            el.textContent = formatter(Math.max(0, Math.min(target, value)));
            if (t < 1) requestAnimationFrame(step);
            else el.textContent = formatter(target);
        }
        requestAnimationFrame(step);
    }

    function startResultCountUp(scoreValue, rateValue) {
        animateResultValue(
            document.getElementById('result-score-value'),
            scoreValue,
            value => Math.floor(value).toString().padStart(6, '0'),
            1550
        );
        animateResultValue(
            document.getElementById('result-rate-value'),
            rateValue,
            value => value.toFixed(2) + "%",
            1550
        );
    }

    function showResultPreparing() {
        resultOverlay.classList.remove('result-show');
        resultOverlay.innerHTML = `<div class="result-prep">COMPILING RESULT</div>`;
        resultOverlay.style.display = 'flex';
