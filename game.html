<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WEB BEAT : SECURE</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;600;800&family=Share+Tech+Mono&family=Rajdhani:wght@500;700&family=Audiowide&family=Oxanium:wght@400;700;800&display=swap');
        :root { 
            --bg: #050505; 
            --accent: #00e5ff; 
            --secondary: #ff0055; 
            --text: #fff; 
            --fever-gold: #ffd700; 
            --fever-max: #00ff00;
            --ui-font: 'Orbitron', sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; user-select: none; display: flex; justify-content: center; align-items: center; }
        
        canvas.game { touch-action: none; -webkit-user-select: none; user-select: none; }
        body.mobile-mode #game-canvas-container { width: 100% !important; border: none; }

        /* BGA Layer */
        /* BGA Layer → 곡 이미지 전체화면 블러 배경 */
        #bga-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; background: #000; }
        #bga-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
            filter: blur(14px) brightness(0.4) saturate(1.1); transform: scale(1.1); display: none; }
        #bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
        #bga-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.75) 100%); }
        
        .effect-glitch { animation: glitch-anim 0.2s infinite; background: rgba(255, 0, 85, 0.1); }
        .effect-flash { animation: flash-anim 0.5s forwards; }
        @keyframes glitch-anim { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
        @keyframes flash-anim { 0% { background-color: rgba(255,255,255,0.5); } 100% { background-color: transparent; } }

        /* Game View */
        #game-view { position: relative; width: 100%; height: 100%; display: flex; flex-direction: row; align-items: stretch; justify-content: center; z-index: 10; gap: 15px; }
        .side-warn-col { width: 100px; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.1s; pointer-events: none; text-shadow: 0 0 10px currentColor; }
        .chevron { width: 50px; height: 50px; border-top: 10px solid currentColor; border-right: 10px solid currentColor; transform: rotate(-45deg); margin: 10px 0; opacity: 0.5; }
        .warn-label { font-family: var(--ui-font); font-weight:900; font-size: 28px; margin: 20px 0; text-align: center; line-height: 1.1; filter: drop-shadow(0 0 5px currentColor); }
        .warn-up { opacity: 1; color: #ff0055; } .warn-up .chevron { animation: neon-pulse 0.2s infinite alternate; } .warn-up .warn-label { animation: flicker 0.1s infinite; }
        .warn-down { opacity: 1; color: #00e5ff; } .warn-down .chevron { transform: rotate(135deg); animation: neon-pulse-down 0.4s infinite alternate; }
        @keyframes neon-pulse { from { opacity: 0.4; transform: translateY(0) rotate(-45deg); filter: drop-shadow(0 0 2px currentColor); } to { opacity: 1; transform: translateY(-5px) rotate(-45deg); filter: drop-shadow(0 0 15px currentColor); } }
        @keyframes neon-pulse-down { from { opacity: 0.4; transform: translateY(0) rotate(135deg); } to { opacity: 1; transform: translateY(5px) rotate(135deg); } }
        @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        #game-canvas-container { 
            position: absolute; inset: 0; width: 100%; height: 100%;
            background: transparent; flex-shrink: 0;
            transition: box-shadow 0.5s;
        }
        #game-canvas-container.fever-mode,
        #game-canvas-container.fever-max-mode {
            box-shadow: inset 0 0 58px rgba(0, 229, 255, 0.14), inset 0 0 0 1px rgba(0, 229, 255, 0.1);
        }
        #game-canvas-container.fever-level-2 {
            box-shadow: inset 0 0 68px rgba(255, 214, 82, 0.18), inset 0 0 0 1px rgba(255, 214, 82, 0.2);
        }
        #game-canvas-container.fever-level-3 {
            box-shadow: inset 0 0 82px rgba(120, 255, 180, 0.22), inset 0 0 0 1px rgba(120, 255, 180, 0.26);
        }

        .side-warn-col { display: none; }
        #speed-edge-warning {
            position: absolute;
            inset: 0;
            z-index: 65;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.12s ease;
        }
        #speed-edge-warning::before {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 0 0 transparent;
            transition: box-shadow 0.12s ease;
        }
        #speed-edge-warning .speed-edge-label {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--ui-font);
            font-weight: 900;
            font-size: clamp(15px, 1.5vw, 18px);
            letter-spacing: 0;
            text-align: center;
            white-space: nowrap;
            text-shadow: 0 0 7px currentColor, 0 0 14px currentColor;
        }
        #speed-edge-warning.speed-edge-up,
        #speed-edge-warning.speed-edge-down {
            opacity: 1;
        }
        #speed-edge-warning.speed-edge-up {
            color: #ff2d55;
        }
        #speed-edge-warning.speed-edge-up::before {
            animation: speedEdgeUp 1.5s ease-out forwards;
        }
        #speed-edge-warning.speed-edge-down {
            color: #00d5ff;
        }
        #speed-edge-warning.speed-edge-down::before {
            animation: speedEdgeDown 1.5s ease-out forwards;
        }
        @keyframes speedEdgeUp {
            0% { box-shadow: inset 0 0 0 0 rgba(255, 45, 85, 0); }
            16% { box-shadow: inset 0 0 32px 7px rgba(255, 45, 85, 0.28); }
            100% { box-shadow: inset 0 0 44px 5px rgba(255, 45, 85, 0); }
        }
        @keyframes speedEdgeDown {
            0% { box-shadow: inset 0 0 0 0 rgba(0, 213, 255, 0); }
            16% { box-shadow: inset 0 0 32px 7px rgba(0, 213, 255, 0.26); }
            100% { box-shadow: inset 0 0 44px 5px rgba(0, 213, 255, 0); }
        }

        canvas.game { display: block; width: 100%; height: 100%; }
        
        #game-hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
        .hud-item { position: absolute; }
        .hud-rate { top: 16px; left: 24px; text-align: left; }
        .hud-score { top: 16px; right: 24px; text-align: right; }
        .hud-combo { left: 50%; top: 48%; transform: translate(-50%,-50%); text-align: center; opacity: 0.12; }
        .hud-text { font-family: var(--ui-font); font-weight: 900; font-size: 30px; color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.4); transition: color 0.2s, text-shadow 0.2s; }
        .hud-sub { font-family: 'Segoe UI', sans-serif; font-size: 10px; color: #666; font-weight: 700; letter-spacing: 1px; }
        .hud-combo .hud-sub { display: none; }
        .hud-combo .hud-text { font-size: 150px; line-height: 1; text-shadow: 0 0 30px rgba(255,255,255,0.25); }
        .hud-item[data-custom-pos="1"] { right: auto !important; bottom: auto !important; }
        .hud-combo.combo-label-on .hud-sub { display: inline; }
        
        #finish-effect { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); width: 100%; text-align: center; pointer-events: none; z-index: 80; }
        .text-fc { font-family: 'Orbitron', sans-serif; font-size: 60px; color: #00e5ff; text-shadow: 0 0 20px #00e5ff, 0 0 40px #fff; animation: popIn 0.5s forwards; font-style: italic; }
        .text-glitch { position: relative; font-family: 'Orbitron', sans-serif; font-weight:900; font-size: 70px; color: #fff; text-transform: uppercase; letter-spacing: 5px; animation: shake 0.3s infinite; }
        .text-glitch::before, .text-glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; }
        .text-glitch::before { left: 2px; text-shadow: -2px 0 #ff0055; clip-path: polygon(0 0, 100% 0, 100% 30%, 0 30%); animation: glitch-1 2s infinite linear alternate-reverse; }
        .text-glitch::after { left: -2px; text-shadow: -2px 0 #00e5ff; clip-path: polygon(0 40%, 100% 40%, 100% 100%, 0 100%); animation: glitch-2 3s infinite linear alternate-reverse; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.5); } 100% { opacity: 1; transform: scale(1.2); } }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 100% { transform: translate(-1px, -2px) rotate(-1deg); } }

        .res-badge { margin: 10px 0 30px 0; font-size: 40px; font-family: 'Orbitron', sans-serif; letter-spacing: 2px; }
        .badge-fc { color: #00e5ff; text-shadow: 0 0 15px #00e5ff; animation: pulse 1s infinite; }
        .badge-ap { color: #ff0055; text-shadow: 2px 2px 0 #fff, 0 0 20px #ff0055; animation: shake 0.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }

        .overlay-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 300; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .res-rank { font-family: 'Orbitron', sans-serif; font-weight:900; font-size: 140px; color: #fff; text-shadow: 0 0 40px currentColor; margin-bottom: 10px; line-height: 1; }
        .res-info { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; width: 80%; max-width: 600px; margin-bottom: 30px; }
        .res-box { text-align: center; }
        .res-label { color: #888; font-size: 12px; margin-bottom: 5px; font-weight:bold; letter-spacing:1px; } 
        .res-val { color: #fff; font-size: 24px; font-family: 'Orbitron', sans-serif; }
        .res-detail { display: flex; justify-content: space-between; width: 90%; max-width: 500px; background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .detail-item { text-align: center; }
        .detail-label { font-size: 11px; font-weight: bold; margin-bottom: 5px; opacity:0.7; }
        .detail-val { font-size: 20px; color: #fff; font-family: 'Orbitron', sans-serif; }

        /* ═══════════════════════════════════════════════
           RESULT SCREEN — FULL CINEMATIC
        ═══════════════════════════════════════════════ */
        #result-overlay {
            overflow: hidden;
            background: transparent;
            align-items: stretch;
            justify-content: stretch;
            backdrop-filter: none;
        }

        /* ── 배경 레이어 ── */
        .res-bg {
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 70% 30%, rgba(0,229,255,0.13) 0%, transparent 52%),
                radial-gradient(ellipse at 20% 80%, rgba(255,45,120,0.10) 0%, transparent 46%),
                linear-gradient(160deg, #05060c 0%, #0b0e1a 45%, #060609 100%);
            opacity: 0;
            animation: resBgIn 0.45s cubic-bezier(.4,0,.2,1) forwards;
        }
        .res-bg::after {
            content: '';
            position: absolute; inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px, transparent 3px,
                rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
            );
            pointer-events: none;
        }
        @keyframes resBgIn {
            0%   { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ── 메인 레이아웃 — 오른쪽에서 슬라이드인 ── */
        .res-layout {
            position: relative;
            display: grid;
            grid-template-columns: 1fr min(420px, 38vw);
            grid-template-rows: 1fr;
            width: 100%; height: 100%;
            z-index: 1;
            transform: translateX(48px);
            opacity: 0;
            animation: resSlideIn 0.55s cubic-bezier(.22,.9,.22,1) 0.1s forwards;
        }
        @keyframes resSlideIn {
            to { transform: translateX(0); opacity: 1; }
        }
        @media (max-width: 860px) {
            .res-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
        }

        /* ── 왼쪽: 히어로 영역 ── */
        .res-hero {
            display: flex; flex-direction: column;
            justify-content: flex-end;
            padding: clamp(28px, 5vw, 64px) clamp(28px, 5vw, 64px) clamp(36px, 6vh, 80px);
            overflow: hidden;
        }
        .res-eyebrow {
            font-family: var(--ui-font); font-size: 10px; font-weight: 700;
            letter-spacing: 4px; color: rgba(255,255,255,0.38);
            margin-bottom: 14px;
            opacity: 0; transform: translateY(12px);
            animation: resLineUp 0.45s ease 0.28s forwards;
        }
        .res-song-name {
            font-family: var(--ui-font); font-weight: 900;
            font-size: clamp(26px, 4.5vw, 56px);
            line-height: 1.05; color: #fff;
            text-shadow: 0 2px 40px rgba(0,229,255,0.22);
            margin-bottom: 10px;
            overflow-wrap: anywhere;
            opacity: 0; transform: translateY(20px);
            animation: resLineUp 0.5s cubic-bezier(.2,.9,.2,1) 0.32s forwards;
        }
        .res-diff-badge {
            display: inline-flex; align-items: center; gap: 8px;
            font-family: var(--ui-font); font-size: 12px; letter-spacing: 2px;
            color: rgba(255,255,255,0.55);
            opacity: 0; transform: translateY(10px);
            animation: resLineUp 0.46s ease 0.38s forwards;
            margin-bottom: 36px;
        }
        .res-diff-badge span { color: var(--accent); }

        /* ── 랭크 + 스코어 히어로 ── */
        .res-rank-hero {
            display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap;
            opacity: 0;
            animation: resScaleIn 0.58s cubic-bezier(.16,.9,.24,1) 0.46s forwards;
        }
        .res-grade {
            font-family: var(--ui-font); font-weight: 900;
            font-size: clamp(80px, 14vw, 160px);
            line-height: 0.88;
            color: currentColor;
            filter: drop-shadow(0 0 28px currentColor) drop-shadow(0 0 60px currentColor);
            position: relative;
        }
        .res-grade::after {
            content: '';
            display: block;
            width: 100%;
            height: 3px;
            background: currentColor;
            box-shadow: 0 0 16px currentColor;
            opacity: 0.6;
            margin-top: 6px;
        }
        .res-score-block { padding-bottom: 8px; }
        .res-score-label {
            font-family: var(--ui-font); font-size: 10px; letter-spacing: 3px;
            color: rgba(255,255,255,0.4); margin-bottom: 4px;
        }
        .res-score-value {
            font-family: var(--ui-font); font-weight: 900;
            font-size: clamp(28px, 4vw, 46px);
            color: #fff;
            text-shadow: 0 0 24px rgba(0,229,255,0.5);
            letter-spacing: 2px;
        }

        /* ── NEW RECORD ── */
        .res-new-record {
            display: inline-flex; align-items: center; gap: 10px;
            margin-top: 20px;
            font-family: var(--ui-font); font-weight: 900; font-size: clamp(14px, 2vw, 20px);
            letter-spacing: 3px;
            color: var(--fever-gold);
            text-shadow: 0 0 20px var(--fever-gold), 0 0 40px rgba(255,215,0,0.4);
            opacity: 0;
            animation: resNewRecord 0.65s cubic-bezier(.2,.9,.2,1) 0.82s forwards;
        }
        .res-new-record::before {
            content: '★';
            animation: nrSpin 1.5s linear infinite;
            display: inline-block;
        }
        .res-new-record::after {
            content: '★';
            animation: nrSpin 1.5s linear infinite reverse;
            display: inline-block;
        }
        .res-pb-diff {
            font-family: var(--ui-font); font-size: clamp(11px, 1.4vw, 14px);
            color: var(--green, #50e896);
            text-shadow: 0 0 12px rgba(80,232,150,0.5);
            opacity: 0; margin-top: 8px;
            animation: resLineUp 0.42s ease 0.90s forwards;
        }
        .res-pb-diff.negative { color: rgba(255,255,255,0.32); text-shadow: none; }
        @keyframes resNewRecord {
            0%   { opacity: 0; transform: scale(0.7) translateY(10px); filter: blur(4px); }
            60%  { opacity: 1; transform: scale(1.08) translateY(-2px); filter: blur(0); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes nrSpin { to { transform: rotate(360deg); } }

        /* ── 오른쪽: 스탯 패널 ── */
        .res-panel {
            display: flex; flex-direction: column; justify-content: center;
            padding: clamp(20px, 3vw, 48px) clamp(20px, 3vw, 40px);
            border-left: 1px solid rgba(255,255,255,0.07);
            background: rgba(0,0,0,0.28);
            overflow-y: auto;
            scrollbar-width: none;
            opacity: 0; transform: translateX(32px);
            animation: resPanelIn 0.52s cubic-bezier(.2,.9,.2,1) 0.36s forwards;
        }
        .res-panel::-webkit-scrollbar { display: none; }
        @keyframes resPanelIn {
            to { opacity: 1; transform: translateX(0); }
        }

        /* RATE / MAX COMBO */
        .res-stat-row {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin-bottom: 18px;
        }
        .res-stat {
            padding: 12px 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            opacity: 0; transform: translateY(14px);
        }
        .res-stat:nth-child(1) { animation: resLineUp 0.4s ease 0.54s forwards; }
        .res-stat:nth-child(2) { animation: resLineUp 0.4s ease 0.60s forwards; }
        .res-stat-label {
            font-family: var(--ui-font); font-size: 9px; letter-spacing: 2px;
            color: rgba(255,255,255,0.38); margin-bottom: 5px;
        }
        .res-stat-val {
            font-family: var(--ui-font); font-weight: 900; font-size: 22px; color: #fff;
        }

        /* 판정 그리드 */
        .res-judge-title {
            font-family: var(--ui-font); font-size: 9px; letter-spacing: 2px;
            color: rgba(255,255,255,0.3); margin-bottom: 8px;
            opacity: 0; animation: resLineUp 0.38s ease 0.64s forwards;
        }
        .res-judge-grid {
            display: flex; flex-direction: column; gap: 5px;
            margin-bottom: 20px;
        }
        .res-judge-row {
            display: flex; align-items: center; gap: 10px;
            opacity: 0; transform: translateX(-10px);
        }
        .res-judge-row:nth-child(1) { animation: resSlideR 0.35s ease 0.68s forwards; }
        .res-judge-row:nth-child(2) { animation: resSlideR 0.35s ease 0.73s forwards; }
        .res-judge-row:nth-child(3) { animation: resSlideR 0.35s ease 0.78s forwards; }
        .res-judge-row:nth-child(4) { animation: resSlideR 0.35s ease 0.83s forwards; }
        .res-judge-row:nth-child(5) { animation: resSlideR 0.35s ease 0.88s forwards; }
        .res-judge-row:nth-child(6) { animation: resSlideR 0.35s ease 0.93s forwards; }
        .res-judge-row:nth-child(7) { animation: resSlideR 0.35s ease 0.98s forwards; }
        .res-judge-row:nth-child(8) { animation: resSlideR 0.35s ease 1.03s forwards; }
        @keyframes resSlideR { to { opacity: 1; transform: translateX(0); } }
        .res-judge-name {
            font-family: var(--ui-font); font-size: 10px; font-weight: 700;
            width: 68px; flex-shrink: 0;
        }
        .res-judge-bar-wrap {
            flex: 1; height: 5px; background: rgba(255,255,255,0.07);
            border-radius: 3px; overflow: hidden;
        }
        .res-judge-bar {
            height: 100%; border-radius: 3px;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
            transform-origin: left;
            transform: scaleX(0);
            transition: transform 0.7s cubic-bezier(.2,.9,.2,1);
        }
        .res-judge-count {
            font-family: var(--ui-font); font-size: 12px; font-weight: 900;
            width: 36px; text-align: right; color: rgba(255,255,255,0.7);
        }

        /* 랭킹 */
        .res-ranking-wrap {
            opacity: 0; animation: resLineUp 0.4s ease 1.08s forwards;
        }
        .res-ranking-title {
            font-family: var(--ui-font); font-size: 9px; letter-spacing: 2px;
            color: rgba(255,255,255,0.3); margin-bottom: 8px;
        }
        .res-ranking-list { display: flex; flex-direction: column; gap: 4px; }
        .res-rank-entry {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 6px; font-size: 12px;
        }
        .res-rank-entry.is-me { background: rgba(0,229,255,0.07); color: var(--fever-gold); }
        .res-rank-medal { width: 22px; flex-shrink: 0; }
        .res-rank-name { flex: 1; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .res-rank-score { font-family: 'Orbitron'; font-size: 11px; }

        /* 하단 버튼 */
        .res-actions {
            display: flex; gap: 10px; margin-top: 18px;
            opacity: 0; animation: resLineUp 0.4s ease 1.18s forwards;
        }
        .res-btn {
            flex: 1; padding: 13px 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04);
            color: #fff; border-radius: 8px; cursor: pointer;
            font-family: var(--ui-font); font-size: 11px; font-weight: 700;
            letter-spacing: 1px; transition: 0.15s;
        }
        .res-btn:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.3); }
        .res-btn.primary {
            border-color: var(--accent); color: var(--accent);
            text-shadow: 0 0 12px rgba(0,229,255,0.4);
            box-shadow: inset 0 0 20px rgba(0,229,255,0.05);
        }
        .res-btn.primary:hover { background: var(--accent); color: #050e12; text-shadow: none; }

        /* badge */
        .res-badge-wrap {
            margin-bottom: 14px; min-height: 0;
            opacity: 0; animation: resScaleIn 0.46s cubic-bezier(.2,.9,.2,1) 0.76s forwards;
        }

        @keyframes blink { 50% { opacity: 0.3; } }
        .btn-common { margin-top: 20px; padding: 15px 50px; font-size: 18px; background: transparent; color: #fff; border: 2px solid var(--accent); border-radius: 50px; cursor: pointer; font-weight: 900; font-family: var(--ui-font); letter-spacing: 2px; transition: 0.2s; box-shadow: 0 0 15px rgba(0,229,255,0.2); text-shadow: 0 0 5px var(--accent); }

        /* Pause Menu - keyboard nav */

        .pause-title { font-family: 'Orbitron'; font-size: 60px; font-weight: 900; color: #fff; letter-spacing: 10px; margin-bottom: 50px; text-shadow: 0 0 20px rgba(255,255,255,0.5); }
        .pause-options { display: flex; flex-direction: column; gap: 20px; width: 320px; }
        .pause-btn {
            padding: 18px 50px; font-size: 18px; background: transparent; color: #aaa;
            border: 2px solid #444; border-radius: 50px; cursor: pointer; font-weight: 900;
            font-family: var(--ui-font); letter-spacing: 2px; transition: 0.15s; text-align: center;

        .pause-btn.selected {
            color: #fff; border-color: var(--accent);

        .pause-btn.selected::before {

        #resume-countdown {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;

        /* Guide Message */
        #guide-message {
            position: absolute; top: 35%; left: 50%; transform: translateX(-50%);

            font-family: var(--ui-font); font-weight: 900; font-size: 48px; color: #fff;

            white-space: nowrap; letter-spacing: 2px;
        }
        .msg-active { opacity: 1 !important; transform: translateX(-50%) scale(1.1) !important; }

        /* ★ 판정 팝업 오버레이 (canvas 위에 CSS로 표시) */
        #judge-display {
            position: absolute;
            inset: 0;
            pointer-events: none; z-index: 60;
        }
        .judge-popup {
            position: absolute;
            transform: translate(-50%, -50%);
            font-family: var(--ui-font);
            font-weight: 900;
            font-size: 32px;
            letter-spacing: 2px;
            animation: judgeAnim 0.5s forwards;
            display: inline-block;
            white-space: nowrap;
        }
        .judge-popup.judge-style-flat {
            text-shadow: none !important;
            filter: none !important;
            letter-spacing: 1px;
        }
        .judge-popup.judge-style-outline {
            color: #fff !important;
            text-shadow: 0 0 16px var(--judge-color), 0 0 34px var(--judge-color) !important;
            -webkit-text-stroke: 1.2px var(--judge-color);
            filter: none !important;
        }
        .judge-effect {
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 0;
            pointer-events: none;
            transform: translate(-50%, -50%);
            --judge-scale: 1;
            --judge-color: #00e5ff;
        }
        .judge-effect-ripple::before,
        .judge-effect-ripple::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 34px;
            height: 34px;
            border: 2px solid var(--judge-color);
            border-radius: 50%;
            box-shadow: 0 0 18px var(--judge-color), inset 0 0 14px rgba(255, 255, 255, 0.22);
            transform: translate(-50%, -50%) scale(0.24);
            animation: judgeRipple 0.52s ease-out forwards;
        }
        .judge-effect-ripple.judge-effect-perfect::before,
        .judge-effect-ripple.judge-effect-perfect::after {
            border: 0;
            background: conic-gradient(from 90deg, #ff0080, #ff8c00, #ffe000, #00ff88, #00e5ff, #7b2fff, #ff0080);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
            box-shadow: 0 0 18px #fff, 0 0 28px #ff0080, inset 0 0 14px rgba(255, 255, 255, 0.22);
        }
        .judge-effect-ripple::after {
            animation-delay: 0.08s;
            opacity: 0.7;
        }
        .judge-effect-linewave {
            width: var(--wave-width);
            height: 2px;
            transform: translate(-50%, -50%) rotate(var(--judge-angle, 0deg));
            transform-origin: center center;
        }
        .judge-effect-linewave::before,
        .judge-effect-linewave::after {
            content: "";
            position: absolute;
            left: 50%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--judge-color), #fff, var(--judge-color), transparent);
            box-shadow: 0 0 14px var(--judge-color), 0 0 28px rgba(255, 255, 255, 0.28);
            transform: translateX(-50%) scaleX(0.35);
            opacity: 0;
        }
        .judge-effect-linewave.judge-effect-perfect::before,
        .judge-effect-linewave.judge-effect-perfect::after {
            background: linear-gradient(90deg, transparent, #ff0080, #ff8c00, #ffe000, #00ff88, #00e5ff, #7b2fff, #ff0080, transparent);
            box-shadow: 0 0 12px #fff, 0 0 22px #ff0080, 0 0 34px #00e5ff;
        }
        .judge-effect-linewave::before {
            top: 0;
            animation: judgeLineWaveUp 0.48s ease-out forwards;
        }
        .judge-effect-linewave::after {
            bottom: 0;
            animation: judgeLineWaveDown 0.48s ease-out forwards;
        }
        @keyframes judgeRipple {
            0% { opacity: 0.95; transform: translate(-50%, -50%) scale(0.24); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(calc(2.5 * var(--judge-scale))); }
        }
        @keyframes judgeLineWaveUp {
            0% { opacity: 0.95; transform: translateX(-50%) translateY(0) scaleX(0.35); }
            100% { opacity: 0; transform: translateX(-50%) translateY(calc(-42px * var(--judge-scale))) scaleX(1.12); }
        }
        @keyframes judgeLineWaveDown {
            0% { opacity: 0.95; transform: translateX(-50%) translateY(0) scaleX(0.35); }
            100% { opacity: 0; transform: translateX(-50%) translateY(calc(42px * var(--judge-scale))) scaleX(1.12); }
        }
        @keyframes judgeAnim {
            0%   { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
            60%  { opacity: 1; transform: translate(-50%, calc(-50% - 15px)) scale(1.0); }
            100% { opacity: 0; transform: translate(-50%, calc(-50% - 30px)) scale(0.9); }
        }
        /* Perfect! 레인보우 */
        .judge-perfect-ex {
            background: linear-gradient(90deg, #ff0080, #ff8c00, #ffe000, #00ff88, #00e5ff, #7b2fff, #ff0080);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: judgeAnim 0.5s forwards, rainbow-shift 0.8s linear infinite;
            filter: drop-shadow(0 0 12px #fff) drop-shadow(0 0 6px #ff0080);
            font-size: 38px;
        }
        .judge-perfect-ex.judge-style-flat {
            background: none;
            -webkit-text-fill-color: var(--judge-color);
            color: var(--judge-color);
        }
        .judge-perfect-ex.judge-style-outline {
            background: none;
            -webkit-text-fill-color: #fff;
            color: #fff !important;
        }
        @keyframes rainbow-shift { 0% { background-position: 0% 0%; } 100% { background-position: 300% 0%; } }
    </style>

<body>

    <script>
    (function() {

    // ============================================================
    // ★ 판정 시스템 정의 (8단계)
    // ============================================================
    const JUDGE_TABLE = [
        {

        {

            glowColor: '#FF7733',
            particleColors: ['#FF7733','#ffaa66','#cc4400'],

        {
            name: 'Oh...',
            window: 110,
            rate: 5,
            scoreRate: 0.05,
            key: 'oh',
            cssClass: 'judge-oh',
            color: '#FF2D78',

        {
            name: 'No...',
            window: Infinity,
            rate: 0,
            scoreRate: 0,
            key: 'miss',
            cssClass: 'judge-no',
            color: '#555566',
            glowColor: '#555566',
            particleColors: ['#555566'],
            comboBreak: true,
        },
    ];

    // 판정 CSS 스타일 동적 삽입
    const judgeStyles = `
        .judge-perfect { color: #FFE000; text-shadow: 0 0 20px #FFE000, 0 0 40px #ffe000aa; }
        .judge-great   { color: #00F2FF; text-shadow: 0 0 20px #00F2FF, 0 0 40px #00f2ffaa; }
        .judge-good    { color: #88FF00; text-shadow: 0 0 20px #88FF00, 0 0 40px #88ff0088; }
        .judge-notbad  { color: #FFB300; text-shadow: 0 0 16px #FFB300, 0 0 30px #ffb30066; }
        .judge-save    { color: #FF7733; text-shadow: 0 0 14px #FF7733, 0 0 28px #ff773366; }
        .judge-oh      { color: #FF2D78; text-shadow: 0 0 18px #FF2D78, 0 0 35px #ff2d7888; }
        .judge-no      { color: #555566; opacity: 0.6; font-size: 24px !important; }
    `;
    const styleEl = document.createElement('style');
    styleEl.textContent = judgeStyles;
    document.head.appendChild(styleEl);

    function getMusicVolumeSetting() {
        const value = parseFloat(localStorage.getItem('wb_bgm_volume') || localStorage.getItem('wb_music_volume') || "0.65");
        return Math.max(0, Math.min(1, Number.isFinite(value) ? value : 0.65));
    }

    function isFeverEnabled() {
        return localStorage.getItem('wb_fever_enabled') !== '0';
    }

    // ============================================================
    // 기존 변수 / 초기화
    // ============================================================
    const SERVER_URL = "https://port-0-vibecoding-rhythmgame-server-mkgu8rcq7cd54e6c.sel3.cloudtype.app/api/score"; 
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const GOOGLE_CLIENT_ID = "143854068141-s09m4p44lfju13dv2gdotoe9hbjfvmmr.apps.googleusercontent.com"; 
    let userProfile = null;

    const GRADE_THRESHOLDS = [
        { min: 1000000, grade: 'TB',     label: 'TROLL BEAT', hex: '#ffffff' },
        { min: 980000,  grade: 'S+',     label: 'S+',         hex: '#00ffff' },
        { min: 950000,  grade: 'S',      label: 'S',          hex: '#00e5ff' },
        { min: 925000,  grade: 'A+',     label: 'A+',         hex: '#00ff88' },
        { min: 880000,  grade: 'A',      label: 'A',          hex: '#00cc66' },
        { min: 800000,  grade: 'B',      label: 'B',          hex: '#3b9eff' },
        { min: 600000,  grade: 'C',      label: 'C',          hex: '#ffc832' },
        { min: 0,       grade: 'FAILED', label: 'FAILED',     hex: '#ff4455' } 
    ];

    

    function getGradeFromScore(score) {
        return GRADE_THRESHOLDS.find(t => score >= t.min) || GRADE_THRESHOLDS[GRADE_THRESHOLDS.length - 1];
    }

    const bgaImage    = document.getElementById('bga-image');
    const bgaOverlay  = document.getElementById('bga-overlay');
    const bgCanvas    = document.getElementById('bgCanvas');
    const bgCtx       = bgCanvas.getContext('2d');
    const bgaVideo    = null;     // BGA 비디오 제거 — 곡 이미지 배경 사용
    let useVideoBga   = false;    // 항상 false (아래 video 관련 코드는 전부 no-op)

    const warnLeft  = document.getElementById('warn-left');
    const warnRight = document.getElementById('warn-right');
    const speedEdgeWarning = document.getElementById('speed-edge-warning');
    const speedEdgeLabel = speedEdgeWarning.querySelector('.speed-edge-label');
    const pauseMenu = document.getElementById('pause-menu');
    const countdownEl = document.getElementById('resume-countdown');
    const judgeDisplayEl = document.getElementById('judge-display');

    // ★ 일시정지 메뉴 키보드 네비게이션
    const pauseActions = ['resume', 'restart', 'quit'];
    let pauseSelectedIdx = 0;

    function updatePauseSelection() {
        document.querySelectorAll('.pause-btn').forEach((btn, i) => {
            btn.classList.toggle('selected', i === pauseSelectedIdx);
        });
    }

    function executePauseAction(action) {
        switch(action) {
            case 'resume':  togglePause(); break;
            case 'restart': location.reload(); break;
            case 'quit':    location.href = 'index.html'; break;
        }
    }

    // 버튼 클릭도 동작하게
    document.querySelectorAll('.pause-btn').forEach((btn, i) => {
        btn.addEventListener('click', () => {
            pauseSelectedIdx = i;
            updatePauseSelection();
            executePauseAction(btn.dataset.action);
        });
    });

    function logStatus(msg) {
        console.log(msg);
        const el = document.getElementById('loading-msg');
        if(el) el.innerText = msg;
    }

    try {
        const stored = localStorage.getItem('wb_auth_profile');
        if (stored) userProfile = JSON.parse(stored);
    } catch(e) {}

    window.onload = function() {
        if (typeof google !== 'undefined' && google.accounts && !userProfile) {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse
            });
        }
    };

    function handleCredentialResponse(response) {
        const responsePayload = parseJwt(response.credential);
        userProfile = responsePayload;
        localStorage.setItem('wb_auth_profile', JSON.stringify(responsePayload));
        if(gameFinished) showResult();
    }

    function parseJwt(token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    }

    // ============================================================
    // 오디오
    // ============================================================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const soundBuffers = {};

    async function loadSound(name, url) {
        try {
            const response = await fetch(url);
            if(!response.ok) throw new Error(`SFX 404: ${url}`);
            const arrayBuffer = await response.arrayBuffer();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            soundBuffers[name] = audioBuffer;
        } catch (e) { console.warn(e); }
    }

    loadSound('hit', 'sfx/hit.mp3');
    loadSound('hold_start', 'sfx/hold_start.mp3');
    loadSound('hold_end', 'sfx/hold_end.mp3');
    loadSound('fc', 'sfx/full_combo.wav');
    loadSound('ap_main', 'sfx/all_perfect.wav');
    loadSound('ap_layer', 'sfx/glitch.wav');
    loadSound('menu_open', 'sfx/drawer.wav'); 
    loadSound('fever', 'sfx/fever.wav');

    function playSfx(name) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (!soundBuffers[name]) return;
        const source = audioCtx.createBufferSource();
        source.buffer = soundBuffers[name];
        const gainNode = audioCtx.createGain();
        const savedVol = parseFloat(localStorage.getItem('wb_sfx_volume') || "0.7");
        gainNode.gain.value = savedVol;
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        source.start(0);
    }

    // ============================================================

    resultBgm.volume = 0;

    const gameCanvas    = document.getElementById('gameCanvas');

    const finishEffect  = document.getElementById('finish-effect');

    let TRACK_X_OFFSET = 25;

    let NOTE_WIDTH     = 90;
    let NOTE_X_PADDING = 5;
    let HIT_LINE_Y   = window.innerHeight * 0.85;
    const LANE_COUNT = 7; // 에디터와 동일: 라인은 항상 7개 (활성/비활성은 activeEvents로 결정)

    // 노트가 모이는 중앙 영역 (editor의 GEAR 영역과 동일 개념)
    let GEAR_W = 0, GEAR_X = 0;
    function computeGear(){
        GEAR_W = Math.min(700, window.innerWidth * 0.95);
        GEAR_X = (window.innerWidth - GEAR_W) / 2;
        TRACK_X_OFFSET = GEAR_X;

        NOTE_WIDTH = LANE_WIDTH - 10;
    }

    if (isMobile) {
        document.body.classList.add('mobile-mode');

    }
    // 캔버스는 항상 전체화면 (HUD가 창 가장자리에, 노트는 중앙 GEAR 영역에)
    gameCanvas.width  = window.innerWidth;
    gameCanvas.height = window.innerHeight;

    function resizeBg() {

    window.addEventListener('resize', () => {

    resizeBg();
    window.addEventListener('storage', (e) => {

    const COLORS = ['#FF4081', '#00E676', '#00E676', '#448AFF'];
    const NOTE_SKIN_DEFAULTS = {
        skin: 'thin-bar',
        size: 100,
        colorTheme: 'default',
        uiFont: 'orbitron',
        customColors: [null, null, null, null, null, null, null],
        useCustomColors: false,

            combo: { x: 50, y: 48 },

            rate: { x: 12, y: 4 },
            comboLabel: false
        }
    };

    const FONT_FAMILIES = {
        orbitron:  "'Orbitron', sans-serif",
        exo2:      "'Exo 2', sans-serif",
        sharetech: "'Share Tech Mono', monospace",
        rajdhani:  "'Rajdhani', sans-serif",
        audiowide: "'Audiowide', sans-serif",
        oxanium:   "'Oxanium', sans-serif",
    };
    const COLOR_THEMES = {
        default: ['#b84060', '#2a9558', '#3d8fb0', '#b07830', '#8a5fc0', '#c05f7a', '#3fa8a0'],
        deuteranopia: ['#0072b2', '#e69f00', '#56b4e9', '#f0e442', '#009e73', '#d55e00', '#cc79a7'],
        protanopia: ['#0072b2', '#d55e00', '#56b4e9', '#cc79a7', '#e69f00', '#f0e442', '#009e73'],
        tritanopia: ['#e69f00', '#009e73', '#d55e00', '#0072b2', '#56b4e9', '#cc79a7', '#f0e442'],
        monochrome: ['#f4f4f4', '#d0d0d0', '#acacac', '#888888', '#666666', '#484848', '#2e2e2e']
    };

    function readNoteSkinConfig() {
        let saved = {};
        try { saved = JSON.parse(localStorage.getItem('wb_note_skin_config') || '{}'); } catch(e) {}
        const hud = Object.assign({}, NOTE_SKIN_DEFAULTS.hud, saved.hud || {});
        hud.combo = Object.assign({}, NOTE_SKIN_DEFAULTS.hud.combo, hud.combo || {});
        hud.score = Object.assign({}, NOTE_SKIN_DEFAULTS.hud.score, hud.score || {});
        hud.rate  = Object.assign({}, NOTE_SKIN_DEFAULTS.hud.rate,  hud.rate  || {});
        const customColors = Array.isArray(saved.customColors)
            ? [...saved.customColors]
            : new Array(LANE_COUNT).fill(null);
        return Object.assign({}, NOTE_SKIN_DEFAULTS, saved, { hud, customColors });
    }

    function clampNumber(value, min, max, fallback) {
        const n = parseFloat(value);
        if (!Number.isFinite(n)) return fallback;
        return Math.max(min, Math.min(max, n));
    }

    function getLaneColor(lane) {
        const cfg = readNoteSkinConfig();
        const palette = COLOR_THEMES[cfg.colorTheme] || COLOR_THEMES.default;
        const base = palette[lane % palette.length];
        if (cfg.useCustomColors && cfg.customColors[lane]) return cfg.customColors[lane];
        return base;
    }

    function getNoteStyleMetrics(cfg, laneHalf) {
        const sizeScale = clampNumber(cfg.size, 50, 160, 100) / 100;
        const baseWidth = laneHalf * 2;
        const skin = cfg.skin || 'thin-bar';
        let width = (baseWidth - 12) * sizeScale;
        let height = 8 * sizeScale;
        let radius = 2 * sizeScale;
        if (skin === 'circle') {
            const d = Math.min(baseWidth * 0.72, 42) * sizeScale;
            width = d; height = d; radius = d / 2;
        } else if (skin === 'medium-bar') {
            height = 14 * sizeScale; radius = 3 * sizeScale;
        } else if (skin === 'thick-bar') {
            height = 22 * sizeScale; radius = 4 * sizeScale;
        } else if (skin === 'neon-core') {
            height = 16 * sizeScale; radius = 4 * sizeScale;
        } else if (skin === 'star') {
            const d = Math.min(baseWidth * 0.82, 46) * sizeScale;
            width = d; height = d; radius = d / 2;
        } else if (skin === 'round-thin') {
            height = 9 * sizeScale; radius = height / 2;
        } else if (skin === 'round-medium') {
            height = 15 * sizeScale; radius = height / 2;
        } else if (skin === 'round-thick') {
            height = 24 * sizeScale; radius = height / 2;
        }
        return { skin, width, height, radius, sizeScale };
    }

    function drawStarShape(ctx, x, y, outer, inner, points) {
        ctx.beginPath();
        for (let i = 0; i < points * 2; i++) {
            const r = i % 2 === 0 ? outer : inner;
            const a = -Math.PI / 2 + i * Math.PI / points;
            const px = x + Math.cos(a) * r;
            const py = y + Math.sin(a) * r;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
    }

    function drawSkinnedLine(ctx, laneHalf, col, active, metrics) {
        const skin = metrics.skin;
        ctx.shadowColor = col;
        ctx.fillStyle = col;
        ctx.strokeStyle = col;

        // ── thin-bar: editor-style precision line ──
        if (skin === 'thin-bar' || skin === 'round-thin' || skin === 'medium-bar' || skin === 'round-medium' || skin === 'thick-bar' || skin === 'round-thick') {
            ctx.shadowBlur = active ? 10 : 3;
            ctx.lineWidth = active ? 2.2 : 1.4;
            ctx.globalAlpha = active ? 0.95 : 0.70;
            ctx.beginPath();
            ctx.moveTo(-laneHalf, 0);
            ctx.lineTo(laneHalf, 0);
            ctx.stroke();
            // center dot
            ctx.shadowBlur = active ? 8 : 2;
            ctx.globalAlpha = 1;
            ctx.beginPath();
            ctx.arc(0, 0, active ? 3.5 : 2, 0, Math.PI * 2);
            ctx.fill();
        } else if (skin === 'circle') {
            // circle skin: ring + dot
            ctx.shadowBlur = active ? 12 : 4;
            ctx.lineWidth = active ? 2.0 : 1.2;
            ctx.globalAlpha = active ? 0.95 : 0.72;
            ctx.beginPath();
            ctx.arc(0, 0, Math.max(10, metrics.height * 0.44), 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, active ? 4 : 2.6, 0, Math.PI * 2);
            ctx.fill();
        } else if (skin === 'star') {
            // star skin: wavy line + star dot
            ctx.shadowBlur = active ? 12 : 4;
            ctx.lineWidth = active ? 1.8 : 1.1;
            ctx.globalAlpha = active ? 0.95 : 0.72;
            ctx.beginPath();
            ctx.moveTo(-laneHalf, 0);
            for (let i = 0; i <= 10; i++) {
                const sx = -laneHalf + (laneHalf * 2 * i / 10);
                const sy = (i % 2 === 0 ? -1 : 1) * (active ? 4 : 2.5);
                ctx.lineTo(sx, sy);
            }
            ctx.stroke();
            ctx.shadowBlur = active ? 14 : 6;
            drawStarShape(ctx, 0, 0, active ? 7 : 5.5, active ? 3 : 2.2, 5);
            ctx.fill();
        } else if (skin === 'neon-core') {
            // neon-core: double-line with bright center
            ctx.shadowBlur = active ? 16 : 6;
            ctx.lineWidth = active ? 3.5 : 2.0;
            ctx.globalAlpha = active ? 0.55 : 0.35;
            ctx.beginPath();
            ctx.moveTo(-laneHalf, 0);
            ctx.lineTo(laneHalf, 0);
            ctx.stroke();
            // bright core
            ctx.shadowBlur = active ? 20 : 8;
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = active ? 1.2 : 0.8;
            ctx.globalAlpha = active ? 0.85 : 0.55;
            ctx.beginPath();
            ctx.moveTo(-laneHalf * 0.7, 0);
            ctx.lineTo(laneHalf * 0.7, 0);
            ctx.stroke();
            // center dot
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = active ? 10 : 4;
            ctx.globalAlpha = 1;
            ctx.beginPath();
            ctx.arc(0, 0, active ? 3 : 2, 0, Math.PI * 2);
            ctx.fill();
        } else {
            // fallback
            ctx.shadowBlur = active ? 10 : 3;
            ctx.lineWidth = active ? 2.2 : 1.4;
            ctx.globalAlpha = active ? 0.95 : 0.70;
            ctx.beginPath();
            ctx.moveTo(-laneHalf, 0);
            ctx.lineTo(laneHalf, 0);
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.beginPath();
            ctx.arc(0, 0, active ? 3.5 : 2, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    }

    function drawSkinnedNote(ctx, metrics, y, col) {
        const x = -metrics.width / 2;
        const h = metrics.height;
        const skin = metrics.skin;
        ctx.shadowColor = col;
        ctx.fillStyle = col;

        if (skin === 'thin-bar') {
            // Editor-style: slim bar with top highlight
            ctx.globalAlpha = 0.88;
            ctx.shadowBlur = 5;
            roundRect(ctx, x, y - h / 2, metrics.width, h, metrics.radius);
            ctx.fill();
            // top highlight stripe
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.shadowBlur = 0;
            roundRect(ctx, x, y - h / 2, metrics.width, h * 0.32, metrics.radius);
            ctx.fill();

        } else if (skin === 'medium-bar') {
            // Medium bar: filled + bright top edge + subtle bottom fade
            ctx.globalAlpha = 0.90;
            ctx.shadowBlur = 7;
            roundRect(ctx, x, y - h / 2, metrics.width, h, metrics.radius);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.22)';
            ctx.shadowBlur = 0;
            roundRect(ctx, x, y - h / 2, metrics.width, h * 0.28, metrics.radius);
            ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.18)';
            roundRect(ctx, x, y + h * 0.22, metrics.width, h * 0.28, metrics.radius);
            ctx.fill();

        } else if (skin === 'thick-bar') {
            // Thick bar: prominent with gradient-feel layers
            ctx.globalAlpha = 0.92;
            ctx.shadowBlur = 9;
            roundRect(ctx, x, y - h / 2, metrics.width, h, metrics.radius);
            ctx.fill();
            // bright top band
            ctx.fillStyle = 'rgba(255,255,255,0.28)';
            ctx.shadowBlur = 0;
            roundRect(ctx, x, y - h / 2, metrics.width, h * 0.25, metrics.radius);
            ctx.fill();
            // thin bright edge line
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            roundRect(ctx, x, y - h / 2, metrics.width, 1.5, metrics.radius);
            ctx.fill();

        } else if (skin === 'round-thin') {
            // Fully pill-shaped, softly glowing
            ctx.globalAlpha = 0.88;
            ctx.shadowBlur = 6;
            roundRect(ctx, x, y - h / 2, metrics.width, h, h / 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.28)';
            ctx.shadowBlur = 0;
            roundRect(ctx, x + 3, y - h / 2 + 1, metrics.width - 6, h * 0.42, (h * 0.42) / 2);
            ctx.fill();

        } else if (skin === 'round-medium') {
            // Pill bar, richer
            ctx.globalAlpha = 0.90;
            ctx.shadowBlur = 8;
            roundRect(ctx, x, y - h / 2, metrics.width, h, h / 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.shadowBlur = 0;
            roundRect(ctx, x + 4, y - h / 2 + 1.5, metrics.width - 8, h * 0.38, (h * 0.38) / 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.50)';
            roundRect(ctx, x + metrics.width * 0.3, y - h / 2 + 1, metrics.width * 0.4, 1.5, 1);
            ctx.fill();

        } else if (skin === 'round-thick') {
            // Fat pill, bold highlight
            ctx.globalAlpha = 0.92;
            ctx.shadowBlur = 12;
            roundRect(ctx, x, y - h / 2, metrics.width, h, h / 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.30)';
            ctx.shadowBlur = 0;
            roundRect(ctx, x + 5, y - h / 2 + 2, metrics.width - 10, h * 0.35, (h * 0.35) / 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            roundRect(ctx, x + metrics.width * 0.25, y - h / 2 + 1.5, metrics.width * 0.5, 2, 1);
            ctx.fill();

        } else if (skin === 'circle') {
            // Solid circle + specular highlight
            ctx.globalAlpha = 0.90;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(0, y, h / 2, 0, Math.PI * 2);
            ctx.fill();
            // specular dot
            ctx.fillStyle = 'rgba(255,255,255,0.38)';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(-h * 0.14, y - h * 0.16, h * 0.18, 0, Math.PI * 2);
            ctx.fill();
            // rim edge
            ctx.strokeStyle = 'rgba(255,255,255,0.20)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(0, y, h / 2, 0, Math.PI * 2);
            ctx.stroke();

        } else if (skin === 'star') {
            // Star with outer glow ring
            ctx.globalAlpha = 0.90;
            ctx.shadowBlur = 10;
            drawStarShape(ctx, 0, y, h / 2, h * 0.22, 5);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = Math.max(1, h * 0.06);
            ctx.shadowBlur = 0;
            ctx.stroke();
            // tiny bright center
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            ctx.beginPath();
            ctx.arc(0, y, h * 0.09, 0, Math.PI * 2);
            ctx.fill();

        } else if (skin === 'neon-core') {
            // Dark fill + bright border + inner hot line
            ctx.globalAlpha = 0.92;
            ctx.fillStyle = '#06080e';
            ctx.shadowBlur = 0;
            roundRect(ctx, x, y - h / 2, metrics.width, h, metrics.radius);
            ctx.fill();
            ctx.strokeStyle = col;
            ctx.shadowBlur = 14;
            ctx.lineWidth = Math.max(1.5, h * 0.15);
            ctx.globalAlpha = 0.88;
            roundRect(ctx, x, y - h / 2, metrics.width, h, metrics.radius);
            ctx.stroke();
            // inner core line
            ctx.globalAlpha = 0.80;
            ctx.fillStyle = col;
            ctx.shadowBlur = 8;
            roundRect(ctx, x + metrics.width * 0.1, y - 1, metrics.width * 0.8, 2, 1);
            ctx.fill();
            // end caps glow
            ctx.globalAlpha = 0.70;
            ctx.shadowBlur = 12;
            ctx.beginPath(); ctx.arc(x + metrics.radius, y, metrics.radius * 0.65, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(-x - metrics.radius, y, metrics.radius * 0.65, 0, Math.PI * 2); ctx.fill();

        } else {
            // fallback = thin-bar style
            ctx.globalAlpha = 0.88;
            ctx.shadowBlur = 5;
            roundRect(ctx, x, y - h / 2, metrics.width, h, metrics.radius);
            ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,0.18)';
            ctx.shadowBlur = 0;
            roundRect(ctx, x, y - h / 2, metrics.width, h * 0.32, metrics.radius);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    }

    function applyHudLayout() {
        const cfg = readNoteSkinConfig();

        // 폰트 적용
        const fontFamily = FONT_FAMILIES[cfg.uiFont] || FONT_FAMILIES.orbitron;
        document.documentElement.style.setProperty('--ui-font', fontFamily);
        const map = [
            ['.hud-combo', cfg.hud.combo, 50, 50],
            ['.hud-score', cfg.hud.score, 100, 0],
            ['.hud-rate',  cfg.hud.rate,  0,   0]
        ];
        map.forEach(([selector, pos, defAX, defAY]) => {
            const el = document.querySelector(selector);
            if (!el || !pos) return;
            el.dataset.customPos = '1';
            el.style.left = clampNumber(pos.x, 0, 100, 50) + '%';
            el.style.top  = clampNumber(pos.y, 0, 100, 10) + '%';
            const ax = pos.anchorX ?? defAX;
            const ay = pos.anchorY ?? defAY;
            el.style.transform = `translate(-${ax}%, -${ay}%)`;
            el.style.textAlign = ax > 60 ? 'right' : ax < 40 ? 'left' : 'center';
        });
        const comboEl = document.querySelector('.hud-combo');
        if (comboEl) comboEl.classList.toggle('combo-label-on', !!cfg.hud.comboLabel);
    }
    applyHudLayout();

    // ============================================================
    // ★ LINE CHOREOGRAPHY SYSTEM (에디터에서 이식)
    // ============================================================
    const LANE_COLORS = ['#ff4081','#00e676','#29b6f6','#ffa726','#c084fc','#ff6b6b','#4dd0e1'];
    // 7개 라인 모두 기본적으로 한 줄에 균등 간격으로 나란히 배치 (에디터와 동일)
    const DEFAULT_LINE = Array.from({length:LANE_COUNT},(_,i)=>({x:(i+0.5)/LANE_COUNT, y:0.85, angle:0}));
    let lineEvents  = Array.from({length:LANE_COUNT},()=>[]);
    let pulseEvents = Array.from({length:LANE_COUNT},()=>[]);
    let activeEvents = Array.from({length:LANE_COUNT},()=>[]); // 라인 등장/퇴장(온오프) 이벤트
    let DEFAULT_ACTIVE_SET = [1,2,4,5]; // 기존 맵은 다 4키(D F J K)로 만들어졌으니, 정보가 없으면 기본 4키 (차트의 initKeyCount/activeEvents로 갱신됨)
    function defaultLineActive(lane){ return DEFAULT_ACTIVE_SET.includes(lane); }
    // 흔히 쓰는 키 개수별 관례적 구성 (라인 인덱스 순서: S,D,F,SPACE,J,K,L — 에디터와 완전히 동일)
    // 4키=D F J K, 5키=D F SPACE J K, 6키=S D F J K L, 7키=S D F SPACE J K L
    const ACTIVE_KEY_SETS = {
        3: [2,4,5],           // F J K
        4: [1,2,4,5],         // D F J K
        5: [1,2,3,4,5],       // D F SPACE J K
        6: [0,1,2,4,5,6],     // S D F J K L
        7: [0,1,2,3,4,5,6],   // S D F SPACE J K L
    };
    // 활성화될 라인 수(n)에 맞춰, 그 라인들을 화면 가운데에 원래 간격(100px) 그대로 나란히 재배치
    // (에디터의 "초기 키 개수" 설정과 완전히 동일한 로직)
    function applyInitialKeyLayout(n){
        n = Math.max(1, Math.min(LANE_COUNT, Math.round(n) || 4));
        const indices = (ACTIVE_KEY_SETS[n] || Array.from({length:n},(_,i)=>i)).slice();
        DEFAULT_ACTIVE_SET = indices.slice();
        // 1) 우선 7개 라인 전부를 "가상의 7키 전체 배치" 슬롯 위치로 되돌림 (비활성 라인들의 기본 위치)
        for(let i=0;i<LANE_COUNT;i++){
            DEFAULT_LINE[i].x = (i+0.5)/LANE_COUNT;
            DEFAULT_LINE[i].y = 0.85;
            DEFAULT_LINE[i].angle = 0;
        }
        // 2) 이번에 켜지는 라인들만, 원래 길이(간격)를 유지한 채 화면 가운데에 나란히 재배치
        const spacingFrac = 100 / GEAR_W; // 항상 100px 간격 유지
        indices.forEach((lineIdx,k)=>{
            DEFAULT_LINE[lineIdx].x = 0.5 + (k-(n-1)/2)*spacingFrac;
            DEFAULT_LINE[lineIdx].y = 0.85;
            DEFAULT_LINE[lineIdx].angle = 0;
        });
    }
    function getLineActive(lane, chartMs){
        const events = activeEvents[lane];
        let active = defaultLineActive(lane);
        if(events && events.length){
            for(let i=0;i<events.length;i++){
                if(evTimeMs(events[i])<=chartMs) active = events[i].active;
                else break;
            }
        }
        return active;
    }
    applyInitialKeyLayout(4); // 기본값: 4키 가운데 정렬 (차트에 initKeyCount가 있으면 parseChartData에서 다시 적용됨)
    let lineStates  = DEFAULT_LINE.map(l=>({...l}));
    let linePulsePhase = new Array(LANE_COUNT).fill(0);

    // ── 카메라 (이동/회전/반전/줌) — 라인과는 별개의 단일 타임라인 ──
    let cameraEvents = [], camFlipXEvents = [], camFlipYEvents = [], camZoomEvents = [];
    let effectEvents = []; // ★ 화면 이펙트(글리치/필터/날씨 등) 트리거 목록 — 에디터 FX 탭에서 만든 것
    const DEFAULT_CAMERA = {x:0,y:0,angle:0};
    const DEFAULT_ZOOM_PERCENT = 100;
    let camState = {x:0,y:0,angle:0}, camFlipX=false, camFlipY=false, camZoom=1;
    function getCameraState(chartMs){
        const events=cameraEvents;
        let baseX=DEFAULT_CAMERA.x, baseY=DEFAULT_CAMERA.y, baseAngle=DEFAULT_CAMERA.angle;
        let resultX=baseX, resultY=baseY, resultAngle=baseAngle;
        if(!events||events.length===0) return {x:resultX,y:resultY,angle:resultAngle};
        for(let i=0;i<events.length;i++){
            const ev=events[i];
            const startT=evTimeMs(ev);
            if(chartMs<startT) break;
            let t=(chartMs-startT)/Math.max(1,ev.duration);
            if(t>1) t=1;
            const et=applyEasing(t,ev.easing,ev);
            let curX,curY,curAngle;
            if(ev.moveType==='absolute'){
                curX=baseX+(ev.x-baseX)*et; curY=baseY+(ev.y-baseY)*et; curAngle=baseAngle+(ev.angle-baseAngle)*et;
            }else{
                curX=baseX+ev.x*et; curY=baseY+ev.y*et; curAngle=baseAngle+ev.angle*et;
            }
            resultX=curX; resultY=curY; resultAngle=curAngle;
            if(t>=1){ baseX=curX; baseY=curY; baseAngle=curAngle; }
        }
        return {x:resultX,y:resultY,angle:resultAngle};
    }
    function getCameraFlip(axis, chartMs){
        const events = axis==='x'?camFlipXEvents:camFlipYEvents;
        let flipped=false;
        if(events&&events.length){
            for(let i=0;i<events.length;i++){
                if(evTimeMs(events[i])<=chartMs) flipped=events[i].flipped;
                else break;
            }
        }
        return flipped;
    }
    function getCameraZoomPercent(chartMs){
        const events=camZoomEvents;
        let base=DEFAULT_ZOOM_PERCENT, result=base;
        if(!events||events.length===0) return result;
        for(let i=0;i<events.length;i++){
            const ev=events[i];
            const startT=evTimeMs(ev);
            if(chartMs<startT) break;
            let t=(chartMs-startT)/Math.max(1,ev.duration);
            if(t>1) t=1;
            const et=applyEasing(t,ev.easing,ev);
            let cur=(ev.moveType==='absolute')?base+(ev.value-base)*et:base+ev.value*et;
            result=cur;
            if(t>=1) base=cur;
        }
        return result;
    }
    function getCameraZoom(chartMs){ return getCameraZoomPercent(chartMs)/100; }

    function evTimeMs(ev){
      if(ev.measureIdx!==undefined){
        const mpm=(60000/bpm)*(4/beatDenom)*beatNum;
        return ev.measureIdx*mpm+(ev.pos/BASE_RES)*mpm;
      }
      return ev.time||0;
    }

    // ==================================================================
    // ★ 화면 이펙트(FX) 러타임 엔진 — 에디터 FX 탭에서 만든 트리거를 그대로 재생
    // ==================================================================
    function getActiveEffects(chartMs,events){
      const src=events||effectEvents;
      if(!src||!src.length) return [];
      const out=[];
      for(let i=0;i<src.length;i++){
        const ev=src[i];
        const st=evTimeMs(ev);
        const dur=Math.max(1,ev.duration||1);
        const en=st+dur;
        if(chartMs>=st&&chartMs<=en){
          const t=chartMs-st;
          const fadeMs=Math.min(200,dur/2);
          const attack=ev.attack||'fade';
          const release=ev.release||'fade';
          let env=1;
          if(attack!=='instant' && t<fadeMs) env=Math.min(env,t/fadeMs);
          if(release!=='instant' && (dur-t)<fadeMs) env=Math.min(env,(dur-t)/fadeMs);
          env=Math.max(0,Math.min(1,env));
          out.push({type:ev.type,intensity:(ev.intensity??60)/100,env,progress:t/dur,durMs:dur,tMs:t});
        }
      }
      return out;
    }

const weatherParticles={snow:[],rain:[],heavyrain:[],sakura:[],fog:[],confetti:[],embers:[],snowstorm:[],splash:[]};
let fxLightningAlpha=0;           // 폭우 이펙트의 번개 플래시

// 시간에 따라 부드럽게 흔들리는 바람 세기(-1~1). 파티클마다 seed를 다르게 주면
// 같은 바람이라도 입자별로 살짝 다른 위상으로 흩날려서 자연스러워짐
function fxWind(ct,seed){
  return Math.sin(ct*0.00035+seed)*0.65 + Math.sin(ct*0.0009+seed*1.7)*0.35;
}

// 픽셀화(8비트)용 오프스크린 캔버스
const fxPixelCanvas=document.createElement('canvas');
const fxPixelCtx=fxPixelCanvas.getContext('2d');
fxPixelCtx.imageSmoothingEnabled=false;
// 글리치/색수차용 스냅샷 캔버스
const fxSnapCanvas=document.createElement('canvas');
const fxSnapCtx=fxSnapCanvas.getContext('2d');
// 글리치/색수차 색상 틴트용 임시 캔버스
const fxTintCanvas=document.createElement('canvas');
const fxTintCtx=fxTintCanvas.getContext('2d');

function resetFxRuntime(){
  activeEffectsNow=[];
  fxShakeOffset={x:0,y:0};
  fxLastTime=null;
  fxLightningAlpha=0;
  Object.keys(weatherParticles).forEach(k=>weatherParticles[k].length=0);
  if(gameCanvas) gameCanvas.style.filter='';
}

// 매 프레임 카메라 계산 시점에서 호출 — 지금 활성 이펙트 목록 + 흔들림 오프셋을 계산
function updateFxRuntime(currentTime){
  activeEffectsNow=getActiveEffects(currentTime, window.runtimeEffectEvents);
  let sx=0, sy=0;
  activeEffectsNow.forEach(fx=>{
    if(fx.type==='shake'){
      const amp=10*fx.intensity*fx.env;
      sx+=(Math.random()*2-1)*amp;
      sy+=(Math.random()*2-1)*amp;
    }
    if(fx.type==='heavyrain'){
      const amp=3*fx.intensity*fx.env;
      sx+=(Math.random()*2-1)*amp;
      sy+=(Math.random()*2-1)*amp*0.6;
    }
    if(fx.type==='snowstorm'){
      const amp=2.2*fx.intensity*fx.env;
      sx+=(Math.random()*2-1)*amp;
      sy+=(Math.random()*2-1)*amp*0.5;
    }
  });
  fxShakeOffset={x:sx,y:sy};
}

// ── 파티클 헬퍼 ──
function spawnIfNeeded(arr,targetCount,factory){
  while(arr.length<targetCount) arr.push(factory());
}
function rnd(a,b){ return a+Math.random()*(b-a); }

function updateWeatherParticles(dt,gw,gh,ct){
  activeEffectsNow.forEach(fx=>{
    const I=fx.intensity*fx.env;
    if(fx.type==='snow'){
      const arr=weatherParticles.snow;
      spawnIfNeeded(arr,Math.round(140*fx.intensity),()=>({
        x:rnd(0,gw),y:rnd(-gh,0),depth:rnd(0.35,1.5),
        sway:rnd(0,Math.PI*2),swaySpd:rnd(0.5,1.6),seed:rnd(0,200),
        rot:rnd(0,Math.PI*2),rotSpd:rnd(-1,1)
      }));
      arr.forEach(p=>{
        p.sway+=dt*0.001*p.swaySpd;
        const wind=fxWind(ct,p.seed)*34;
        p.x+=(Math.sin(p.sway)*0.5*p.depth + wind*p.depth*0.02)*dt*0.06;
        p.y+=(18+p.depth*42)*dt*0.001*Math.max(0.15,I);
        p.rot+=p.rotSpd*dt*0.001;
        if(p.y>gh+10){p.y=-10;p.x=rnd(0,gw);}
        if(p.x<-12)p.x=gw+12; else if(p.x>gw+12)p.x=-12;
      });
    } else if(fx.type==='snowstorm'){
      const arr=weatherParticles.snowstorm;
      spawnIfNeeded(arr,Math.round(240*fx.intensity),()=>({
        x:rnd(-40,gw+40),y:rnd(-40,gh+40),len:rnd(10,26),thick:rnd(1,2.4),
        seed:rnd(0,200)
      }));
      const windBase=150+90*Math.sin(ct*0.00055);
      arr.forEach(p=>{
        const gust=fxWind(ct,p.seed)*90;
        const vx=-(windBase+gust)*Math.max(0.35,I);
        const vy=(windBase*0.32+gust*0.25)*Math.max(0.35,I);
        p.x+=vx*dt*0.001;
        p.y+=vy*dt*0.001;
        if(p.x<-50){p.x=gw+50;p.y=rnd(-40,gh+40);}
        if(p.y>gh+50){p.y=-50;p.x=rnd(-50,gw+50);}
        if(p.y<-50){p.y=gh+50;}
      });
    } else if(fx.type==='rain'){
      const arr=weatherParticles.rain;
      spawnIfNeeded(arr,Math.round(150*fx.intensity),()=>({
        x:rnd(0,gw),y:rnd(-gh,0),depth:rnd(0.4,1.4),seed:rnd(0,200)
      }));
      arr.forEach(p=>{
        const wind=fxWind(ct,p.seed)*60;
        const vy=(650+p.depth*420)*Math.max(0.2,I);
        p.y+=vy*dt*0.001;
        p.x+=(wind*p.depth*0.35 - vy*0.03)*dt*0.001;
        if(p.y>gh-2){
          spawnSplash(weatherParticles.splash,p.x,gh-1,p.depth);
          p.y=-rnd(0,gh*0.3);p.x=rnd(0,gw);
        }
        if(p.x<-20)p.x=gw+20; else if(p.x>gw+20)p.x=-20;
      });
    } else if(fx.type==='heavyrain'){
      const arr=weatherParticles.heavyrain;
      spawnIfNeeded(arr,Math.round(280*fx.intensity),()=>({
        x:rnd(0,gw),y:rnd(-gh,0),depth:rnd(0.4,1.4),seed:rnd(0,200)
      }));
      arr.forEach(p=>{
        const wind=fxWind(ct,p.seed)*110;
        const vy=(1050+p.depth*500)*Math.max(0.2,I);
        p.y+=vy*dt*0.001;
        p.x+=(wind*p.depth*0.5 - vy*0.045)*dt*0.001;
        if(p.y>gh-2){
          spawnSplash(weatherParticles.splash,p.x,gh-1,p.depth*1.3);
          p.y=-rnd(0,gh*0.3);p.x=rnd(0,gw);
        }
        if(p.x<-30)p.x=gw+30; else if(p.x>gw+30)p.x=-30;
      });
      // 번개
      fxLightningAlpha=Math.max(0,fxLightningAlpha-dt*0.0025);
      if(Math.random()<0.008*I) fxLightningAlpha=rnd(0.35,0.7);
    } else if(fx.type==='sakura'){
      const arr=weatherParticles.sakura;
      spawnIfNeeded(arr,Math.round(55*fx.intensity),()=>({
        x:rnd(0,gw),y:rnd(-gh,0),r:rnd(3,7),sway:rnd(0,Math.PI*2),
        swaySpd:rnd(0.4,1.0),rot:rnd(0,Math.PI*2),rotSpd:rnd(-1.5,1.5),
        depth:rnd(0.5,1.3),seed:rnd(0,200)
      }));
      arr.forEach(p=>{
        p.sway+=dt*0.001*p.swaySpd;
        const wind=fxWind(ct,p.seed)*26;
        p.x+=(Math.sin(p.sway)*0.6+wind*0.02)*p.depth*dt*0.06;
        p.y+=(16+p.depth*24)*dt*0.001*Math.max(0.15,I);
        p.rot+=p.rotSpd*dt*0.001;
        if(p.y>gh+10){p.y=-10;p.x=rnd(0,gw);}
        if(p.x<-12)p.x=gw+12; else if(p.x>gw+12)p.x=-12;
      });
    } else if(fx.type==='confetti'){
      const arr=weatherParticles.confetti;
      const cols=['#ff5ecb','#ffd700','#00e5ff','#00ff88','#ff8800'];
      spawnIfNeeded(arr,Math.round(90*fx.intensity),()=>({
        x:rnd(0,gw),y:rnd(-gh,0),w:rnd(4,8),h:rnd(6,12),vy:rnd(60,140),
        sway:rnd(0,Math.PI*2),swaySpd:rnd(1,2.4),rot:rnd(0,Math.PI*2),rotSpd:rnd(-4,4),
        color:cols[(Math.random()*cols.length)|0]
      }));
      arr.forEach(p=>{
        p.sway+=dt*0.001*p.swaySpd;
        p.x+=Math.sin(p.sway)*1.1;
        p.y+=p.vy*dt*0.001*Math.max(0.2,I);
        p.rot+=p.rotSpd*dt*0.001;
        if(p.y>gh+10){p.y=-10;p.x=rnd(0,gw);}
      });
    } else if(fx.type==='embers'){
      const arr=weatherParticles.embers;
      spawnIfNeeded(arr,Math.round(85*fx.intensity),()=>({
        x:rnd(0,gw),y:rnd(gh*0.55,gh+20),r:rnd(1.4,3.2),
        vx:rnd(-8,8),sway:rnd(0,Math.PI*2),swaySpd:rnd(0.8,2.1),
        age:0,maxLife:rnd(1.1,2.1),trail:[],flicker:rnd(0,10)
      }));
      arr.forEach(p=>{
        p.age+=dt*0.001;
        const t=Math.min(1,p.age/p.maxLife);
        p.sway+=dt*0.001*p.swaySpd*(1+t*1.5);
        const jitter=t*10;
        p.x+=(Math.sin(p.sway)*(0.6+jitter*0.05)+p.vx*0.015)*dt*0.06;
        p.y-=(55+t*70)*dt*0.001*Math.max(0.25,I);
        p.trail.push({x:p.x,y:p.y});
        if(p.trail.length>7)p.trail.shift();
        p.life=1-t;
        if(p.life<=0||p.y<gh*0.05){
          p.age=0;p.y=gh+rnd(0,20);p.x=rnd(0,gw);p.trail.length=0;
        }
      });
    } else if(fx.type==='fog'){
      spawnIfNeeded(weatherParticles.fog,7,()=>({
        x:rnd(0,gw),y:rnd(gh*0.32,gh*1.05),r:rnd(gw*0.2,gw*0.4),
        driftX:rnd(16,32)*(Math.random()<0.5?-1:1),
        phase:rnd(0,Math.PI*2),phaseSpd:rnd(0.15,0.42),bob:rnd(6,16)
      }));
      weatherParticles.fog.forEach(p=>{
        p.phase+=dt*0.001*p.phaseSpd;
        p.x+=p.driftX*dt*0.001*Math.max(0.3,I);
        p.y+=Math.sin(p.phase)*p.bob*dt*0.001;
        if(p.driftX>0 && p.x-p.r>gw) p.x=-p.r;
        if(p.driftX<0 && p.x+p.r<0) p.x=gw+p.r;
      });
    }
  });
  // 화면 밖으로 완전히 나간 물방울 튀김은 정리
  weatherParticles.splash=weatherParticles.splash.filter(s=>s.life>0);
  weatherParticles.splash.forEach(s=>{ s.life-=dt*0.0028; s.r+=dt*0.045*s.depth; });
}
function spawnSplash(arr,x,y,depth){
  if(arr.length>140)return;
  arr.push({x,y,r:1,depth:depth||1,life:1});
}

function drawWeatherParticles(ctx,gw,gh,ct){
  const activeTypes=new Set(activeEffectsNow.filter(f=>weatherParticles[f.type]).map(f=>f.type));
  const envOf=(type)=>{ const f=activeEffectsNow.find(f=>f.type===type); return f?f.env*f.intensity:0; };

  if(activeTypes.has('fog')){
    const env=envOf('fog');
    ctx.save();ctx.globalCompositeOperation='screen';
    weatherParticles.fog.forEach(p=>{
      const pulse=0.8+0.2*Math.sin(p.phase*1.6);
      ctx.globalAlpha=0.28*env*pulse;
      const ox=Math.cos(p.phase)*10, oy=Math.sin(p.phase*0.7)*6;
      const g=ctx.createRadialGradient(p.x+ox,p.y+oy,0,p.x+ox,p.y+oy,p.r);
      g.addColorStop(0,'rgba(215,222,235,0.9)');g.addColorStop(0.6,'rgba(200,208,225,0.35)');g.addColorStop(1,'rgba(200,208,225,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x+ox,p.y+oy,p.r,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();
  }
  if(activeTypes.has('snow')){
    const env=envOf('snow');
    ctx.save();
    weatherParticles.snow.forEach(p=>{
      const r=1+p.depth*2.1;
      ctx.globalAlpha=(0.45+p.depth*0.4)*env;
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*1.8);
      g.addColorStop(0,'rgba(255,255,255,0.95)');g.addColorStop(0.5,'rgba(255,255,255,0.55)');g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,r*1.8,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=(0.7+p.depth*0.3)*env;
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(p.x,p.y,r*0.55,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();
  }
  if(activeTypes.has('snowstorm')){
    const env=envOf('snowstorm');
    ctx.save();ctx.lineCap='round';ctx.globalCompositeOperation='screen';
    weatherParticles.snowstorm.forEach(p=>{
      ctx.globalAlpha=0.55*env;
      ctx.strokeStyle='rgba(235,245,255,0.9)';
      ctx.lineWidth=p.thick;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+p.len,p.y-p.len*0.32);ctx.stroke();
    });
    ctx.restore();
    // 화이트아웃 — 강한 눈보라일수록 시야가 뿌옇게
    ctx.save();
    const a=0.22*env;
    const wo=ctx.createLinearGradient(0,0,gw,gh*0.15);
    wo.addColorStop(0,`rgba(235,245,255,${a*1.4})`);
    wo.addColorStop(0.5,`rgba(235,245,255,${a*0.5})`);
    wo.addColorStop(1,`rgba(235,245,255,${a*1.3})`);
    ctx.fillStyle=wo;ctx.fillRect(0,0,gw,gh);
    // 차가운 비네트
    const vg=ctx.createRadialGradient(gw/2,gh/2,gh*0.3,gw/2,gh/2,gh*0.85);
    vg.addColorStop(0,'rgba(180,210,255,0)');
    vg.addColorStop(1,`rgba(150,190,255,${0.35*env})`);
    ctx.fillStyle=vg;ctx.fillRect(0,0,gw,gh);
    ctx.restore();
  }
  if(activeTypes.has('sakura')){
    const env=envOf('sakura');
    ctx.save();ctx.globalAlpha=0.9*env;
    weatherParticles.sakura.forEach(p=>{
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      const g=ctx.createRadialGradient(0,0,0,0,0,p.r*1.3);
      g.addColorStop(0,'#ffd6ea');g.addColorStop(1,'#ff9ecf');
      ctx.fillStyle=g;
      ctx.beginPath();ctx.ellipse(0,0,p.r,p.r*0.58,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
    });
    ctx.restore();
  }
  if(activeTypes.has('rain')){
    const env=envOf('rain');
    ctx.save();ctx.lineCap='round';
    weatherParticles.rain.forEach(p=>{
      const len=14+p.depth*16;
      const wind=fxWind(ct,p.seed)*10*p.depth;
      const g=ctx.createLinearGradient(p.x,p.y-len,p.x,p.y);
      g.addColorStop(0,'rgba(160,200,255,0)');
      g.addColorStop(1,`rgba(180,210,255,${0.55*env*(0.5+p.depth*0.5)})`);
      ctx.strokeStyle=g;ctx.lineWidth=0.9+p.depth*0.9;
      ctx.beginPath();ctx.moveTo(p.x,p.y-len);ctx.lineTo(p.x-wind,p.y);ctx.stroke();
    });
    drawSplashes(ctx,weatherParticles.splash,env,'rgba(190,220,255,');
    ctx.restore();
  }
  if(activeTypes.has('heavyrain')){
    const env=envOf('heavyrain');
    if(fxLightningAlpha>0.01){
      ctx.save();ctx.fillStyle='#eaf2ff';ctx.globalAlpha=fxLightningAlpha*0.5;
      ctx.fillRect(0,0,gw,gh);ctx.restore();
    }
    ctx.save();ctx.lineCap='round';
    weatherParticles.heavyrain.forEach(p=>{
      const len=22+p.depth*24;
      const wind=fxWind(ct,p.seed)*20*p.depth;
      const g=ctx.createLinearGradient(p.x,p.y-len,p.x,p.y);
      g.addColorStop(0,'rgba(190,215,255,0)');
      g.addColorStop(1,`rgba(200,225,255,${0.75*env*(0.5+p.depth*0.5)})`);
      ctx.strokeStyle=g;ctx.lineWidth=1.4+p.depth*1.3;
      ctx.beginPath();ctx.moveTo(p.x,p.y-len);ctx.lineTo(p.x-wind,p.y);ctx.stroke();
    });
    drawSplashes(ctx,weatherParticles.splash,env,'rgba(200,225,255,');
    ctx.restore();
  }
  if(activeTypes.has('confetti')){
    const env=envOf('confetti');
    ctx.save();ctx.globalAlpha=0.95*env;
    weatherParticles.confetti.forEach(p=>{
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    ctx.restore();
  }
  if(activeTypes.has('embers')){
    const env=envOf('embers');
    ctx.save();ctx.globalCompositeOperation='screen';
    weatherParticles.embers.forEach(p=>{
      const a=Math.max(0,p.life)*env;
      const flick=0.75+0.25*Math.sin((performance.now()*0.02)+p.flicker);
      p.trail.forEach((t,i)=>{
        const ta=a*(i/Math.max(1,p.trail.length))*0.3;
        if(ta<=0.01)return;
        ctx.globalAlpha=ta;
        const g=ctx.createRadialGradient(t.x,t.y,0,t.x,t.y,p.r*1.5);
        g.addColorStop(0,'#ff9a44');g.addColorStop(1,'rgba(255,70,20,0)');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(t.x,t.y,p.r*1.5,0,Math.PI*2);ctx.fill();
      });
      ctx.globalAlpha=a*flick*0.95;
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3.4);
      g.addColorStop(0,'#fff4c8');g.addColorStop(0.28,'#ffcf6b');g.addColorStop(0.62,'#ff7a29');g.addColorStop(1,'rgba(255,50,10,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*3.4,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=a*flick;
      ctx.fillStyle='#fff8e6';
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*0.5,0,Math.PI*2);ctx.fill();
    });
    ctx.restore();
  }
}
function drawSplashes(ctx,arr,env,rgbaPrefix){
  arr.forEach(s=>{
    if(s.life<=0)return;
    ctx.save();
    ctx.globalAlpha=Math.max(0,s.life)*0.6*env;
    ctx.strokeStyle=rgbaPrefix+'0.8)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(s.x,s.y,s.r*1.6,s.r*0.5,0,Math.PI,Math.PI*2);ctx.stroke();
