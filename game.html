    async function getResultSongInfo(songParam, diffParam) {
        const fallbackSong = songParam ? decodeURIComponent(songParam) : "UNKNOWN SONG";
        const fallbackDiff = diffParam ? diffParam.replace(/\.json$/i, '').split('_')[0].toUpperCase() : "UNKNOWN";
        const fallbackLevel = new URLSearchParams(window.location.search).get('level') || "?";

        try {
            const res = await fetch('song_list.json');
            if (!res.ok) throw new Error('song_list.json not found');
            const songs = await res.json();
            const song = songs.find(s => s.folder === songParam || decodeURIComponent(s.folder) === decodeURIComponent(songParam || ''));
            const diffFile = diffParam && diffParam.endsWith('.json') ? diffParam : `${diffParam}.json`;
            const chart = song && song.charts
                ? song.charts.find(c => c.file === diffFile || c.file.replace(/\.json$/i, '') === diffParam)
                : null;

            return {
                title: song?.title || fallbackSong,
                diffName: chart?.name || fallbackDiff,
                level: chart?.level ?? fallbackLevel
            };
        } catch(e) {
            console.warn("Result song info fallback:", e);
            return { title: fallbackSong, diffName: fallbackDiff, level: fallbackLevel };
        }
    }

    // ============================================================
    // 결과 화면
    // ============================================================
    async function showResult() {
        try {
            const currentTime  = Date.now();
            const playDuration = currentTime - gameStartTimeLocal;
            const minPlayTime  = lastNoteEndTime * 0.5;

            if (playDuration < minPlayTime && !isFever) {
                console.warn(`🚨 Security Alert: Play time too short.`);
                alert("비정상적인 플레이가 감지되었습니다. (Time Logic)");
                location.href = 'index.html'; return;
            }

            const pureScore = Math.floor(score);
            // 세분화된 8단계 판정 기준으로 재계산
            const calcScore = Math.floor(
                (judgeStats.perfectEx * scorePerHit * 1.0) +
                (judgeStats.perfect   * scorePerHit * 0.96) +
                (judgeStats.great     * scorePerHit * 0.88) +
                (judgeStats.good      * scorePerHit * 0.70) +
                (judgeStats.notBad    * scorePerHit * 0.45) +
                (judgeStats.save      * scorePerHit * 0.20) +
                (judgeStats.oh        * scorePerHit * 0.05)
            );

            if (Math.abs(pureScore - calcScore) > 1000) {
                console.warn(`🚨 Security Alert: Score mismatch. Real: ${calcScore}, memory: ${pureScore}`);
                alert("데이터 무결성 오류가 발생했습니다. (점수 불일치)");
                location.href = 'index.html'; return;
            }

            const SECRET_SALT     = "WebBeat_Secure_Key_2026_Ver42";
            const secureScore     = Math.floor(score);
            const secureMaxCombo  = Math.floor(maxCombo || 0);
            const secureUserId    = userProfile ? (userProfile.sub || userProfile.id) : "GUEST_" + Math.random().toString(36).substring(2, 9);
            const secureUserName  = userProfile ? userProfile.name : "GUEST";
            const securePlayTime  = Math.floor(playDuration || 0);
            const rawSignature    = `${secureUserId}_${secureScore}_${secureMaxCombo}_${SECRET_SALT}`;
            const signatureToken  = btoa(unescape(encodeURIComponent(rawSignature)));

            const SERVER_BASE = SERVER_URL.replace('/api/score', '');
            finishEffect.innerHTML = "";

            let finalRate = 0;
            if(totalHits > 0) finalRate = (totalRateSum / (totalHits * 100)) * 100;

            let gainedXp = Math.floor(secureScore / 5000);
            if (combo === totalMaxHits && totalMaxHits > 0) gainedXp += 50;

            let currentLv  = parseInt(localStorage.getItem('wb_user_lv') || "1");
            let currentXp  = parseInt(localStorage.getItem('wb_user_xp') || "0");
            currentXp     += gainedXp;
            let requiredXp = currentLv * 500;
            while (currentXp >= requiredXp) { currentXp -= requiredXp; currentLv++; requiredXp = currentLv * 500; }
            localStorage.setItem('wb_user_lv', currentLv);
            localStorage.setItem('wb_user_xp', currentXp);

            let rank = "", gradeColor = "", glowEffect = "";
            if (secureScore <= 0) {
                rank = "—"; gradeColor = "#444"; glowEffect = "none";
            } else if (secureScore < 600000) {
                rank = "FAILED"; gradeColor = "#ff4455"; glowEffect = "0 0 40px #ff4455";
            } else {
                const thresholds = [
                    { min: 1000000, grade: 'TB', hex: '#ffffff' },
                    { min: 950000,  grade: 'S+', hex: '#00ffff' },
                    { min: 900000,  grade: 'S',  hex: '#00e5ff' },
                    { min: 850000,  grade: 'A+', hex: '#00ff88' },
                    { min: 800000,  grade: 'A',  hex: '#00cc66' },
                    { min: 700000,  grade: 'B',  hex: '#3b9eff' },
                    { min: 600000,  grade: 'C',  hex: '#ffc832' }
                ];
                const gradeInfo = thresholds.find(t => secureScore >= t.min) || thresholds[thresholds.length - 1];
                rank        = gradeInfo.grade;
                gradeColor  = gradeInfo.hex;
                glowEffect  = `0 0 40px ${gradeInfo.hex}`;
            }

            const finalScoreStr = secureScore.toString().padStart(6, '0');
            const rankClass = rank === 'TB' ? 'rank-tb'
                : rank === 'S+' ? 'rank-sp'
                : rank === 'S' ? 'rank-s'
                : rank === 'A+' ? 'rank-ap'
                : rank === 'A' ? 'rank-a'
                : rank === 'B' ? 'rank-b'
                : rank === 'C' ? 'rank-c'
                : rank === 'FAILED' ? 'rank-failed'
                : '';
            const urlParams     = new URLSearchParams(window.location.search);
            const songParam     = urlParams.get('song');
            const diffParam     = urlParams.get('diff');

            const resultSongInfo = await getResultSongInfo(songParam, diffParam);

            if (songParam && diffParam) {
                const scoreKey  = `wb_score_${songParam}_${diffParam}`;
                const badgeKey  = `wb_badge_${songParam}_${diffParam}`;
                const savedScore = parseInt(localStorage.getItem(scoreKey) || "0");
                if (secureScore > savedScore) localStorage.setItem(scoreKey, secureScore.toString().padStart(6, '0'));
                if (judgeStats.perfectEx === totalMaxHits && totalMaxHits > 0) localStorage.setItem(badgeKey, "TB");
                else if (combo === totalMaxHits && totalMaxHits > 0) {
                    if (localStorage.getItem(badgeKey) !== "TB") localStorage.setItem(badgeKey, "FC");
                }
            }

            if (songParam && diffParam && userProfile) {
                try {
                    const response = await fetch(`${SERVER_BASE}/api/score`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            userId: secureUserId, userName: secureUserName,
                            song: songParam, diff: diffParam,
                            score: secureScore, maxCombo: secureMaxCombo,
                            level: currentLv, signature: signatureToken,
                            playTime: securePlayTime, details: judgeStats
                        })
                    });
                    const resData = await response.json();
                    if (!response.ok || !resData.success) throw new Error(resData.error || "Server Validation Failed");
                    console.log("✅ 서버 검증 및 랭킹 등록 성공!");
                    await fetch(`${SERVER_BASE}/api/user/update`, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ userId: secureUserId, level: currentLv, xp: currentXp })
                    });
                } catch (err) {
                    console.error("🚨 서버 전송 중 에러:", err);
                    alert("점수 검증 에러: " + err.message);
                }
            }

            let rankingHtml = "<div style='color:#888; margin-top:10px;'>LOADING RANKING...</div>";
            try {
                const res      = await fetch(`${SERVER_BASE}/api/ranking/${songParam}/${diffParam}`);
                const rankData = await res.json();
                if(rankData.length > 0) {
                    rankingHtml = `<div style="margin-top:20px; width:100%; max-width:400px; border:1px solid #444; border-radius:10px; padding:10px; background:rgba(0,0,0,0.5);"><div style="color:#00e5ff; font-weight:bold; margin-bottom:10px;">🏆 TOP 5 PLAYERS</div>`;
                    rankData.slice(0, 5).forEach((r, idx) => {
                        const medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `#${idx+1}`;
                        const isMe  = userProfile && r.userId === secureUserId ? "color:#ffd700;" : "color:#fff;";
                        rankingHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:14px; ${isMe}"><span>${medal} ${r.userName}</span><span>${r.score}</span></div>`;
                    });
                    rankingHtml += `</div>`;
                } else { rankingHtml = "<div style='color:#666; margin-top:20px;'>BE THE FIRST CHALLENGER!</div>"; }
            } catch(e) { console.warn("Ranking Load Fail", e); }

            let badgeHtml = "";
            if (judgeStats.perfectEx === totalMaxHits && totalMaxHits > 0) badgeHtml = "<div class='res-badge badge-ap'>TROLL BEAT!</div>";
            else if (combo === totalMaxHits && totalMaxHits > 0) badgeHtml = "<div class='res-badge badge-fc'>FULL COMBO</div>";

            const songName = resultSongInfo.title;
            const diffName = resultSongInfo.diffName;
            const levelName = resultSongInfo.level;

            // ★ 판정 상세: 8단계
            resultOverlay.classList.remove('result-show');
            resultOverlay.innerHTML = `
                <div class="result-panel">
                    <div class="result-topline">RESULT ANALYSIS</div>
                    <div class="result-head">
                        <div class="result-title">
                            <div class="res-song-title">${songName}</div>
                            <div class="res-diff-name">${diffName} Lv.${levelName}</div>
                        </div>
                        <div class="result-rank-wrap">
                            <div class="res-rank ${rankClass}" style="color:${gradeColor}; text-shadow:${glowEffect};">${rank}</div>
                        </div>
                    </div>
                ${badgeHtml}
                <div class="res-info">
                    <div class="res-box"><div class="res-label">SCORE</div><div class="res-val primary-score" id="result-score-value">000000</div></div>
                    <div class="res-box"><div class="res-label">RATE</div><div class="res-val" id="result-rate-value">0.00%</div></div>
                    <div class="res-box"><div class="res-label">MAX COMBO</div><div class="res-val">${secureMaxCombo}</div></div>
                </div>
                <div class="result-detail-grid">
                    <div class="detail-item"><div class="detail-label" style="color:#fff;background:linear-gradient(90deg,#ff0080,#00e5ff,#88ff00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Perfect!</div><div class="detail-val">${judgeStats.perfectEx}</div></div>
                    <div class="detail-item"><div class="detail-label" style="color:#FFE000;">Perfect</div><div class="detail-val">${judgeStats.perfect}</div></div>
                    <div class="detail-item"><div class="detail-label" style="color:#00F2FF;">Great</div><div class="detail-val">${judgeStats.great}</div></div>
                    <div class="detail-item"><div class="detail-label" style="color:#88FF00;">Good</div><div class="detail-val">${judgeStats.good}</div></div>
                    <div class="detail-item"><div class="detail-label" style="color:#FFB300;">Not Bad</div><div class="detail-val">${judgeStats.notBad}</div></div>
                    <div class="detail-item"><div class="detail-label" style="color:#FF7733;">Save</div><div class="detail-val">${judgeStats.save}</div></div>
                    <div class="detail-item"><div class="detail-label" style="color:#FF2D78;">Oh...</div><div class="detail-val">${judgeStats.oh}</div></div>
                    <div class="detail-item"><div class="detail-label" style="color:#555566;">No...</div><div class="detail-val">${judgeStats.miss}</div></div>
                </div>
                <div class="result-ranking">${rankingHtml}</div>
                <div id="google-login-btn-result" style="margin-top:15px; display:flex; justify-content:center; min-height:40px;"></div>
                <div class="result-actions"><button class="btn-common" onclick="location.href='select.html'">CONTINUE</button></div>
                </div>
            `;

            resultOverlay.style.display = 'flex';
            void resultOverlay.offsetWidth;
            resultOverlay.classList.add('result-show');
            startResultCountUp(secureScore, finalRate);

            if (!userProfile && typeof google !== 'undefined') {
                google.accounts.id.renderButton(
                    document.getElementById("google-login-btn-result"),
                    { theme: "filled_black", size: "large", shape: "pill" }
                );
            }
        } catch(e) {
            alert("Result Error: " + e.message);
            location.href = 'index.html';
        }
    }

    async function sha256(message) {
        const msgBuffer  = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray  = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ★ 외부 노출
    window.startGame               = startGame;
    window.togglePause             = togglePause;
    window.handleCredentialResponse = handleCredentialResponse;

    })();
    </script>
</body>
</html>
