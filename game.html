}

// 색조 틴트된 이미지를 만들어 지정 offset 만큼 이동시켜 그려주는 헬퍼 (색수차/글리치용)
function drawTintedShift(ctx,srcCanvas,gw,gh,dx,dy,color,alpha,composite){
  fxTintCanvas.width=gw; fxTintCanvas.height=gh;
  fxTintCtx.clearRect(0,0,gw,gh);
  fxTintCtx.drawImage(srcCanvas,0,0,gw,gh);
  fxTintCtx.globalCompositeOperation='source-atop';
  fxTintCtx.fillStyle=color;
  fxTintCtx.fillRect(0,0,gw,gh);
  fxTintCtx.globalCompositeOperation='source-over';
  ctx.save();
  ctx.globalCompositeOperation=composite||'screen';
  ctx.globalAlpha=alpha;
  ctx.drawImage(fxTintCanvas,dx,dy,gw,gh);
  ctx.restore();
}

function applyChromaShift(ctx,gw,gh,strengthPx,alpha){
  fxSnapCanvas.width=gw; fxSnapCanvas.height=gh;
  fxSnapCtx.clearRect(0,0,gw,gh);
  fxSnapCtx.drawImage(ctx.canvas,0,0,gw,gh);
  drawTintedShift(ctx,fxSnapCanvas,gw,gh,-strengthPx,0,'#ff2255',alpha,'screen');
  drawTintedShift(ctx,fxSnapCanvas,gw,gh, strengthPx,0,'#22e0ff',alpha,'screen');
}

function applyGlitchDistort(ctx,gw,gh,intensity,env){
  if(intensity*env<=0.01)return;
  fxSnapCanvas.width=gw; fxSnapCanvas.height=gh;
  fxSnapCtx.clearRect(0,0,gw,gh);
  fxSnapCtx.drawImage(ctx.canvas,0,0,gw,gh);
  ctx.save();ctx.globalCompositeOperation='copy';
  ctx.drawImage(fxSnapCanvas,0,0,gw,gh);
  ctx.restore();
  const bands=Math.round(3+intensity*10);
  ctx.save();
  for(let i=0;i<bands;i++){
    if(Math.random()>0.55*Math.max(0.2,intensity))continue;
    const bandH=rnd(4,gh*0.05*Math.max(0.3,intensity));
    const y=rnd(0,gh-bandH);
    const shift=rnd(-1,1)*40*intensity*env;
    ctx.drawImage(fxSnapCanvas,0,y,gw,bandH, shift,y,gw,bandH);
  }
  ctx.restore();
  applyChromaShift(ctx,gw,gh,4*intensity*env,0.35*env);
}

function applyPixelate(ctx,gw,gh,intensity,env){
  const blockAmt=Math.max(0.02,intensity*env);
  const pw=Math.max(4,Math.round(gw*(1-blockAmt*0.94)/8));
  const ph=Math.max(3,Math.round(gh*(1-blockAmt*0.94)/8));
  fxPixelCanvas.width=pw; fxPixelCanvas.height=ph;
  fxPixelCtx.imageSmoothingEnabled=false;
  fxPixelCtx.drawImage(ctx.canvas,0,0,gw,gh,0,0,pw,ph);
  ctx.save();
  ctx.imageSmoothingEnabled=false;
  ctx.globalCompositeOperation='copy';
  ctx.drawImage(fxPixelCanvas,0,0,pw,ph,0,0,gw,gh);
  ctx.restore();
  ctx.imageSmoothingEnabled=true;
}

// 카메라 트랜스폼이 끝난 뒤(화면 고정 좌표계)에 호출 — 왜곡·오버레이·날씨·필터를 모두 적용
function renderScreenEffects(ctx,gw,gh,ct){
  const now=performance.now();
  let dt=fxLastTime==null?16:(now-fxLastTime);
  if(dt<0||dt>200)dt=16;
  fxLastTime=now;

  if(!activeEffectsNow.length){
    if(gameCanvas.style.filter) gameCanvas.style.filter='';
    return;
  }

  updateWeatherParticles(dt,gw,gh,ct);

  // ── 픽셀화 / 글리치 (캔버스 픽셀 조작, 다른 오버레이보다 먼저 적용) ──
  activeEffectsNow.forEach(fx=>{
    if(fx.type==='pixel8') applyPixelate(ctx,gw,gh,fx.intensity,fx.env);
  });
  activeEffectsNow.forEach(fx=>{
    if(fx.type==='glitch') applyGlitchDistort(ctx,gw,gh,fx.intensity,fx.env);
    else if(fx.type==='chromatic') applyChromaShift(ctx,gw,gh,6*fx.intensity*fx.env,0.45*fx.env);
  });

  // ── 날씨 파티클 ──
  drawWeatherParticles(ctx,gw,gh,ct);

  // ── 스캔라인 (CRT, 위아래로 흐르는 롤링 밴드 + 미세 색수차 + 깜빡임) ──
  const scan=activeEffectsNow.find(f=>f.type==='scanline');
  if(scan){
    const I=scan.intensity*scan.env;
    ctx.save();
    const gap=Math.max(2,Math.round(5-I*2));
    const roll=(ct*0.045*Math.max(0.35,I))%gap;
    const flicker=0.85+0.15*Math.sin(ct*0.03)+(Math.random()-0.5)*0.08;
    ctx.globalCompositeOperation='multiply';
    ctx.globalAlpha=Math.min(1,0.32*I*flicker);
    ctx.fillStyle='#111';
    for(let y=-gap;y<gh+gap;y+=gap) ctx.fillRect(0,y+roll,gw,Math.max(1,gap*0.4));
    ctx.globalCompositeOperation='screen';
    ctx.globalAlpha=0.09*I;
    ctx.fillStyle='#ff3355';
    for(let y=-gap*2;y<gh+gap*2;y+=gap*2) ctx.fillRect(0,y+roll-1,gw,1);
    ctx.fillStyle='#33e0ff';
    for(let y=-gap*2;y<gh+gap*2;y+=gap*2) ctx.fillRect(0,y+roll+1,gw,1);
    // 위에서 아래로 천천히 흘러가는 밝은 롤링 밴드 — 옛날 CRT 특유의 화면 흔들림
    const barY=((ct*0.075*Math.max(0.4,I))%(gh+160))-80;
    const bar=ctx.createLinearGradient(0,barY-50,0,barY+50);
    bar.addColorStop(0,'rgba(255,255,255,0)');
    bar.addColorStop(0.5,`rgba(255,255,255,${0.14*I})`);
    bar.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=bar;ctx.fillRect(0,barY-50,gw,100);
    ctx.restore();
  }
  // ── 노이즈 / 지지직 (가로 줄무늬 정전기 + 블록 튐 + 밝기 플리커) ──
  const noise=activeEffectsNow.find(f=>f.type==='noise');
  if(noise){
    const I=noise.intensity*noise.env;
    ctx.save();
    // 밝기 전체 플리커 (지지직 거리는 화면 느낌)
    if(Math.random()<0.15*I){
      ctx.globalCompositeOperation='screen';
      ctx.globalAlpha=0.12*I;
      ctx.fillStyle='#fff';
      ctx.fillRect(0,0,gw,gh);
    }
    // 정전기 도트 (가로로 살짝 늘어난 형태로 더 "노이즈"스럽게)
    ctx.globalCompositeOperation='screen';
    const dotN=Math.round(500*I);
    for(let i=0;i<dotN;i++){
      ctx.globalAlpha=Math.random()*0.55*I;
      ctx.fillStyle=Math.random()<0.5?'#fff':'#8899aa';
      ctx.fillRect(Math.random()*gw,Math.random()*gh,rnd(1,3),1);
    }
    // 가끔 한두 줄 블록이 옆으로 튀는 지지직 라인
    const glitchLines=Math.round(2*I);
    for(let i=0;i<glitchLines;i++){
      if(Math.random()>0.5)continue;
      const y=Math.random()*gh, h=rnd(2,8), shift=rnd(-14,14)*I;
      ctx.globalAlpha=0.35*I;
      ctx.drawImage(ctx.canvas,0,y,gw,h,shift,y,gw,h);
    }
    ctx.restore();
  }
  // ── 비네트 ──
  const vig=activeEffectsNow.find(f=>f.type==='vignette');
  if(vig){
    ctx.save();
    const g=ctx.createRadialGradient(gw/2,gh/2,gh*0.35,gw/2,gh/2,gh*0.85);
    g.addColorStop(0,'rgba(0,0,0,0)');
    g.addColorStop(1,`rgba(10,0,20,${0.75*vig.intensity*vig.env})`);
    ctx.fillStyle=g;ctx.fillRect(0,0,gw,gh);
    ctx.restore();
  }
  // ── 화이트 플래시 (초반에 확 밝았다가 감쇠) ──
  const fw=activeEffectsNow.find(f=>f.type==='flashwhite');
  if(fw){
    const decay=Math.max(0,1-fw.progress);
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='#ffffff';ctx.globalAlpha=decay*fw.intensity;
    ctx.fillRect(0,0,gw,gh);
    ctx.restore();
  }
  // ── 블랙아웃 ──
  const fb=activeEffectsNow.find(f=>f.type==='flashblack');
  if(fb){
    const decay=Math.max(0,1-fb.progress);
    ctx.save();ctx.fillStyle='#000000';ctx.globalAlpha=decay*fb.intensity*0.95;
    ctx.fillRect(0,0,gw,gh);
    ctx.restore();
  }

  // ── CSS filter 계열 (흑백/반전/세피아/무지개/고대비/블러) — 캔버스 전체에 합성 ──
  const parts=[];
  const gs=activeEffectsNow.find(f=>f.type==='grayscale');
  if(gs) parts.push(`grayscale(${Math.round(gs.intensity*gs.env*100)}%)`);
  const inv=activeEffectsNow.find(f=>f.type==='invert');
  if(inv) parts.push(`invert(${Math.round(inv.intensity*inv.env*100)}%)`);
  const sep=activeEffectsNow.find(f=>f.type==='sepia');
  if(sep) parts.push(`sepia(${Math.round(sep.intensity*sep.env*100)}%)`);
  const hc=activeEffectsNow.find(f=>f.type==='highcontrast');
  if(hc) parts.push(`contrast(${Math.round(100+hc.intensity*hc.env*150)}%) saturate(${Math.round(100+hc.intensity*hc.env*80)}%)`);
  const bl=activeEffectsNow.find(f=>f.type==='blur');
  if(bl) parts.push(`blur(${(bl.intensity*bl.env*8).toFixed(1)}px)`);
  const rb=activeEffectsNow.find(f=>f.type==='rainbow');
  if(rb){
    const hue=(ct*0.25*rb.intensity)%360;
    parts.push(`hue-rotate(${hue.toFixed(0)}deg) saturate(${Math.round(100+rb.intensity*rb.env*120)}%)`);
  }
  gameCanvas.style.filter=parts.length?parts.join(' '):'';
}

    const DEFAULT_CURVE = [{x:0,y:0},{x:1,y:1}];
    function clamp01(v){return v<0?0:v>1?1:v;}
    function catmull(p0,p1,p2,p3,t){
      const t2=t*t,t3=t2*t;
      return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3);
    }
    function evalCurve(pts,t){
      if(!pts||pts.length<2) return t;
      const p=[...pts].sort((a,b)=>a.x-b.x);
      t=clamp01(t);
      if(t<=p[0].x) return clamp01(p[0].y);
      if(t>=p[p.length-1].x) return clamp01(p[p.length-1].y);
      let i=0; while(i<p.length-1 && p[i+1].x<t) i++;
      const a=p[i-1]||p[i], b=p[i], c=p[i+1], d=p[i+2]||p[i+1];
      const seg=c.x-b.x; const lt=seg<=0?0:(t-b.x)/seg;
      return clamp01(catmull(a.y,b.y,c.y,d.y,lt));
    }
    // 속도 곡선: 곡선의 면적(=이동량)을 적분해 진행도로 변환 (에디터와 동일)
    function evalSpeedCurve(pts,t){
      if(!pts||pts.length<2) return t;
      t=clamp01(t);
      const STEPS=120; let total=0, partial=0;
      for(let i=0;i<STEPS;i++){
        const ta=i/STEPS, tb=(i+1)/STEPS;
        const vm=Math.max(0,evalCurve(pts,(ta+tb)/2));
        const dw=(tb-ta)*vm; total+=dw;
        if(tb<=t) partial+=dw;
        else if(ta<t) partial+=(t-ta)*vm;
      }
      if(total<=0) return t;
      return clamp01(partial/total);
    }
    function applyEasing(t,type,kf){
      switch(type){
        case 'step': return t>=1?1:0;
        case 'ease-in': return t*t*t;
        case 'ease-out': return 1-Math.pow(1-t,3);
        case 'ease-inout': return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
        case 'circ': return t<0.5
          ? (1-Math.sqrt(1-Math.pow(2*t,2)))/2
          : (Math.sqrt(1-Math.pow(-2*t+2,2))+1)/2;
        case 'custom': return evalSpeedCurve((kf&&kf.curve)?kf.curve:DEFAULT_CURVE, t);
        default: return t;
      }
    }
    // 누적 이동 방식(~만큼) + 절대 위치 이동(~로) 모두 지원 (에디터와 동일)
    function getLineState(lane,chartMs){
      const def=DEFAULT_LINE[lane];
      const events=lineEvents[lane];
      let baseX=def.x, baseY=def.y, baseAngle=def.angle;
      let resultX=baseX, resultY=baseY, resultAngle=baseAngle;
      if(!events||events.length===0) return {x:resultX,y:resultY,angle:resultAngle};
      for(let i=0;i<events.length;i++){
        const ev=events[i];
        const startT=evTimeMs(ev);
        if(chartMs<startT) break;
        let t=(chartMs-startT)/Math.max(1,ev.duration);
        if(t>1)t=1;
        const et=applyEasing(t,ev.easing,ev);
        let curX,curY,curAngle;
        if(ev.moveType==='absolute'){
          curX=baseX+(ev.x-baseX)*et; curY=baseY+(ev.y-baseY)*et; curAngle=baseAngle+(ev.angle-baseAngle)*et;
        }else{
          curX=baseX+ev.x*et; curY=baseY+ev.y*et; curAngle=baseAngle+ev.angle*et;
        }
        resultX=curX; resultY=curY; resultAngle=curAngle;
        if(t>=1){ baseX=curX; baseY=curY; baseAngle=curAngle; }
      }
      return {x:resultX,y:resultY,angle:resultAngle};
    }
    function getPulseMagnitude(lane,chartMs){
      const events=pulseEvents[lane];
      if(!events||!events.length) return 0;
      let p=null;
      for(let i=events.length-1;i>=0;i--){
        if(evTimeMs(events[i])<=chartMs){p=events[i];break;}
      }
      if(!p||p.type==='stop') return 0;
      const beatLen=60000/bpm;
      const phase=(chartMs-evTimeMs(p))%beatLen;
      const d=p.decay;
      if(phase>d) return 0;
      const u=phase/d;
      let env;
      if(u<0.12){ env=u/0.12; }
      else{ const k=(u-0.12)/0.88; env=Math.pow(1-k,2); }
      return p.intensity*env;
    }
    function hexA(hex,a){

    }

            x: screen.x,
            y: screen.y,
            angle: Math.atan2(next.y - screen.y, next.x - screen.x) * 180 / Math.PI,

    // ============================================================
    // Firefly
    // ============================================================
    class Firefly {
        constructor() {
            this.x = Math.random() * bgCanvas.width;
            this.y = Math.random() * bgCanvas.height;
            this.vx = (Math.random() - 0.5) * 0.28;
            this.vy = (Math.random() - 0.5) * 0.28;
            this.size = Math.random() * 2.2 + 1.0;
            this.baseAlpha = Math.random() * 0.24 + 0.14;
            this.phase = Math.random() * Math.PI * 2;
            this.color = combo >= FEVER_LV3 ? '#78ffb4' : '#ffd652';
            this.scattering = false;
        }
        update() {
            if(this.scattering) {
                this.x += this.vx * 10;
                this.y += this.vy * 10;
                this.baseAlpha -= 0.05;
            } else {
                this.x += this.vx;
                this.y += this.vy;
                this.phase += 0.05;
                if (this.x < 0) this.x = bgCanvas.width;
                if (this.x > bgCanvas.width) this.x = 0;
                if (this.y < 0) this.y = bgCanvas.height;
                if (this.y > bgCanvas.height) this.y = 0;
            }
        }
        draw(ctx) {
            if (this.baseAlpha <= 0) return;
            const alpha = Math.max(0, this.baseAlpha + (this.scattering ? 0 : Math.sin(this.phase) * 0.08));
            ctx.globalAlpha = alpha;
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 7;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        }
    }

    audio.onended = () => {
        if (!gameFinished && !isPaused) finishGame();
    };

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function fadeAudioElement(el, targetVolume, duration = 1000, pauseAtZero = false) {
        return new Promise(resolve => {
            const startVolume = el.volume;
            const startTime = performance.now();
            function step(now) {
                const t = Math.min(1, (now - startTime) / duration);
                el.volume = startVolume + (targetVolume - startVolume) * t;
                if (t < 1) {
                    requestAnimationFrame(step);
                } else {
                    el.volume = targetVolume;
                    if (pauseAtZero && targetVolume <= 0) el.pause();
                    resolve();
                }
            }
            requestAnimationFrame(step);
        });
    }

    function scheduleResultBgmFadeOut() {
        if (resultBgmFadeTimer) clearTimeout(resultBgmFadeTimer);
        resultBgmFadeTimer = setTimeout(() => {
            fadeAudioElement(resultBgm, 0, 8000, true);
            resultBgmFadeTimer = null;
        }, 30000);
    }

    async function playResultBgm(isClear) {
        const targetVolume = parseFloat(localStorage.getItem('wb_bgm_volume') || localStorage.getItem('wb_music_volume') || "0.65");
        const primarySrc = isClear ? 'BGM/result.mp3' : 'BGM/result_failed.mp3';
        const fallbackSrc = 'BGM/result.mp3';
        try {
            if (resultBgmFadeTimer) clearTimeout(resultBgmFadeTimer);
            resultBgm.pause();
            resultBgm.src = primarySrc;
            resultBgm.currentTime = 0;
            resultBgm.volume = 0;
            await resultBgm.play();
            await fadeAudioElement(resultBgm, Math.min(1, targetVolume), 1800);
            scheduleResultBgmFadeOut();
        } catch(e) {
            if (!isClear) {
                try {
                    if (resultBgmFadeTimer) clearTimeout(resultBgmFadeTimer);
                    resultBgm.pause();
                    resultBgm.src = fallbackSrc;
                    resultBgm.currentTime = 0;
                    resultBgm.volume = 0;
                    await resultBgm.play();
                    await fadeAudioElement(resultBgm, Math.min(1, targetVolume), 1800);
                    scheduleResultBgmFadeOut();
                    return;
                } catch(fallbackError) {
                    console.warn("Result BGM fallback unavailable:", fallbackError);
                }
            }
            console.warn("Result BGM unavailable:", e);
        }
    }

    async function loadGameData(song, diff) {
        const startBtn  = document.getElementById('btn-start-auto');
        try {
            logStatus("LOADING CHART...");
            const chartRes = await fetch(`Maps/${song}/${diff}.json`);
            if(!chartRes.ok) throw new Error(`Chart Not Found`);
            const chartData = await chartRes.json();
            parseChartData(chartData);

            // ★ 곡 이미지 배경 (songs/{folder}/image.png, 전체화면 블러)
            bgaImage.onload  = () => { bgaImage.style.display = 'block'; };
            bgaImage.onerror = () => { bgaImage.style.display = 'none'; };
            bgaImage.src = `songs/${song}/image.png`;

            logStatus("LOADING AUDIO...");
            const audioPath = `Maps/${song}/audio.mp3`;

            // ★ 로딩 완료 전까지 버튼 숨김, READY 후 표시
            const checkAudioReady = () => {
                if (audio.readyState >= 3) {
                    logStatus("▶ PRESS START");
                    document.getElementById('loading-msg').style.animation = 'none';
                    document.getElementById('loading-msg').style.color = '#00ff88';
                    startBtn.style.display = 'block';
                    return true;
                }
                return false;
            };

            audio.oncanplaythrough = checkAudioReady;
            audio.onloadeddata     = checkAudioReady;
            audio.src = audioPath;
            audio.load();

            const forceCheck = setInterval(() => { if (checkAudioReady()) clearInterval(forceCheck); }, 100);

        } catch (err) {
            alert(`오류 발생: ${err.message}`);
            window.location.href = "index.html";
        }
    }

    function parseChartData(data) {
        if(data.bpm)       bpm      = data.bpm;
        if(data.offset)    offset  += (data.offset || 0);
        if(data.beat)      beatNum  = data.beat;
        if(data.beatDenom) beatDenom = data.beatDenom;

        gameNotes = []; totalMaxHits = 0;
        if(data.speedEvents) {
            speedEvents = data.speedEvents;
            if (!speedEvents.some(e => e.time === 0)) speedEvents.push({ time: 0, mult: 1.0 });
        } else {
            speedEvents = [{ time: 0, mult: 1.0 }];
        }

        msgEvents = [];
        if(data.msgEvents) msgEvents = data.msgEvents;

        // ★ 라인 안무 / 펄스 기믹 로딩 (에디터 export 포맷)
        const padToLaneCount = (arr) => {
            const a = (arr||[]).map(e=>e);
            while(a.length<LANE_COUNT) a.push([]);
            return a.slice(0,LANE_COUNT);
        };
        lineEvents   = padToLaneCount(data.lineEvents  ? data.lineEvents.map(arr=>arr.map(e=>({...e})))  : []);
        pulseEvents  = padToLaneCount(data.pulseEvents ? data.pulseEvents.map(arr=>arr.map(e=>({...e}))) : []);
        activeEvents = padToLaneCount(data.activeEvents ? data.activeEvents.map(arr=>arr.map(e=>({...e}))) : []);

        // ★ 곡 시작 시 기본으로 켜져있는 라인 + 가운데 정렬 배치 (에디터의 "초기 키 개수" 설정과 동일)
        if(data.initKeyCount){
            applyInitialKeyLayout(data.initKeyCount);
        }

        // ★ 카메라(이동/회전/반전/줌) 로딩
        cameraEvents   = data.cameraEvents   ? data.cameraEvents.map(e=>({...e}))   : [];
        camFlipXEvents = data.camFlipXEvents ? data.camFlipXEvents.map(e=>({...e})) : [];
        camFlipYEvents = data.camFlipYEvents ? data.camFlipYEvents.map(e=>({...e})) : [];
        camZoomEvents  = data.camZoomEvents  ? data.camZoomEvents.map(e=>({...e}))  : [];
        effectEvents   = data.effectEvents   ? data.effectEvents.map(e=>({...e}))   : [];

        // ★ 차트에 저장된 키 배치가 있고, 플레이어가 직접 키 설정을 바꾼 적이 없다면 그걸 기본값으로 사용
        if(data.keyMap && Array.isArray(data.keyMap) && !localStorage.getItem('wb_key_layout')){
            KEY_MAP = normalizeKeyMapData(data.keyMap);
        }

        // ★ 구버전(7라인 시스템 이전) 채보 호환: 그 시절 lane 0~3은 D,F,J,K를 의미했는데,
        // 지금 인덱스 체계(S,D,F,SPACE,J,K,L)에서 D,F,J,K는 1,2,4,5번이라 그대로 리맵해줘야 함.
        // 새 에디터로 만든 채보는 항상 lineEvents/activeEvents/keyMap/initKeyCount 중 하나는 들어있으므로 그걸로 구분.
        const isLegacyChart = !('lineEvents' in data) && !('activeEvents' in data) && !('keyMap' in data) && !('initKeyCount' in data);
        const LEGACY_LANE_REMAP = { 0:1, 1:2, 2:4, 3:5 };

        if(data.measures) {
            const msPerMeasure = (60000 / bpm) * (4 / beatDenom) * beatNum;
            data.measures.forEach(m => {
                const ratio = BASE_RES / (m.split || 32);
                m.notes.forEach(n => {
                    const time     = (m.index + (n.pos * ratio / BASE_RES)) * msPerMeasure;
                    const duration = ((n.len || 0) * ratio / BASE_RES) * msPerMeasure;
                    const noteTime    = time + offset;
                    const noteEndTime = noteTime + duration;
                    if (noteEndTime > lastNoteEndTime) lastNoteEndTime = noteEndTime;
                    const lane = (isLegacyChart && LEGACY_LANE_REMAP[n.lane] !== undefined) ? LEGACY_LANE_REMAP[n.lane] : n.lane;
                    gameNotes.push({ time: noteTime, endTime: noteEndTime, lane, len: (n.len || 0) * ratio, hit: false, holding: false, finished: false });
                    totalMaxHits++;
                    if(n.len > 0) totalMaxHits++;
                });
            });

            if(speedEvents.length > 0) {
                speedEvents = speedEvents.map(ev => {
                    if(ev.measureIdx !== undefined) {
                        const calculatedTime = (ev.measureIdx * msPerMeasure) + (ev.pos / BASE_RES) * msPerMeasure;
                        return { ...ev, time: calculatedTime + offset };
                    }
                    return { ...ev, time: ev.time + offset };
                });
            }
        }
        gameNotes.sort((a,b) => a.time - b.time);
        scorePerHit = totalMaxHits > 0 ? (1000000 / totalMaxHits) : 0;
    }

    function buildSpeedMap() {
        speedMap = [];
        const sortedEvents = [...speedEvents].sort((a,b) => a.time - b.time);
        speedMap.push({ time: -999999, vPos: 0, mult: 1.0 });
        sortedEvents.forEach(ev => {
            const prev = speedMap[speedMap.length - 1];
            const dist = (ev.time - prev.time) * prev.mult;
            speedMap.push({ time: ev.time, vPos: prev.vPos + dist, mult: ev.mult, warned: false });
        });
    }

    function getVisualPos(time) {
        let ev = speedMap[0];
        for(let i = 1; i < speedMap.length; i++) {
            if (speedMap[i].time > time) break;
            ev = speedMap[i];
        }
        return ev.vPos + (time - ev.time) * ev.mult;
    }

    function startGame() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        document.getElementById('loading-screen').style.display = 'none';
        buildSpeedMap();

        const msPerMeasure = (60000 / bpm) * (4 / beatDenom) * beatNum;
        activeMsgEvents = msgEvents.map(ev => {
            let startTime = ev.time, duration = 0;
            if(ev.measureIdx !== undefined) {
                startTime = (ev.measureIdx * msPerMeasure) + (ev.pos / BASE_RES) * msPerMeasure;
                duration  = (ev.len / BASE_RES) * msPerMeasure;
            }
            return { ...ev, time: startTime + offset, endTime: startTime + offset + (duration || 1000) };
        });

        if(guideMsgEl) { guideMsgEl.className = ''; guideMsgEl.innerText = ''; }

        combo = 0; maxCombo = 0; totalHits = 0; totalRateSum = 0; score = 0;
        judgeStats = { perfectEx: 0, perfect: 0, great: 0, good: 0, notBad: 0, save: 0, oh: 0, miss: 0 };
        activeNotes = []; particles = []; recentHits = []; judgments = [];
        fireflies = []; gearParticles = []; lineFlash = null;
        lineStates = DEFAULT_LINE.map(l=>({...l}));
        linePulsePhase = new Array(LANE_COUNT).fill(0);
        camState = {x:0,y:0,angle:0}; camFlipX=false; camFlipY=false; camZoom=1;
        resetFxRuntime();
        heldKeyTokens.clear();
        resetFever();

        finishEffect.innerHTML = "";
        judgeDisplayEl.innerHTML = "";
        updateGameHUD();

        warnLeft.className  = 'side-warn-col';
        warnRight.className = 'side-warn-col';
        speedEdgeWarning.classList.remove('speed-edge-up', 'speed-edge-down');
        speedEdgeLabel.textContent = '';
        if (speedWarningTimer) {
            clearTimeout(speedWarningTimer);
            speedWarningTimer = null;
        }

        if(useVideoBga) bgaVideo.currentTime = 0;

        gameState = 'COUNTDOWN';
        startTimestamp = Date.now();
        audio.currentTime = 0;
        audio.volume = getMusicVolumeSetting();
        gameStartTimeLocal = Date.now();
        gameLoop();
    }

    async function finishGame() {
        if (gameFinished) return;
        gameFinished = true;
        if (finishTimer) clearTimeout(finishTimer);
        resetFxRuntime();
        showResultPreparing();
        audio.volume = getMusicVolumeSetting();
        await fadeAudioElement(audio, 0, 900, true);
        if(useVideoBga) bgaVideo.pause();
        await sleep(800);
        playResultBgm(Math.floor(score) >= 600000);
        showResult();
    }

    function togglePause() {
        if (gameFinished) return;
        if (isResuming) {
            clearInterval(countdownTimer);
            isResuming = false;
            countdownEl.style.display = 'none';
            isPaused = true;
            pauseSelectedIdx = 0;
            updatePauseSelection();
            pauseMenu.style.display = 'flex';
            return;
        }

        if (!isPaused) {
            isPaused = true;
            pauseTime = audio.currentTime;
            audio.pause();
            if(useVideoBga) bgaVideo.pause();
            playSfx('menu_open');
            pauseSelectedIdx = 0;
            updatePauseSelection();
            pauseMenu.style.display = 'flex';
        } else {
            startResumeCountdown();
        }
    }

    function startResumeCountdown() {
        pauseMenu.style.display = 'none';
        countdownEl.style.display = 'flex';
        isResuming = true;
        let count = 3;
        countdownEl.innerText = count;

        if(countdownTimer) clearInterval(countdownTimer);
        countdownTimer = setInterval(() => {
            count--;
            if(count > 0) {
                countdownEl.innerText = count;
            } else {
                clearInterval(countdownTimer);
                countdownEl.style.display = 'none';
                isPaused   = false;
                isResuming = false;
                if(gameState === 'PLAYING') {
                    audio.play().then(() => { if(useVideoBga) bgaVideo.play(); }).catch(e => console.log(e));
                } else if (gameState === 'COUNTDOWN') {
                    startTimestamp = Date.now() - (audio.currentTime * 1000);
                }
            }
        }, 500);
    }

    function checkFeverState(currentCombo) {
        if (!isFeverEnabled()) {
            resetFever();
            return;
        }
        const container = document.getElementById('game-canvas-container');
        if (currentCombo === FEVER_LV1) {
            isFever = true;
            feverLevel = 1;
            feverPulse = 1.0;
            playSfx('fever');
            container.classList.add('fever-mode', 'fever-level-1');

            feverLevel = 2;

            container.classList.add('fever-level-2');

    function resetFever() {
        isFever = false;
        feverLevel = 0;
        feverPulse = 0;
        const container = document.getElementById('game-canvas-container');

        fireflies.forEach(p => p.scattering = true);
        gearParticles.forEach(p => p.life = 0.1);

    function drawFeverGearEffect() {
        if (!isFever || !isFeverEnabled()) return;
        const level = Math.max(1, feverLevel || (combo >= FEVER_LV3 ? 3 : combo >= FEVER_LV2 ? 2 : 1));
        const colors = [
            null,
            { main: '#00e5ff', soft: 'rgba(0,229,255,0.22)' },
            { main: '#ffd652', soft: 'rgba(255,214,82,0.25)' },
            { main: '#78ffb4', soft: 'rgba(120,255,180,0.28)' }
        ][level];
        const cx = TRACK_X_OFFSET + GEAR_W / 2;
        const cy = HIT_LINE_Y;
        const width = GEAR_W;
        const time = performance.now() * 0.001;
        const pulse = feverPulse;

        gameCtx.save();
        gameCtx.strokeStyle = colors.main;
        gameCtx.fillStyle = colors.soft;
        gameCtx.lineWidth = 1.4;
        gameCtx.shadowColor = colors.main;
        gameCtx.shadowBlur = 12 + level * 3;

        gameCtx.globalAlpha = 0.14 + level * 0.04 + pulse * 0.2;
        gameCtx.beginPath();
        gameCtx.ellipse(cx, cy, width * (0.48 + pulse * 0.16), 34 + level * 8 + pulse * 28, 0, 0, Math.PI * 2);
        gameCtx.stroke();

        gameCtx.shadowBlur = 0;
        gameCtx.globalAlpha = 0.09 + level * 0.03;
        for (let i = 0; i < 5 + level * 2; i++) {
            const offset = ((time * (24 + level * 7) + i * 74) % (width + 160)) - 80;
            gameCtx.beginPath();
            gameCtx.moveTo(TRACK_X_OFFSET + offset, cy + 58);
            gameCtx.lineTo(TRACK_X_OFFSET + offset + 56, cy - 58);
            gameCtx.stroke();
        }

        if (pulse > 0.01) {
            gameCtx.globalAlpha = pulse * 0.28;
            gameCtx.fillRect(TRACK_X_OFFSET, cy - 2, width, 4);
            feverPulse *= 0.88;
        } else {
            feverPulse = 0;
        }

        gameCtx.restore();
        gameCtx.globalAlpha = 1.0;
    }

    function updateBgParticles() {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        if (!isFeverEnabled()) return;
        const maxFireflies = combo >= FEVER_LV3 ? 42 : 26;
        if (combo >= FEVER_LV2 && fireflies.length < maxFireflies) {
            if(Math.random() < 0.055) fireflies.push(new Firefly());
        }
        for (let i = fireflies.length - 1; i >= 0; i--) {
            let p = fireflies[i];
            p.update(); p.draw(bgCtx);
            if (p.baseAlpha <= 0) fireflies.splice(i, 1);
        }
    }

    // ============================================================
    // 게임 루프
    // ============================================================
    function gameLoop() {
        if(gameFinished) return;
        gameAnimId = requestAnimationFrame(gameLoop);

        if(isPaused || isResuming) {
            drawGameScreen(audio.currentTime * 1000);
            return;
        }

        updateBgParticles();

        const now = Date.now();
        let currentTime = -9999;

        if (gameState === 'COUNTDOWN') {
            const rawTime = now - startTimestamp;
            currentTime = rawTime - START_DELAY;
            if (rawTime >= START_DELAY) {
                gameState = 'WAIT_AUDIO';
                audio.play().then(() => { if(useVideoBga) bgaVideo.play(); }).catch(() => { gameState = 'PLAYING_NO_AUDIO'; });
            }
        } else if (gameState === 'WAIT_AUDIO') {
            currentTime = 0;
            if (audio.currentTime > 0 && !audio.paused) gameState = 'PLAYING';
        } else if (gameState === 'PLAYING') {
            currentTime = audio.currentTime * 1000;
        } else if (gameState === 'PLAYING_NO_AUDIO') {
            currentTime = (Date.now() - startTimestamp) - START_DELAY;
        }

        if (!gameFinished && !isPaused) {
            if (audio.ended || currentTime > lastNoteEndTime + 3000) finishGame();
        }

        const msPerMeasure = (60000 / bpm) * 4;
        let nextEvent = speedMap.find(ev => ev.time > currentTime);
        if (nextEvent && !nextEvent.warned) {
            let currentMult = 1.0;
            for(let i = 0; i < speedMap.length; i++) {
                if(speedMap[i].time <= currentTime) currentMult = speedMap[i].mult;
                else break;
            }
            if (nextEvent.time - currentTime <= msPerMeasure) {
                nextEvent.warned = true;
                if (Math.abs(nextEvent.mult - currentMult) >= 0.001) {
                    showSpeedWarning(nextEvent.mult, currentMult);
                }
            }
        }

        // 메시지 이벤트
        if (activeMsgEvents.length > 0 && !gameFinished) {
            const activeMsg = activeMsgEvents.find(ev => currentTime >= ev.time && currentTime <= ev.endTime);
            if (activeMsg) {
                if (guideMsgEl.innerText !== activeMsg.text) {
                    guideMsgEl.innerText = activeMsg.text;
                    guideMsgEl.classList.add('msg-active');
                }
            } else {
                guideMsgEl.classList.remove('msg-active');
            }
        }

        drawGameScreen(currentTime);
    }

    // ============================================================
    // 게임 화면 렌더링
    // ============================================================
    function drawGameScreen(currentTime) {
        gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);
        drawFeverGearEffect();

        // ★ 라인 안무/펄스/카메라 상태 갱신 (에디터와 동일 타임라인)
        lineStates    = Array.from({length:LANE_COUNT},(_,l)=>getLineState(l, currentTime));
        linePulsePhase = Array.from({length:LANE_COUNT},(_,l)=>getPulseMagnitude(l, currentTime));
        camState  = getCameraState(currentTime);
        camFlipX  = getCameraFlip('x', currentTime);
        camFlipY  = getCameraFlip('y', currentTime);
        camZoom   = getCameraZoom(currentTime);
        updateFxRuntime(currentTime);
        syncJudgePopups();

        const currentVisualY = getVisualPos(currentTime);
        const GLOBAL_SCALE   = 0.1 * baseNoteSpeed;

        while(gameNotes.length > 0 && gameNotes[0].time - 10000 < currentTime) {
            activeNotes.push(gameNotes.shift());
        }

        // ============================================================
        // ★ 노트 판정 / 렌더링 (개선된 얼리미스 / 롱노트)
        // ============================================================
        const MAX_HIT_WINDOW = 110; // Oh... 윈도우 (초과시 Miss)

        for(let i = 0; i < activeNotes.length; i++) {
            let n = activeNotes[i];
            const nPos   = getVisualPos(n.time);
            const endPos = (n.len > 0) ? getVisualPos(n.endTime) : nPos;
            const headY  = HIT_LINE_Y - (nPos - currentVisualY) * GLOBAL_SCALE;
            let   tailY  = headY;
            if (n.len > 0) tailY = HIT_LINE_Y - (endPos - currentVisualY) * GLOBAL_SCALE;

            // ★ 화면 아래로 사라진 경우 (Miss 처리) - 롱노트 테일도 포함
            if (tailY > gameCanvas.height + 30) {
                if (!n.finished) {
                    n.finished = true;
                    if (!n.hit) {
                        // 아직 히트 안 된 노트: Miss
                        applyJudge(n, 'miss');
                    }
                }
                continue;
            }

            // ★ 얼리 미스 판정: 히트하지 않은 노트가 판정선 아래 MAX_HIT_WINDOW 이상 지난 경우
            if (!n.hit && !n.finished) {
                const lateDiff = currentTime - n.time;
                if (lateDiff > MAX_HIT_WINDOW + 50) { // 버퍼 50ms
                    n.hit = true; n.finished = true;
                    applyJudge(n, 'miss');
                    checkFinish();
                    continue;
                }
            }

            // ★ 롱노트 홀딩 중 끝 체크
            if (n.hit && n.len > 0 && !n.finished) {
                if (activeKeys[n.lane]) {
                    if (currentTime >= n.endTime) {
                        n.finished = true;
                        totalHits++;
                        score += scorePerHit;
                        totalRateSum += 100;
                        combo++;
                        judgeStats.perfectEx++;
                        if(combo > maxCombo) maxCombo = combo;
                        updateGameHUD();
                        createParticlesForJudge(n.lane, JUDGE_TABLE[0]);
                        showJudgePopup(JUDGE_TABLE[0], n.lane);
                        playSfx('hold_end');
                        checkFinish();
                        checkFeverState(combo);
                    }
                } else {
                    // ★ 롱노트 도중 손을 뗀 경우 - 안전 구간 / 불안전 구간 판별
                    const remaining    = n.endTime - currentTime;
                    const totalDuration = n.endTime - n.time;
                    const safeZone     = Math.max(100, totalDuration * 0.2);

                    if (remaining > safeZone) {
                        // 불안전 구간에서 손 뗌: Miss
                        n.finished = true;
                        combo = 0;
                        totalHits++;
                        judgeStats.miss++;
                        updateGameHUD();
                        showJudgePopup(JUDGE_TABLE[7], n.lane);
                        resetFever();
                    } else {
                        // 안전 구간에서 손 뗌: Perfect 처리 (checkRelease 에서 처리됨)
                        // (여기선 아직 손 안 뗀 상태 = 별도 처리 없음)
                    }
                }
            }

            // (그리기는 아래 무빙 라인 렌더 패스에서 처리 — 여기선 판정 로직만)
        }
        activeNotes = activeNotes.filter(n => !n.finished);

        // ============================================================
        // ★ 무빙 라인 렌더 패스 (에디터와 동일: 라인 + 수직 접근 노트)
        // ============================================================
        const cvy = currentVisualY;
        const gs  = GLOBAL_SCALE;
        const laneHalf = laneHalfW();
        const safeLimit = Math.sqrt(gameCanvas.width*gameCanvas.width + gameCanvas.height*gameCanvas.height) * 3;

        // ── 카메라 트랜스폼: 화면이 라인들을 바라보는 카메라라는 컨셉 (이동/회전/반전/줌) ──
        gameCtx.save();
        gameCtx.translate(gameCanvas.width/2 + camState.x*gameCanvas.width + fxShakeOffset.x, gameCanvas.height/2 + camState.y*gameCanvas.height + fxShakeOffset.y);
        gameCtx.rotate(camState.angle*Math.PI/180);
        gameCtx.scale((camFlipX?-1:1)*camZoom, (camFlipY?-1:1)*camZoom);
        gameCtx.translate(-gameCanvas.width/2, -gameCanvas.height/2);

        for(let lane=0; lane<LANE_COUNT; lane++){
            if(!getLineActive(lane, currentTime)) continue; // 꺼져있는 라인은 완전히 숨김
            const st=lineStates[lane];
            const pulse=linePulsePhase[lane]||0;
            const px=lineX(st), py=lineY(st);
            const ang=(st.angle*Math.PI)/180;
            const skinCfg = readNoteSkinConfig();
            const col=getLaneColor(lane);
            const metrics=getNoteStyleMetrics(skinCfg, laneHalf);

            gameCtx.save();
            gameCtx.translate(px,py);
            gameCtx.rotate(ang);
            gameCtx.translate(0,pulse);

            // 키 입력 글로우 빔
            if(activeKeys[lane]){
                const bg=gameCtx.createLinearGradient(0,0,0,-180);
                bg.addColorStop(0,hexA(col,0.18)); bg.addColorStop(1,hexA(col,0));
                gameCtx.fillStyle=bg;
                gameCtx.fillRect(-laneHalf,-180,laneHalf*2,180);
            }

            // 판정 라인
            drawSkinnedLine(gameCtx, laneHalf, col, activeKeys[lane], metrics);
            // 중심 점
            gameCtx.fillStyle=col; gameCtx.globalAlpha=1;
            gameCtx.shadowBlur=activeKeys[lane]?8:2;
            gameCtx.beginPath(); gameCtx.arc(0,0,activeKeys[lane]?3.5:2,0,Math.PI*2); gameCtx.fill();
            gameCtx.shadowBlur=0;

            // 라인에 수직 접근하는 노트
            const visibleNotes=activeNotes.filter(n=>n.lane===lane&&!n.finished
                && n.endTime>currentTime-800 && n.time<currentTime+8000);
            visibleNotes.forEach(n=>{
                const nPos=getVisualPos(n.time);
                const endPos=n.len>0?getVisualPos(n.endTime):nPos;
                const headLocalY=-(nPos-cvy)*gs;
                if(n.len>0){
                    const endLocalY=-(endPos-cvy)*gs;
                    const drawHeadY=(n.hit&&!isPaused)?0:headLocalY;
                    const top=Math.min(drawHeadY,endLocalY), bot=Math.max(drawHeadY,endLocalY);
                    const clTop=Math.max(-safeLimit,top), clBot=Math.min(60,bot);
                    if(clBot>clTop){
                        const skin = metrics.skin;
                        const holdWidth = Math.max(8, metrics.width * (skin === 'circle' || skin === 'star' ? 0.44 : 0.74));
                        const holdRadius = Math.min(holdWidth / 2, metrics.radius || 4);
                        gameCtx.shadowColor = col;
                        if (skin === 'neon-core') {
                            gameCtx.fillStyle = '#06080e'; gameCtx.globalAlpha = 0.55; gameCtx.shadowBlur = 0;
                            roundRect(gameCtx,-holdWidth/2,clTop,holdWidth,clBot-clTop,holdRadius); gameCtx.fill();
                            gameCtx.fillStyle = col; gameCtx.shadowBlur = 5;
                            gameCtx.globalAlpha = 0.50;
                            gameCtx.fillRect(-holdWidth/2,clTop,1.5,clBot-clTop);
                            gameCtx.fillRect(holdWidth/2-1.5,clTop,1.5,clBot-clTop);
                        } else {
                            gameCtx.fillStyle=col; gameCtx.globalAlpha=0.14; gameCtx.shadowBlur=0;
                            roundRect(gameCtx,-holdWidth/2,clTop,holdWidth,clBot-clTop,holdRadius); gameCtx.fill();
                            gameCtx.globalAlpha=0.38;
                            gameCtx.fillRect(-holdWidth/2,clTop,1.5,clBot-clTop);
                            gameCtx.fillRect(holdWidth/2-1.5,clTop,1.5,clBot-clTop);
                        }
                        gameCtx.globalAlpha=1; gameCtx.shadowBlur=0;
                    }
                }
                if((!n.hit||isPaused)&&headLocalY>-safeLimit&&headLocalY<60){
                    drawSkinnedNote(gameCtx, metrics, headLocalY, col);
                }
            });

            gameCtx.globalAlpha=1;
            gameCtx.restore();
            gameCtx.globalAlpha=1; gameCtx.shadowBlur=0; gameCtx.shadowColor='transparent';
        }

        drawParticles();
        drawGameFX();
        gameCtx.restore(); // ── 카메라 트랜스폼 종료 (이 아래는 화면 고정 UI) ──
        renderScreenEffects(gameCtx, gameCanvas.width, gameCanvas.height, currentTime);
        drawHitErrorBar();
    }

    // ============================================================
    // ★ 판정 적용 통합 함수
    // ============================================================
    function applyJudge(note, forceKey) {
        const key      = forceKey || 'miss';
        const judgeInfo = JUDGE_TABLE.find(j => j.key === key) || JUDGE_TABLE[7];
        
        totalHits++;
        if(note.len > 0) totalHits++; // 롱노트는 head+tail 2카운트

        judgeStats[judgeInfo.key]++;
        totalRateSum += judgeInfo.rate;
        score += scorePerHit * judgeInfo.scoreRate;

        if(judgeInfo.comboBreak) {
            combo = 0;
            resetFever();
        } else {
            combo++;
            if(combo > maxCombo) maxCombo = combo;
            checkFeverState(combo);
        }

        updateGameHUD();
        showJudgePopup(judgeInfo, note ? note.lane : 0);
        if(!judgeInfo.comboBreak) createParticlesForJudge(note.lane, judgeInfo);
    }

    // ============================================================
    // 키 입력
    // ============================================================
    // 라인별로 여러 키를 가질 수 있음(겸용키). 구버전(문자열 1개) 포맷도 그대로 호환
    function normalizeKeyToken(token){
        if(token === ' ') return 'space';
        if(typeof token !== 'string') return '';
        const lower = token.trim().toLowerCase();
        if(!lower) return '';
        const aliasMap = {
            spacebar: 'space', space: 'space',
            backquote: '`', '`': '`', '~': '`',
            minus: '-', '-': '-', '_': '-',
            equal: '=', '=': '=', '+': '=',
            bracketleft: '[', '[': '[', '{': '[',
            bracketright: ']', ']': ']', '}': ']',
            backslash: '\\', '\\': '\\', '|': '\\',
            semicolon: ';', ';': ';', ':': ';',
            quote: "'", "'": "'", '"': "'",
            comma: ',', ',': ',', '<': ',',
            period: '.', '.': '.', '>': '.',
            slash: '/', '/': '/', '?': '/',
        };
        if(aliasMap[lower]) return aliasMap[lower];
        if(/^key[a-z]$/.test(lower)) return lower.slice(3);
        if(/^digit[0-9]$/.test(lower)) return lower.slice(5);
        if(/^numpad[0-9]$/.test(lower)) return lower;
        if(lower.length===1 && lower>='a' && lower<='z') return lower;
        return lower;
    }
    function normalizeKeyCodeToken(code){
        if(typeof code !== 'string' || !code) return '';
        if(code === 'Space') return 'space';
        if(code === 'ShiftLeft') return 'shiftleft';
        if(code === 'ShiftRight') return 'shiftright';
        if(/^Key[A-Z]$/.test(code)) return code.slice(3).toLowerCase();
        if(/^Digit[0-9]$/.test(code)) return code.slice(5);
        if(/^Numpad[0-9]$/.test(code)) return `numpad${code.slice(6)}`;
        const codeMap = {
            Backquote: '`',
            Minus: '-',
            Equal: '=',
            BracketLeft: '[',
            BracketRight: ']',
            Backslash: '\\',
            Semicolon: ';',
            Quote: "'",
            Comma: ',',
            Period: '.',
            Slash: '/',
        };
        return codeMap[code] || '';
    }
    function normalizeKeyMapData(km){
        if(!Array.isArray(km)) return null;
        const norm = km.map(entry => {
            const keys = (Array.isArray(entry) ? entry : [entry])
                .map(normalizeKeyToken)
                .filter(Boolean);
            return Array.from(new Set(keys));
        });
        while(norm.length < LANE_COUNT) norm.push([]);
        return norm.slice(0, LANE_COUNT);
    }
    // lane 순서는 에디터와 동일하게 S,D,F,SPACE,J,K,L. 기존 4키 맵 호환은 DEFAULT_ACTIVE_SET([1,2,4,5]=D F J K)과
    // 구버전 채보 lane 리맵(parseChartData의 legacy remap)으로 처리
    const KEY_MAP_DEFAULT = [['s'],['d'],['f'],['space'],['j'],['k'],['l']];
    let KEY_MAP;
    try {
        const saved = JSON.parse(localStorage.getItem('wb_key_layout') || 'null');
        KEY_MAP = normalizeKeyMapData(saved) || KEY_MAP_DEFAULT.map(a=>a.slice());
    } catch(e) {
        KEY_MAP = KEY_MAP_DEFAULT.map(a=>a.slice());
    }
    // 키보드 이벤트를 KEY_MAP과 비교 가능한 토큰으로 정규화 (스페이스바/좌우Shift 구분)
    function normalizeKeyEvent(e){
        return normalizeKeyCodeToken(e.code) || normalizeKeyToken(e.key || e.code || '');
    }
    function laneCandidatesForToken(tok){
        const out=[];
        KEY_MAP.forEach((keys,idx)=>{ if(keys && keys.includes(tok)) out.push(idx); });
        return out;
    }
    let heldKeyTokens = new Set(); // 지금 눌려있는 물리 키 토큰 (겸용키/OS 키반복 방지용)

    window.addEventListener('keydown', e => {
        // ★ 일시정지 메뉴에서 키보드 탐색
        if (isPaused && !isResuming) {
            if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                pauseSelectedIdx = (pauseSelectedIdx - 1 + pauseActions.length) % pauseActions.length;
                updatePauseSelection(); return;
            }
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                pauseSelectedIdx = (pauseSelectedIdx + 1) % pauseActions.length;
                updatePauseSelection(); return;
            }
            if (e.key === 'Enter' || e.key === ' ') {
                executePauseAction(pauseActions[pauseSelectedIdx]); return;
            }
            if (e.key === 'Escape') { togglePause(); return; }
            return;
        }

        if(gameFinished) return;
        if (e.code === 'Escape') { togglePause(); return; }
        if(isPaused || isResuming) return;

        const tok = normalizeKeyEvent(e);
        const candidateLanes = laneCandidatesForToken(tok);
        if(candidateLanes.length){
            e.preventDefault();
            if(!heldKeyTokens.has(tok)){
                heldKeyTokens.add(tok);
                candidateLanes.forEach(l => activeKeys[l] = true);
                checkHit(candidateLanes);
            }
        }
    });

    window.addEventListener('keyup', e => {
        const tok = normalizeKeyEvent(e);
        heldKeyTokens.delete(tok);
        const candidateLanes = laneCandidatesForToken(tok);
        if(candidateLanes.length){
            e.preventDefault();
            const releasedLanes = candidateLanes.filter(l => activeKeys[l]);
            candidateLanes.forEach(l => activeKeys[l] = false);
            if(gameFinished || isPaused || isResuming) return;
            if(releasedLanes.length) checkRelease(releasedLanes);
        }
    });

    function resetActiveKeys() {
        activeKeys = new Array(LANE_COUNT).fill(false);
        heldKeyTokens.clear();
    }
    window.addEventListener('blur', resetActiveKeys);
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) resetActiveKeys();
    });

    if (isMobile) {
        gameCanvas.addEventListener('touchstart',  handleTouch, {passive: false});
        gameCanvas.addEventListener('touchend',    handleTouch, {passive: false});
        gameCanvas.addEventListener('touchcancel', handleTouch, {passive: false});
    }

    function handleTouch(e) {
        if (gameFinished || isPaused || isResuming) return;
        e.preventDefault();
        const touches = e.changedTouches;
        for (let i = 0; i < touches.length; i++) {
            const touch = touches[i];
            const lane  = Math.floor(touch.clientX / (window.innerWidth / LANE_COUNT));
            if (lane >= 0 && lane < LANE_COUNT) {
                if (e.type === 'touchstart') {
                    if (!activeKeys[lane]) { activeKeys[lane] = true; checkHit([lane]); }
                } else {
                    activeKeys[lane] = false; checkRelease([lane]);
                }
            }
        }
    }

    // ============================================================
    // ★ checkHit (8단계 판정)
    // ============================================================
    function checkHit(laneOrLanes) {
        let currentTime = getCurrentTime();
        const candidateLanes = (Array.isArray(laneOrLanes)?laneOrLanes:[laneOrLanes])
            .filter(l => getLineActive(l, currentTime));
        if(candidateLanes.length===0) return;

        const MAX_WINDOW = 110; // Oh... 까지의 최대 윈도우
        const candidates = activeNotes.filter(n =>
            candidateLanes.includes(n.lane) && !n.hit && !n.finished &&
            Math.abs(currentTime - n.time) <= MAX_WINDOW
        );
        if (candidates.length === 0) return;

        const n = candidates.reduce((prev, curr) =>
            Math.abs(currentTime - curr.time) < Math.abs(currentTime - prev.time) ? curr : prev
        );
        const lane    = n.lane; // 후보 라인들 중 실제로 맞은 노트가 속한 라인
        const diff    = currentTime - n.time;
        const absDiff = Math.abs(diff);

        n.hit = true;
        n.holding = true;
        if (n.len === 0) n.finished = true;

        // ★ SFX
        if (n.len > 0) playSfx('hold_start'); else playSfx('hit');

        // ★ 판정 결정 (8단계)
        let judgeInfo = JUDGE_TABLE[7]; // 기본: No...
        for(const j of JUDGE_TABLE) {
            if(absDiff <= j.window) { judgeInfo = j; break; }
        }

        // 판정 통계 반영
        totalHits++;
        judgeStats[judgeInfo.key]++;
        totalRateSum += judgeInfo.rate;
        score += scorePerHit * judgeInfo.scoreRate;

        if(judgeInfo.comboBreak) {
            combo = 0;
            resetFever();
        } else {
            combo++;
            if(combo > maxCombo) maxCombo = combo;
            checkFeverState(combo);
        }

        updateGameHUD();
        showJudgePopup(judgeInfo, lane);
        createParticlesForJudge(lane, judgeInfo);

        // 히트 에러 바 기록
        recentHits.push({ diff, color: judgeInfo.color, life: 600, maxLife: 600 });

        checkFinish();
        if(totalHits === totalMaxHits && !finishTimer) finishTimer = setTimeout(finishGame, 1500);
    }

    // ============================================================
    // ★ checkRelease (롱노트 해제)
    // ============================================================
    function checkRelease(laneOrLanes) {
        const candidateLanes = Array.isArray(laneOrLanes)?laneOrLanes:[laneOrLanes];
        const n = activeNotes.find(n => candidateLanes.includes(n.lane) && n.hit && !n.finished && n.len > 0);
        if (!n) return;
        const lane = n.lane;

        const currentTime   = getCurrentTime();
        const remaining     = n.endTime - currentTime;
        const totalDuration = n.endTime - n.time;
        const safeZone      = Math.max(100, totalDuration * 0.2);

        if (remaining > safeZone) {
            // 너무 일찍 뗌: Miss
            n.finished = true;
            totalHits++;
            judgeStats.miss++;
            totalRateSum += 0;
            combo = 0;
            updateGameHUD();
            showJudgePopup(JUDGE_TABLE[7], lane);
            resetFever();
        } else {
            // 안전 구간에서 뗌: Perfect! 처리
            n.finished = true;
            totalHits++;
            score += scorePerHit * 1.0;
            totalRateSum += 100;
            combo++;
            judgeStats.perfectEx++;
            if(combo > maxCombo) maxCombo = combo;
            updateGameHUD();
            showJudgePopup(JUDGE_TABLE[0], lane);
            createParticlesForJudge(lane, JUDGE_TABLE[0]);
            playSfx('hold_end');
            checkFeverState(combo);
        }

        checkFinish();
        if(totalHits === totalMaxHits && !finishTimer) finishTimer = setTimeout(finishGame, 1500);
    }

    function getCurrentTime() {
        if (gameState === 'PLAYING' && audio.currentTime > 0) return audio.currentTime * 1000;
        return (Date.now() - startTimestamp) - START_DELAY;
    }

    function updateGameHUD() {
        const comboEl = document.getElementById('g-combo');
        comboEl.innerText  = combo;
        document.getElementById('g-score').innerText  = Math.round(score).toString().padStart(6, '0');
        let currentRate = 100.00;
        if (totalHits > 0) currentRate = Math.min(100, (totalRateSum / (totalHits * 100)) * 100);
        document.getElementById('g-rate').innerText   = currentRate.toFixed(2) + "%";

        // ★ 콤보 색상: TB(All Perfect) 가능 → 노랑 / FC 가능 → 파랑 / 그 외 → 흰색
        const tbPossible = (judgeStats.perfect + judgeStats.great + judgeStats.good
                          + judgeStats.notBad + judgeStats.save + judgeStats.oh + judgeStats.miss) === 0;
        const fcPossible = (judgeStats.oh + judgeStats.miss) === 0;
        let cColor = '#ffffff', cGlow = 'rgba(255,255,255,0.4)';
        if (tbPossible)      { cColor = '#ffd700'; cGlow = '#ffd700'; }   // TROLL BEAT 가능
        else if (fcPossible) { cColor = '#00e5ff'; cGlow = '#00e5ff'; }   // FULL COMBO 가능
        comboEl.style.color = cColor;
        comboEl.style.textShadow = `0 0 20px ${cGlow}`;
    }

    // ============================================================
    // 그리기 유틸
    // ============================================================
    function drawJudgmentLine() {
        // ★ 라인 플래시
        if(lineFlash && lineFlash.life > 0) {
            gameCtx.globalAlpha = lineFlash.life * 0.5;
            gameCtx.fillStyle   = lineFlash.color;
            gameCtx.fillRect(0, HIT_LINE_Y - 20, gameCanvas.width, 40);
            gameCtx.globalAlpha = 1.0;
            lineFlash.life -= 0.08;
        }

        const lineColor = (isFeverEnabled() && combo >= FEVER_LV3) ? '#00ff00' : (isFeverEnabled() && isFever ? '#ffd700' : '#00e5ff');
        gameCtx.shadowBlur   = 12;
        gameCtx.shadowColor  = lineColor;
        gameCtx.strokeStyle  = lineColor;
        gameCtx.lineWidth    = 3;
        gameCtx.beginPath();
        gameCtx.moveTo(0, HIT_LINE_Y);
        gameCtx.lineTo(gameCanvas.width, HIT_LINE_Y);
        gameCtx.stroke();
        gameCtx.shadowBlur = 0;

        // 레인 구분선
        gameCtx.strokeStyle = 'rgba(255,255,255,0.3)';
        gameCtx.lineWidth   = 2;
        for(let i = 0; i <= 4; i++) {
            const x = TRACK_X_OFFSET + i * LANE_WIDTH;
            gameCtx.beginPath();
            gameCtx.moveTo(x, 0);
            gameCtx.lineTo(x, gameCanvas.height);
            gameCtx.stroke();
        }
    }

    function drawLaneBeams() {
        gameCtx.globalCompositeOperation = 'lighter';
        for(let i = 0; i < 4; i++) {
            if(activeKeys[i]) {
                const grd = gameCtx.createLinearGradient(0, HIT_LINE_Y, 0, HIT_LINE_Y - 300);
                grd.addColorStop(0, COLORS[i] + '80');
                grd.addColorStop(1, "transparent");
                gameCtx.fillStyle = grd;
                gameCtx.fillRect(TRACK_X_OFFSET + i * LANE_WIDTH, 0, LANE_WIDTH, HIT_LINE_Y);
            }
        }
        gameCtx.globalCompositeOperation = 'source-over';
    }

    function drawGameFX() {
        for(let i = judgments.length - 1; i >= 0; i--) {
            const j = judgments[i];
            gameCtx.save();
            gameCtx.globalAlpha = j.life / j.maxLife;
            gameCtx.fillStyle   = j.color;
            gameCtx.font        = "900 24px Arial";
            gameCtx.textAlign   = "center";
            gameCtx.fillText(j.text, j.x, j.y - (30 - j.life));
            gameCtx.restore();
            j.life--;
            if(j.life <= 0) judgments.splice(i, 1);
        }
    }

    function drawHitErrorBar() {
        const meterScale = Math.max(50, Math.min(150, parseFloat(localStorage.getItem('wb_hit_meter_size') || '100') || 100)) / 100;
        const cx    = gameCanvas.width / 2;
        const cy    = Math.min(gameCanvas.height - (22 * meterScale), HIT_LINE_Y + (76 * meterScale));
        const width = 300 * meterScale;
        const barHeight = 6 * meterScale;
        const centerHeight = 16 * meterScale;
        const markWidth = Math.max(2, 4 * meterScale);
        const markHeight = 16 * meterScale;

        // 판정 구간 배경 (색상 그라디언트로)
        const barGrd = gameCtx.createLinearGradient(cx - width/2, 0, cx + width/2, 0);
        barGrd.addColorStop(0,    'rgba(255,45,120,0.3)');
        barGrd.addColorStop(0.25, 'rgba(255,119,51,0.3)');
        barGrd.addColorStop(0.4,  'rgba(255,179,0,0.3)');
        barGrd.addColorStop(0.5,  'rgba(0,242,255,0.5)');
        barGrd.addColorStop(0.6,  'rgba(255,179,0,0.3)');
        barGrd.addColorStop(0.75, 'rgba(255,119,51,0.3)');
        barGrd.addColorStop(1,    'rgba(255,45,120,0.3)');
        gameCtx.fillStyle = barGrd;
        gameCtx.fillRect(cx - width/2, cy - barHeight/2, width, barHeight);

        // 중심선
        gameCtx.fillStyle = "#fff";
        gameCtx.fillRect(cx - meterScale, cy - centerHeight/2, 2 * meterScale, centerHeight);

        // 히트 마크
        for(let i = recentHits.length - 1; i >= 0; i--) {
            const h   = recentHits[i];
            const px  = (h.diff / 110) * (width / 2);
            const drawX = Math.max(cx - width/2, Math.min(cx + width/2, cx + px));
            gameCtx.fillStyle   = h.color;
            gameCtx.globalAlpha = h.life / h.maxLife;
            gameCtx.shadowBlur  = 6 * meterScale;
            gameCtx.shadowColor = h.color;
            gameCtx.fillRect(drawX - markWidth/2, cy - markHeight/2, markWidth, markHeight);
            gameCtx.shadowBlur  = 0;
            gameCtx.globalAlpha = 1.0;
            h.life--;
            if(h.life <= 0) recentHits.splice(i, 1);
        }
    }

    function drawParticles() {
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x   += p.vx;
            p.y   += p.vy;
            p.vy  += 0.5;
            p.vx  *= 0.98;
            p.life -= p.decay;
            if(p.life <= 0) { particles.splice(i, 1); continue; }
            gameCtx.globalAlpha = p.life;
            if(p.glow) {
                gameCtx.shadowBlur  = 12;
                gameCtx.shadowColor = p.color;
            }
            gameCtx.fillStyle = p.color;
            gameCtx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            gameCtx.shadowBlur  = 0;
        }
        gameCtx.globalAlpha = 1.0;
    }

    function checkFinish() {
        if (totalHits === totalMaxHits && totalMaxHits > 0) {
            if (judgeStats.perfectEx === totalMaxHits) {
                finishEffect.innerHTML = "<div class='text-glitch' data-text='TROLL BEAT!!'>TROLL BEAT!!</div>";
                playSfx('ap_main'); playSfx('ap_layer');
            } else if (combo === totalMaxHits) {
                finishEffect.innerHTML = "<div class='text-fc'>FULL COMBO</div>";
                playSfx('fc');
            }
        }
    }

    function animateResultValue(el, target, formatter, duration = 1400) {
        if (!el) return;
        const startTime = performance.now();
        function step(now) {
            const t = Math.min(1, (now - startTime) / duration);
            const eased = 1 - Math.pow(1 - t, 4);
            let value = target * eased;
            if (t < 0.88) {
                value += (Math.random() - 0.5) * target * 0.018 * (1 - t);
            }
            el.textContent = formatter(Math.max(0, Math.min(target, value)));
            if (t < 1) requestAnimationFrame(step);
            else el.textContent = formatter(target);
        }
        requestAnimationFrame(step);
    }

    function animateResultValue(el, target, fmt, duration) {
        if (!el) return;
        const start = performance.now();
        function step(now) {
            const t = Math.min(1, (now - start) / duration);
            const ease = 1 - Math.pow(1 - t, 3);
            el.textContent = fmt(target * ease);
            if (t < 1) requestAnimationFrame(step);
            else el.textContent = fmt(target);
        }
        requestAnimationFrame(step);
    }

    function showResultPreparing() {
        resultOverlay.innerHTML = `<div class="result-prep">COMPILING RESULT</div>`;
        resultOverlay.style.display = 'flex';
    }

    async function getResultSongInfo(songParam, diffParam) {
        const fallbackSong = songParam ? decodeURIComponent(songParam) : "UNKNOWN SONG";
        const fallbackDiff = diffParam ? diffParam.replace(/\.json$/i, '').split('_')[0].toUpperCase() : "UNKNOWN";
        const fallbackLevel = new URLSearchParams(window.location.search).get('level') || "?";
        try {
            const res = await fetch('song_list.json');
            if (!res.ok) throw new Error();
            const songs = await res.json();
            const song = songs.find(s => s.folder === songParam || decodeURIComponent(s.folder) === decodeURIComponent(songParam || ''));
            const diffFile = diffParam && diffParam.endsWith('.json') ? diffParam : `${diffParam}.json`;
            const chart = song?.charts?.find(c => c.file === diffFile || c.file.replace(/\.json$/i,'') === diffParam);
            return { title: song?.title || fallbackSong, diffName: chart?.name || fallbackDiff, level: chart?.level ?? fallbackLevel };
        } catch(e) {
            return { title: fallbackSong, diffName: fallbackDiff, level: fallbackLevel };
        }
    }

    // ============================================================
    // ★ 결과 화면 — FULL CINEMATIC
    // ============================================================
    async function showResult() {
        try {
            const currentTime  = Date.now();
            const playDuration = currentTime - gameStartTimeLocal;
            const minPlayTime  = lastNoteEndTime * 0.5;
            if (playDuration < minPlayTime && !isFever) {
                alert("비정상적인 플레이가 감지되었습니다. (Time Logic)");
                location.href = 'index.html'; return;
            }

            const pureScore = Math.floor(score);
            const calcScore = Math.floor(
                (judgeStats.perfectEx * scorePerHit * 1.0) +
                (judgeStats.perfect   * scorePerHit * 0.96) +
                (judgeStats.great     * scorePerHit * 0.88) +
                (judgeStats.good      * scorePerHit * 0.70) +
                (judgeStats.notBad    * scorePerHit * 0.45) +
                (judgeStats.save      * scorePerHit * 0.20) +
                (judgeStats.oh        * scorePerHit * 0.05)
            );
            if (Math.abs(pureScore - calcScore) > 1000) {
                alert("데이터 무결성 오류가 발생했습니다. (점수 불일치)");
                location.href = 'index.html'; return;
            }

            const SECRET_SALT    = "WebBeat_Secure_Key_2026_Ver42";
            const secureScore    = Math.floor(score);
            const secureMaxCombo = Math.floor(maxCombo || 0);
            const secureUserId   = userProfile ? (userProfile.sub || userProfile.id) : "GUEST_" + Math.random().toString(36).substring(2,9);
            const secureUserName = userProfile ? userProfile.name : "GUEST";
            const securePlayTime = Math.floor(playDuration || 0);
            const rawSignature   = `${secureUserId}_${secureScore}_${secureMaxCombo}_${SECRET_SALT}`;
            const signatureToken = btoa(unescape(encodeURIComponent(rawSignature)));
            const SERVER_BASE    = SERVER_URL.replace('/api/score','');
            finishEffect.innerHTML = "";

            let finalRate = 0;
            if (totalHits > 0) finalRate = (totalRateSum / (totalHits * 100)) * 100;

            let gainedXp = Math.floor(secureScore / 5000);
            if (combo === totalMaxHits && totalMaxHits > 0) gainedXp += 50;
            let currentLv = parseInt(localStorage.getItem('wb_user_lv') || "1");
            let currentXp = parseInt(localStorage.getItem('wb_user_xp') || "0");
            currentXp += gainedXp;
            let requiredXp = currentLv * 500;
            while (currentXp >= requiredXp) { currentXp -= requiredXp; currentLv++; requiredXp = currentLv * 500; }
            localStorage.setItem('wb_user_lv', currentLv);
            localStorage.setItem('wb_user_xp', currentXp);

            // ── 랭크 계산 ──
            const thresholds = [
                { min:1000000, grade:'TB',     cls:'rg-tb', hex:'#ffffff' },
                { min:950000,  grade:'S+',     cls:'rg-sp', hex:'#00ffff' },
                { min:900000,  grade:'S',      cls:'rg-s',  hex:'#00e5ff' },
                { min:850000,  grade:'A+',     cls:'rg-ap', hex:'#00ff88' },
                { min:800000,  grade:'A',      cls:'rg-a',  hex:'#00cc66' },
                { min:700000,  grade:'B',      cls:'rg-b',  hex:'#6aa7ff' },
                { min:600000,  grade:'C',      cls:'rg-c',  hex:'#ffc832' },
                { min:0,       grade:'FAILED', cls:'rg-failed', hex:'#ff4455' },
            ];
            const gradeInfo = secureScore >= 600000
                ? (thresholds.find(t => secureScore >= t.min) || thresholds[thresholds.length-1])
                : thresholds[thresholds.length-1];
            const rank = gradeInfo.grade;
            const rankCls = gradeInfo.cls;
            const rankColor = gradeInfo.hex;

            // ── URL 파라미터 ──
            const urlParams  = new URLSearchParams(window.location.search);
            const songParam  = urlParams.get('song');
            const diffParam  = urlParams.get('diff');
            const resultSongInfo = await getResultSongInfo(songParam, diffParam);

            // ── 개인 최고기록 ──
            let savedScore = 0, isNewRecord = false, scoreDiff = 0;
            if (songParam && diffParam) {
                const scoreKey  = `wb_score_${songParam}_${diffParam}`;
                const badgeKey  = `wb_badge_${songParam}_${diffParam}`;
                const detailKey = `wb_detail_${songParam}_${diffParam}`;
                savedScore = parseInt(localStorage.getItem(scoreKey) || "0");
                scoreDiff  = secureScore - savedScore;
                isNewRecord = secureScore > savedScore && savedScore > 0;
                if (secureScore > savedScore) localStorage.setItem(scoreKey, secureScore.toString().padStart(6,'0'));
                if (judgeStats.perfectEx === totalMaxHits && totalMaxHits > 0) localStorage.setItem(badgeKey, "TB");
                else if (combo === totalMaxHits && totalMaxHits > 0) {
                    if (localStorage.getItem(badgeKey) !== "TB") localStorage.setItem(badgeKey, "FC");
                }
                localStorage.setItem(detailKey, JSON.stringify({
                    score: secureScore, maxCombo: secureMaxCombo, rate: finalRate,
                    judgeStats, totalMaxHits, playedAt: new Date().toISOString()
                }));
            }

            // ── 서버 전송 ──
            if (songParam && diffParam && userProfile) {
                try {
                    const response = await fetch(`${SERVER_BASE}/api/score`, {
                        method:"POST", headers:{"Content-Type":"application/json"},
                        body: JSON.stringify({ userId:secureUserId, userName:secureUserName, song:songParam, diff:diffParam, score:secureScore, maxCombo:secureMaxCombo, level:currentLv, signature:signatureToken, playTime:securePlayTime, details:judgeStats })
                    });
                    const resData = await response.json();
                    if (!response.ok || !resData.success) throw new Error(resData.error || "Server Validation Failed");
                    await fetch(`${SERVER_BASE}/api/user/update`, {
                        method:"POST", headers:{"Content-Type":"application/json"},
                        body: JSON.stringify({ userId:secureUserId, level:currentLv, xp:currentXp })
                    });
                } catch(err) {
                    console.error("🚨 서버 전송 중 에러:", err);
                    alert("점수 검증 에러: " + err.message);
                }
            }

            // ── 랭킹 ──
            let rankingHtml = '';
            try {
                const res = await fetch(`${SERVER_BASE}/api/ranking/${songParam}/${diffParam}`);
                const rankData = await res.json();
                if (rankData.length > 0) {
                    const rows = rankData.slice(0,5).map((r, idx) => {
                        const medal = idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':`#${idx+1}`;
                        const isMe  = userProfile && r.userId === secureUserId;
                        return `<div class="res-rank-entry${isMe?' is-me':''}">
                            <span class="res-rank-medal">${medal}</span>
                            <span class="res-rank-name">${r.userName}</span>
                            <span class="res-rank-score">${r.score}</span>
                        </div>`;
                    }).join('');
                    rankingHtml = `<div class="res-ranking-wrap">
                        <div class="res-ranking-title">TOP PLAYERS</div>
                        <div class="res-ranking-list">${rows}</div>
                    </div>`;
                }
            } catch(e) { console.warn("Ranking Load Fail", e); }

            // ── badge ──
            let badgeHtml = '';
            if (judgeStats.perfectEx === totalMaxHits && totalMaxHits > 0)
                badgeHtml = `<div class="res-badge-wrap"><span class="res-badge-tb">✦ TROLL BEAT ✦</span></div>`;
            else if (combo === totalMaxHits && totalMaxHits > 0)
                badgeHtml = `<div class="res-badge-wrap"><span class="res-badge-fc">✦ FULL COMBO ✦</span></div>`;

            // ── PB diff 표시 ──
            let pbHtml = '';
            if (savedScore > 0) {
                const sign = scoreDiff >= 0 ? '+' : '';
                const cls  = scoreDiff >= 0 ? '' : ' negative';
                pbHtml = `<div class="res-pb-diff${cls}">PERSONAL BEST ${sign}${scoreDiff.toLocaleString()}</div>`;
            }
            const newRecordHtml = isNewRecord
                ? `<div class="res-new-record">NEW RECORD</div>`
                : '';

            // ── 판정 bars ──
            const judgeRows = [
                { name:'Perfect!', val:judgeStats.perfectEx, color:'#ff80cc' },
                { name:'Perfect',  val:judgeStats.perfect,   color:'#FFE000' },
                { name:'Great',    val:judgeStats.great,     color:'#00F2FF' },
                { name:'Good',     val:judgeStats.good,      color:'#88FF00' },
                { name:'Not Bad',  val:judgeStats.notBad,    color:'#FFB300' },
                { name:'Save',     val:judgeStats.save,      color:'#FF7733' },
                { name:'Oh...',    val:judgeStats.oh,        color:'#FF2D78' },
                { name:'No...',    val:judgeStats.miss,      color:'#555566' },
            ];
            const judgeTotal = Math.max(1, judgeRows.reduce((sum, j) => sum + j.val, 0));
            const judgeHtml = judgeRows.map(j => {
                const ratio = j.val / judgeTotal;
                return `
                <div class="res-judge-row">
                    <span class="res-judge-name" style="color:${j.color}">${j.name}</span>
                    <div class="res-judge-bar-wrap">
                        <div class="res-judge-bar" style="color:${j.color};width:100%" data-ratio="${ratio.toFixed(4)}"></div>
                    </div>
                    <span class="res-judge-count">${j.val}</span>
                </div>`;
            }).join('');

            // ── Google login ──
            const loginHtml = (!userProfile)
                ? `<div id="google-login-btn-result" style="margin-bottom:10px;display:flex;justify-content:center;min-height:40px;"></div>`
                : '';

            // ── HTML 조립 ──
            resultOverlay.innerHTML = `
                <div class="res-bg"></div>
                <div class="res-layout">
                    <div class="res-hero">
                        <div class="res-eyebrow">RESULT ANALYSIS</div>
                        <div class="res-song-name">${resultSongInfo.title}</div>
                        <div class="res-diff-badge">${resultSongInfo.diffName} <span>Lv.${resultSongInfo.level}</span></div>
                        <div class="res-rank-hero">
                            <div class="res-grade ${rankCls}" style="color:${rankColor}">${rank}</div>
                            <div class="res-score-block">
                                <div class="res-score-label">SCORE</div>
                                <div class="res-score-value" id="result-score-value">000000</div>
                            </div>
                        </div>
                        ${newRecordHtml}
                        ${pbHtml}
                    </div>
                    <div class="res-panel">
                        ${badgeHtml}
                        <div class="res-stat-row">
                            <div class="res-stat">
                                <div class="res-stat-label">RATE</div>
                                <div class="res-stat-val" id="result-rate-value">0.00%</div>
                            </div>
                            <div class="res-stat">
                                <div class="res-stat-label">MAX COMBO</div>
                                <div class="res-stat-val">${secureMaxCombo}</div>
                            </div>
                        </div>
                        <div class="res-judge-title">JUDGMENT DETAIL</div>
                        <div class="res-judge-grid">${judgeHtml}</div>
                        ${rankingHtml}
                        ${loginHtml}
                        <div class="res-actions">
                            <button class="res-btn primary" onclick="location.href='select.html'">CONTINUE</button>
                            <button class="res-btn" onclick="location.reload()">RETRY</button>
                        </div>
                    </div>
                </div>`;

            resultOverlay.style.display = 'flex';

            // ── 카운트업 ──
            animateResultValue(document.getElementById('result-score-value'), secureScore,
                v => Math.floor(v).toString().padStart(6,'0'), 1600);
            animateResultValue(document.getElementById('result-rate-value'), finalRate,
                v => v.toFixed(2) + '%', 1400);

            // ── 판정 bar 애니메이션 (약간 딜레이 후 scaleX 적용) ──
            setTimeout(() => {
                resultOverlay.querySelectorAll('.res-judge-bar').forEach(bar => {
                    bar.style.transform = `scaleX(${parseFloat(bar.dataset.ratio || '0')})`;
                });
            }, 700);

            // ── Google 버튼 ──
            if (!userProfile && typeof google !== 'undefined') {
                google.accounts.id.renderButton(
                    document.getElementById("google-login-btn-result"),
                    { theme:"filled_black", size:"large", shape:"pill" }
                );
            }

        } catch(e) {
            alert("Result Error: " + e.message);
            location.href = 'index.html';
        }
    }

    async function sha256(message) {
        const msgBuffer  = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray  = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ★ 외부 노출
    window.startGame               = startGame;
    window.togglePause             = togglePause;
    window.handleCredentialResponse = handleCredentialResponse;

    })();
