<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WEB BEAT : TITLE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;600&display=swap');
        
        :root {
            --bg: #050505;
            --accent: #00e5ff;
            --accent-glow: rgba(0, 229, 255, 0.6);
            --secondary: #ff0055;
            --glass: rgba(255, 255, 255, 0.05);
            --gold: #ffd700;
            --text-main: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; color: #fff;
            font-family: 'Exo 2', sans-serif;
            overflow: hidden; user-select: none;
        }

        #bg-container {
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0d021a 0%, #000 100%); /* 議곌툑 ???대몼怨?源딆? 蹂대씪??*/
            z-index: -1;
            perspective: 800px;
            overflow: hidden;
        }

        /* 蹂꾨뱾???욎쑝濡??잛븘吏????븳 ?좊땲硫붿씠??*/
        .star {
            position: absolute;
            background: #fff; 
            border-radius: 50%;
            opacity: 0;
            animation: moveStar 4s linear infinite;
        }

        @keyframes moveStar {
            0% {
                transform: translateZ(-500px) scale(0);
                opacity: 0;
            }
            10% { opacity: 0.8; }
            90% { opacity: 1; }
            100% {
                transform: translateZ(500px) scale(3);
                opacity: 0;
            }
        }

        /* --- 吏꾩엯 ?ㅻ쾭?덉씠 --- */
        #entry-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: opacity 1s;
        }
        .entry-text { font-family: 'Orbitron'; font-size: 24px; letter-spacing: 10px; color: var(--accent); animation: pulse 1.5s infinite; }

        /* --- 硫붿씤 UI 而⑦뀒?대꼫 --- */
        #main-ui {
            height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0; transition: opacity 1s;
            position: relative;
        }

        /* --- ?꾨줈??移대뱶 (?댁떇?? --- */
        .profile-card {
            position: absolute; top: 30px; left: 40px;
            display: flex; flex-direction: column; gap: 6px;
            font-family: 'Orbitron'; z-index: 100;
            background: rgba(0,0,0,0.6); padding: 15px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .lv-label { font-size: 24px; color: var(--gold); font-weight: 900; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .xp-bar-bg { width: 180px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
        .xp-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #fff); width: 0%; transition: width 1s ease-out; }
        .xp-text { font-size: 11px; color: #aaa; margin-top: 2px; text-align: right; }
        
        .nickname-container { display: flex; align-items: center; gap: 10px; }
        #user-name-display { font-size: 14px; color: #fff; font-weight: bold; }
        .btn-edit-nick { background: none; border: none; cursor: pointer; color: #666; font-size: 14px; transition: 0.2s; padding: 0; }
        .btn-edit-nick:hover { color: var(--accent); }

        .custom-login-btn {
            margin-top: 10px; padding: 8px 0; width: 100%;
            background: var(--accent); border: none;
            color: #000; font-family: 'Orbitron'; font-weight: bold;
            font-size: 12px; cursor: pointer; border-radius: 4px; transition: 0.2s;
        }
        .custom-login-btn:hover { box-shadow: 0 0 15px var(--accent-glow); filter: brightness(1.1); }
        .btn-logout { background: #ff0055; color: #fff; }
        .btn-logout:hover { box-shadow: 0 0 15px rgba(255, 0, 85, 0.6); }
        .archive-btn {
            margin-top: 8px; padding: 8px 0; width: 100%;
            background: rgba(0,229,255,0.08); border: 1px solid rgba(0,229,255,0.25);
            color: var(--accent); font-family: 'Orbitron'; font-weight: 900;
            font-size: 11px; letter-spacing: 2px; cursor: pointer; border-radius: 4px;
            transition: 0.2s; text-transform: uppercase;
        }
        .archive-btn:hover { background: rgba(0,229,255,0.16); box-shadow: 0 0 18px rgba(0,229,255,0.28); }

        /* --- ?곗륫 ?곷떒 ?ㅼ젙 踰꾪듉 --- */
        .title-logo {
            font-family: 'Orbitron';
            font-size: 110px; 
            font-weight: 900; 
            font-style: italic;
            margin-bottom: 50px; 
            letter-spacing: -2px;
            color: #fff;
            background: linear-gradient(to bottom, #ffffff 30%, #a3e5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* ?ㅼ쨷 洹몃┝?먮줈 媛뺣젹??湲濡쒖슦 ?④낵 ?앹꽦 */
            filter: drop-shadow(0 0 10px rgba(0,229,255,0.6)) 
                    drop-shadow(0 0 30px rgba(0,229,255,0.3))
                    drop-shadow(0 0 60px rgba(255,0,85,0.3));
            animation: logoPulse 4s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(0,229,255,0.6)) drop-shadow(0 0 30px rgba(0,229,255,0.3)); }
            50% { filter: drop-shadow(0 0 20px rgba(0,229,255,0.9)) drop-shadow(0 0 40px rgba(255,0,85,0.6)); transform: scale(1.02); }
        }

        .mode-wrapper { 
            display: flex;
            gap: 60px; 
            perspective: 1500px; /* 3D ?쒓끝 源딆씠 議곗젙 */
        }

        /* --- 紐⑤뱶 移대뱶 踰좎씠??--- */
        .mode-card {
            position: relative;
            width: 380px; 
            height: 520px;
            background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px; 
            overflow: hidden; 
            cursor: pointer;
            backdrop-filter: blur(20px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ?쇱そ 移대뱶???ㅻⅨ履쎌쑝濡? ?ㅻⅨ履?移대뱶???쇱そ?쇰줈 鍮꾩뒪?ы엳 ?뺥엳湲?*/
        .mode-card.single { 
            --card-color: var(--accent);
            --card-glow: rgba(0, 229, 255, 0.4); 
            transform: rotateY(20deg) rotateX(5deg);
        }
        .mode-card.multi { 
            --card-color: var(--secondary);
            --card-glow: rgba(255, 0, 85, 0.4); 
            transform: rotateY(-20deg) rotateX(5deg);
        }

        /* 留덉슦???몃쾭 ???뺣㈃?쇰줈 ??대굹?ㅻ뒗 洹뱀쟻???④낵 */
        .mode-card:hover {
            transform: rotateY(0deg) rotateX(0deg) translateY(-25px) scale(1.05) !important;
            border-color: var(--card-color); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 40px var(--card-glow);
        }
        .single { --card-color: var(--accent); --card-glow: rgba(0, 229, 255, 0.3); }
        .multi { --card-color: var(--secondary); --card-glow: rgba(255, 0, 85, 0.3); }

        .card-bg-text {
            position: absolute; top: -20px; right: -20px;
            font-family: 'Orbitron'; font-size: 120px; font-weight: 900; opacity: 0.03;
            color: #fff; pointer-events: none;
        }
        .card-content {
            height: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px;
            box-sizing: border-box; text-align: center;
        }
        .mode-icon { font-size: 80px; margin-bottom: 30px; filter: drop-shadow(0 0 10px var(--card-color)); }
        .mode-name { font-family: 'Orbitron'; font-size: 36px; font-weight: 700; margin-bottom: 20px; color: var(--card-color); }
        .mode-desc { font-size: 16px; color: #aaa; line-height: 1.6; }
        .scanline {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        /* --- ?ㅼ젙 諛?怨듯넻 紐⑤떖 ?ㅽ???--- */
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.8); z-index: 2000; 
            justify-content: center; align-items: center; backdrop-filter: blur(8px); animation: fadeIn 0.3s; 
        }
        .modal-box { 
            background: #121216; border: 1px solid #333; border-radius: 16px; 
            padding: 40px; box-shadow: 0 0 60px rgba(0,0,0,0.8); text-align: center; 
            min-width: 400px; position: relative; 
        }
        .modal-title { 
            font-family: 'Orbitron'; font-size: 24px; color: var(--accent); 
            margin-bottom: 30px; letter-spacing: 2px; border-bottom: 1px solid #333; padding-bottom: 15px; 
        }
        .btn-full { 
            width: 100%; padding: 14px; margin-top: 15px; background: #222; 
            border: 1px solid #444; color: var(--accent); font-family: 'Orbitron'; 
            font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s; 
        }
        .btn-full:hover { background: #333; border-color: var(--accent); }

        /* ??諛붿씤???ㅽ???*/
        /* ?깊겕 留덈쾿???ㅽ???*/
        /* ?됰꽕???낅젰 紐⑤떖 ?명뭼 */
        .modal-input { background: transparent; border: none; border-bottom: 2px solid var(--accent); color: #fff; font-size: 24px; font-family: 'Orbitron'; text-align: center; width: 100%; outline: none; padding: 10px; margin: 20px 0; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="bg-container"></div>

    <div id="entry-overlay" onclick="startLobby()">
        <div class="entry-text">CLICK TO START</div>
    </div>

    <div id="main-ui">
        
        <div class="profile-card" id="profile-container" style="display:none;">
            <div class="lv-label" id="user-lv">LV. 1</div>
            <div class="xp-bar-bg"><div class="xp-bar-fill" id="user-xp-fill"></div></div>
            <div class="xp-text" id="user-xp-text">0 / 500 XP</div>
            <div class="nickname-container" style="margin-top:8px;">
                <div id="user-name-display">GUEST MODE</div>
                <button id="btn-edit-nick" class="btn-edit-nick" onclick="openNicknameModal(true)" style="display:none;">EDIT</button>
            </div>
            <button id="main-login-btn" class="custom-login-btn" onclick="handleAuth()">LOGIN</button>
            <button class="archive-btn" onclick="location.href='archive.html'">ARCHIVE</button>
        </div>

        <div class="title-logo">WEB BEAT</div>

        <div class="mode-wrapper">
            <div class="mode-card single" onclick="location.href='select.html'">
                <div class="scanline"></div>
                <div class="card-bg-text">01</div>
                <div class="card-content">
                    <div class="mode-icon">&#9835;</div>
                    <div class="mode-name">SINGLE PLAY</div>
                    <div class="mode-desc">Play at your own pace.<br>Choose a song and chase your best score.</div>
                </div>
            </div>

            <div class="mode-card multi" onclick="location.href='multi.html'">
                <div class="scanline"></div>
                <div class="card-bg-text">02</div>
                <div class="card-content">
                    <div class="mode-icon">VS</div>
                    <div class="mode-name">RANKED MATCH</div>
                    <div class="mode-desc">Compete in real time.<br>Climb the ladder against other players.</div>
                </div>
            </div>
        </div>
    </div>


    <div id="name-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">IDENTITY SETUP</div>
            <p style="color:#888;">Please register your nickname.</p>
            <input type="text" id="nickname-input" class="modal-input" placeholder="ENTER NAME" maxlength="12">
            <button class="btn-full" onclick="saveNicknameToServer()">CONFIRM</button>
        </div>
    </div>


    <script>
        const API_BASE = "https://port-0-vibecoding-rhythmgame-server-mkgu8rcq7cd54e6c.sel3.cloudtype.app";

        // --- 諛곌꼍 蹂??앹꽦 ---
        const bg = document.getElementById('bg-container');
        for(let i=0; i<150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = star.style.height = Math.random() * 3 + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            bg.appendChild(star);
        }

        // --- BGM 諛?吏꾩엯 ---
        const titleBgm = new Audio('BGM/title.mp3'); 
        titleBgm.loop = true; 
        titleBgm.volume = 0.5;

        function startLobby() {
            document.getElementById('entry-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('entry-overlay').style.display = 'none';
                document.getElementById('main-ui').style.opacity = '1';
            }, 1000);
            
            // [???섏젙] ?대┃ ??BGM ?ъ깮
            titleBgm.play().catch(e => console.log("Audio play failed", e));
        }

        // --- 珥덇린??---
        window.onload = function() {
            checkLoginStatus(); // 濡쒓렇???곹깭 ?뺤씤
            
            // 濡쒓렇??吏곹썑 ?됰꽕???ㅼ젙 紐⑤떖 ?꾩슦湲?泥섎━
            const justLoggedIn = localStorage.getItem('wb_just_logged_in');
            if (justLoggedIn === 'true') {
                openNicknameModal(true);
                localStorage.removeItem('wb_just_logged_in'); 
            }
        };

        // ==========================================
        // ??[濡쒓렇??諛??꾨줈??濡쒖쭅 (?댁떇??] ??
        // ==========================================
        function openNicknameModal(forceOpen) { 
            if (!forceOpen && localStorage.getItem('wb_nickname')) { 
                checkLoginStatus(); return; 
            } 
            const modal = document.getElementById('name-modal'); 
            const input = document.getElementById('nickname-input'); 
            const googleProfile = JSON.parse(localStorage.getItem('wb_auth_profile') || '{}'); 
            const currentNick = localStorage.getItem('wb_nickname'); 
            input.value = currentNick || googleProfile.name || ""; 
            modal.style.display = 'flex'; 
        }

        async function saveNicknameToServer() { 
            const input = document.getElementById('nickname-input'); 
            const newNickname = input.value.trim(); 
            if (newNickname.length < 2 || newNickname.length > 12) { 
                alert("Please enter 2 to 12 characters."); return; 
            } 
            localStorage.setItem('wb_nickname', newNickname); 
            const profile = JSON.parse(localStorage.getItem('wb_auth_profile') || '{}'); 
            if (profile.sub) { 
                try { 
                    await fetch(`${API_BASE}/api/user/update`, { 
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify({ userId: profile.sub, nickname: newNickname }) 
                    }); 
                } catch (e) { console.error(e); } 
            } 
            document.getElementById('name-modal').style.display = 'none'; 
            checkLoginStatus(); 
            alert(`Welcome, ${newNickname}!`); 
        }

        function checkLoginStatus() { 
            const btn = document.getElementById('main-login-btn'); 
            const profileContainer = document.getElementById('profile-container'); 
            const nameDisplay = document.getElementById('user-name-display'); 
            const editBtn = document.getElementById('btn-edit-nick'); 
            const isLoggedIn = localStorage.getItem('wb_logged_in') === 'true'; 
            
            if (isLoggedIn) { 
                if(btn) { btn.innerText = "LOGOUT"; btn.classList.add('btn-logout'); btn.onclick = handleAuth; } 
                profileContainer.style.display = "flex"; 
                const nick = localStorage.getItem('wb_nickname'); 
                if(nameDisplay) { nameDisplay.innerText = nick ? nick : "PLAYER"; nameDisplay.style.color = "#00e5ff"; } 
                if(editBtn) editBtn.style.display = "block"; 
                updateProfile(); 
            } else { 
                if(btn) { btn.innerText = "LOGIN"; btn.classList.remove('btn-logout'); btn.onclick = handleAuth; } 
                profileContainer.style.display = "flex"; 
                if(nameDisplay) { nameDisplay.innerText = "GUEST MODE"; nameDisplay.style.color = "#888"; } 
                if(editBtn) editBtn.style.display = "none"; 
            } 
        }

        function handleAuth() { 
            const isLoggedIn = localStorage.getItem('wb_logged_in') === 'true'; 
            if (isLoggedIn) { 
                if(confirm("Log out?")) { localStorage.clear(); location.reload(); } 
            } else { location.href = 'login.html'; } 
        }

        function updateProfile() { 
            const lv = parseInt(localStorage.getItem('wb_user_lv') || "1"); 
            const xp = parseInt(localStorage.getItem('wb_user_xp') || "0"); 
            const nextXp = lv * 500; 
            document.getElementById('user-lv').innerText = `LV. ${lv}`; 
            document.getElementById('user-xp-fill').style.width = `${Math.min(100, xp/nextXp*100)}%`; 
            document.getElementById('user-xp-text').innerText = `${xp} / ${nextXp} XP`; 
        }

    </script>
</body>
</html>
